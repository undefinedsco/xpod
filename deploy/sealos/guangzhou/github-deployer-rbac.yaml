apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-xpod-deployer
  namespace: ns-iknkxtc8
  labels:
    app.kubernetes.io/name: github-xpod-deployer
    app.kubernetes.io/part-of: undefineds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-xpod-deployer
  namespace: ns-iknkxtc8
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [xpod-rc]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-xpod-deployer
  namespace: ns-iknkxtc8
subjects:
  - kind: ServiceAccount
    name: github-xpod-deployer
    namespace: ns-iknkxtc8
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-xpod-deployer
