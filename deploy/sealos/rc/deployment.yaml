apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpod-rc
  namespace: xpod-rc
  labels:
    app: xpod-rc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 2100
  selector:
    matchLabels:
      app: xpod-rc
  template:
    metadata:
      labels:
        app: xpod-rc
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xpod
        image: ghcr.io/undefinedsco/xpod:replace-me
        imagePullPolicy: IfNotPresent
        args:
        - node
        - dist/main.js
        - -c
        - config/cloud.json
        - -p
        - '3000'
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: production
        - name: XPOD_EDITION
          value: cloud
        - name: XPOD_PORT
          value: '3000'
        - name: CSS_LOGGING_LEVEL
          value: info
        - name: XPOD_INNGEST_ENABLED
          value: 'true'
        - name: XPOD_INNGEST_MODE
          value: managed
        - name: XPOD_INNGEST_BASE_URL
          value: http://xpod-inngest:8288
        - name: XPOD_INNGEST_SOURCE
          value: rc
        - name: CSS_SEED_CONFIG
          value: /app/config/seeds/rc.json
        envFrom:
        - configMapRef:
            name: xpod-rc-config
            optional: true
        - secretRef:
            name: xpod-rc-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /service/status
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /service/status
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /service/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          limits:
            cpu: 250m
            memory: 1536Mi
          requests:
            cpu: 250m
            memory: 1536Mi
        volumeMounts:
        - name: xpod-rc-seed
          mountPath: /app/config/seeds
          readOnly: true
        - name: xpod-logs
          mountPath: /app/logs
        - name: xpod-data
          mountPath: /app/data
      volumes:
      - name: xpod-rc-seed
        secret:
          secretName: xpod-rc-seed-secret
      - name: xpod-logs
        emptyDir: {}
      - name: xpod-data
        emptyDir: {}
