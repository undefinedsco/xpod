apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpod-rc
  namespace: xpod-rc
  labels:
    app: xpod-rc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: xpod-rc
  template:
    metadata:
      labels:
        app: xpod-rc
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: xpod
          image: ghcr.io/undefinedsco/xpod:replace-me
          imagePullPolicy: IfNotPresent
          args:
            - node
            - dist/main.js
            - -c
            - config/cloud.json
            - -p
            - "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: XPOD_EDITION
              value: cloud
            - name: XPOD_PORT
              value: "3000"
            - name: CSS_PORT
              value: "6300"
            - name: API_PORT
              value: "6301"
            - name: CSS_LOGGING_LEVEL
              value: info
            - name: CSS_BASE_URL
              value: https://id-rc.undefineds.co
            - name: CSS_ALLOWED_HOSTS
              value: id-rc.undefineds.co,pods-rc.undefineds.co,api-rc.undefineds.co
            - name: XPOD_EDGE_NODES_ENABLED
              value: "false"
            - name: XPOD_INNGEST_ENABLED
              value: "true"
            - name: XPOD_INNGEST_MODE
              value: managed
            - name: XPOD_INNGEST_BASE_URL
              value: http://xpod-inngest:8288
            - name: XPOD_API_BASE_URL
              value: http://xpod-rc
            - name: XPOD_INNGEST_SOURCE
              value: rc
          envFrom:
            - configMapRef:
                name: xpod-rc-config
                optional: true
            - secretRef:
                name: xpod-rc-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /service/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /service/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /service/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: xpod-logs
              mountPath: /app/logs
            - name: xpod-data
              mountPath: /app/data
      volumes:
        - name: xpod-logs
          emptyDir: {}
        - name: xpod-data
          emptyDir: {}
