apiVersion: v1
kind: ConfigMap
metadata:
  name: xpod-rc-config
  namespace: xpod-rc
data:
  NODE_ENV: production
  XPOD_EDITION: cloud
  XPOD_PORT: "3000"
  CSS_PORT: "6300"
  API_PORT: "6301"
  CSS_LOGGING_LEVEL: info

  CSS_BASE_URL: https://rc.id.undefineds.co
  CSS_ALLOWED_HOSTS: rc.id.undefineds.co
  CSS_BASE_STORAGE_DOMAIN: rc.id.undefineds.co

  XPOD_EDGE_NODES_ENABLED: "true"
