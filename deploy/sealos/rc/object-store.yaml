apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xpod-rc-minio
  namespace: xpod-rc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-lvmpv-node
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpod-rc-minio
  namespace: xpod-rc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xpod-rc-minio
  template:
    metadata:
      labels:
        app: xpod-rc-minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: xpod-rc-object-store
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xpod-rc-object-store
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xpod-rc-minio
---
apiVersion: v1
kind: Service
metadata:
  name: xpod-rc-minio
  namespace: xpod-rc
spec:
  selector:
    app: xpod-rc-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xpod-rc-minio-init
  namespace: xpod-rc
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: create-bucket
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command:
            - /bin/sh
            - -c
            - >-
              until mc alias set rc http://xpod-rc-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
              do sleep 2; done;
              mc mb --ignore-existing rc/xpod-rc
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: xpod-rc-object-store
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xpod-rc-object-store
                  key: secret-key
