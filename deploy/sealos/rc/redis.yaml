apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpod-rc-redis
  namespace: xpod-rc
  labels:
    app: xpod-rc-redis
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: xpod-rc-redis
  template:
    metadata:
      labels:
        app: xpod-rc-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xpod-rc-redis
  namespace: xpod-rc
  labels:
    app: xpod-rc-redis
spec:
  type: ClusterIP
  selector:
    app: xpod-rc-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
