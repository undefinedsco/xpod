apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xpod-rc
  namespace: xpod-rc
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
spec:
  tls:
    - hosts:
        - rc.id.undefineds.co
      secretName: xpod-rc-tls
  rules:
    - host: rc.id.undefineds.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xpod
                port:
                  name: http
