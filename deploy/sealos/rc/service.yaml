apiVersion: v1
kind: Service
metadata:
  name: xpod-rc
  namespace: xpod-rc
  labels:
    app: xpod-rc
spec:
  selector:
    app: xpod-rc
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: xpod-rc-gateway
  namespace: xpod-rc
  labels:
    app: xpod-rc-gateway
spec:
  selector:
    app: gateway
  ports:
    - name: api
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: id
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: pods
      port: 8083
      targetPort: 8083
      protocol: TCP
  type: ClusterIP
