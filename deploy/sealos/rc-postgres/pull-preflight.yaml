# Template rendered with a unique per-run name and the assigned namespace.
# tcr-creds is an existing authorization declaration; its current usability
# must be proved by the fresh UID / Always-pull gate before RC mutation.
apiVersion: batch/v1
kind: Job
metadata:
  name: xpod-rc-pg-preflight
  labels:
    app: xpod-rc-pg-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: xpod-rc-pg-preflight
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: tcr-creds
      containers:
        - name: postgres-preflight
          image: ghcr.io/undefinedsco/xpod-rdf-postgres@sha256:156b6ef3a27d5ee43b8aa54c16583b288cfb33e47e532aaa1f377515f187fed5
          imagePullPolicy: Always
          command: [sh, -c]
          args:
            - |
              set -eu
              postgres --version
              test -f /usr/share/postgresql/17/extension/vector.control
              test -f /usr/share/postgresql/17/extension/xpod_rdf.control
              test -f /usr/share/postgresql/17/extension/xpod_qlever.control
              echo 'xpod-rc-pg-preflight: ok'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
