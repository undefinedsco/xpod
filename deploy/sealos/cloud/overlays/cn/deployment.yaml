# Exported from the live deployment on 2026-10-06; it records what that
# environment actually runs, including the differences between them.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xpod-cloud
    app.kubernetes.io/managed-by: codex-business-sync
    app.kubernetes.io/part-of: xpod
  name: xpod-cn
  namespace: ns-iknkxtc8
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: xpod-cn
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xpod-cn
        app.kubernetes.io/part-of: undefineds
    spec:
      containers:
      - args:
        - node
        - dist/main.js
        - -c
        - config/cloud.json
        - -p
        - '3000'
        env:
        - name: XPOD_INNGEST_ENABLED
          value: 'true'
        - name: XPOD_INNGEST_MODE
          value: managed
        - name: XPOD_INNGEST_BASE_URL
          value: http://xpod-inngest:8288
        - name: XPOD_API_BASE_URL
          value: https://api.undefineds.cn
        - name: CSS_REDIS_CLIENT
          valueFrom:
            secretKeyRef:
              key: CSS_REDIS_CLIENT
              name: xpod-cloud-secret
        - name: CSS_ROOT_FILE_PATH
          value: /app/data
        envFrom:
        - configMapRef:
            name: xpod-cloud-config
            optional: true
        - secretRef:
            name: xpod-cloud-secret
        image: ghcr.io/undefinedsco/xpod@sha256:2dd99a431810ce757b91f7c3ed55017004aadc58d44110ce1734861522b01ddc
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /service/status
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 3
        name: xpod
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /service/status
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 1536Mi
          requests:
            cpu: 250m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /service/status
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/.internal
          name: xpod-storage
          subPath: internal
        - mountPath: /app/.xpod
          name: xpod-storage
          subPath: runtime
        - mountPath: /app/logs
          name: xpod-storage
          subPath: logs
        - mountPath: /app/data
          name: xpod-storage
          subPath: data
        - mountPath: /app/config/cloud.json
          name: xpod-cloud-runtime-config
          readOnly: true
          subPath: cloud.json
        - mountPath: /app/config/cloud.enterprise.json
          name: enterprise-rdf-config
          subPath: cloud.enterprise.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: xpod-registry
      - name: rdf-parity-ghcr
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /persistent/internal /persistent/runtime /persistent/logs /persistent/data
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        name: prepare-storage
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /persistent
          name: xpod-storage
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: xpod-storage
        persistentVolumeClaim:
          claimName: xpod-cloud-storage
      - configMap:
          defaultMode: 420
          name: xpod-cloud-runtime-config
        name: xpod-cloud-runtime-config
      - configMap:
          defaultMode: 420
          name: xpod-enterprise-rdf-config
        name: enterprise-rdf-config
