apiVersion: batch/v1
kind: Job
metadata:
  name: MIGRATION_JOB
  namespace: MIGRATION_NAMESPACE
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: xpod-pgvector-migration
    spec:
      restartPolicy: Never
      containers:
        - name: pgvector-migration
          image: ghcr.io/undefinedsco/xpod:MIGRATION_IMAGE_TAG
          imagePullPolicy: Always
          command: ["node", "--input-type=module", "-e"]
          args:
            - |
              import { Client } from 'pg';
              const connectionString = process.env.CSS_SPARQL_ENDPOINT;
              if (!connectionString) throw new Error('CSS_SPARQL_ENDPOINT is required');
              const client = new Client({ connectionString });
              try {
                await client.connect();
                await client.query('CREATE EXTENSION IF NOT EXISTS vector');
                const result = await client.query("SELECT extversion FROM pg_extension WHERE extname = 'vector'");
                if (result.rows.length !== 1) throw new Error('pgvector extension verification failed');
                console.log('pgvector extension ready (' + result.rows[0].extversion + ')');
              } finally {
                await client.end();
              }
          env:
            - name: CSS_SPARQL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: xpod-cloud-secret
                  key: CSS_SPARQL_ENDPOINT
