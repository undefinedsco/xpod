name: Build QLever macOS runtime

on:
  workflow_call:
    inputs:
      target:
        description: Native macOS target from the shared module target catalog
        type: string
        default: darwin-arm64
    outputs:
      artifact_name:
        description: Accepted native macOS runtime artifact name
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_id:
        description: Exact uploaded native artifact identity
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_digest:
        description: Original uploaded ZIP digest
        value: ${{ jobs.build.outputs.artifact_digest }}
      source_sha:
        description: Actual native acceptance source
        value: ${{ jobs.build.outputs.source_sha }}
      run_id:
        description: Producing workflow run
        value: ${{ jobs.build.outputs.run_id }}
      run_attempt:
        description: Producing workflow attempt
        value: ${{ jobs.build.outputs.run_attempt }}
  # Kept runnable on its own so a toolchain or cache change can be exercised
  # without waiting for a full release candidate.
  workflow_dispatch:
    inputs:
      target:
        description: Native macOS target from the shared module target catalog
        type: string
        default: darwin-arm64
  # Caches are branch-scoped: a release branch can only restore its own caches
  # and the default branch's, never another feature branch's. Priming here is
  # therefore what makes every release candidate start warm; without it the
  # first run on each new `release/*` branch pays the full cold build. The path
  # filter keeps this off unrelated pushes.
  push:
    branches: [ main ]
    paths:
      - 'qlever/**'
      - '.github/workflows/build-qlever-macos-runtime.yml'

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/resolve-qlever-native-target.yml
    with:
      target: ${{ inputs.target || 'darwin-arm64' }}
      platform: darwin
  build:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify the actual native producer host
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
        run: bun scripts/module-product-targets.ts css "$TARGET" --require-host

      - name: Resolve immutable artifact identity
        id: metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_source=$(git rev-parse HEAD)
          test "$actual_source" = "$SOURCE_SHA"
          echo "source_sha=$actual_source" >> "$GITHUB_OUTPUT"
          echo "artifact_name=qlever-local-runtime-${{ needs.resolve.outputs.target }}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      # Reuse the finished runtime, not just compiler objects. Xpod-only commits
      # must not trigger C++ compilation; native inputs/toolchain changes do.
      - name: Resolve native toolchain identity
        id: toolchain
        run: |
          set -euo pipefail
          identity=$(xcrun clang --version | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore verified native runtime
        id: runtime_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xpod-qlever-runtime
          key: qlever-macos-runtime-v1-${{ runner.arch }}-15-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('qlever/**', '.github/workflows/build-qlever-macos-runtime.yml', 'scripts/release-gate-evidence.cjs') }}

      - name: Cache Homebrew downloads
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          # The formula list lives in this file, so editing it invalidates the
          # cache on purpose: a stale download cache must never decide which
          # bottles the build links against.
          key: brew-${{ runner.os }}-15-${{ hashFiles('.github/workflows/build-qlever-macos-runtime.yml') }}

      - name: Install the upstream native toolchain
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install boost icu4c openssl@3 zstd jemalloc pkg-config sqlite dylibbundler ninja ccache

      - name: Cache the compiler cache
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          # ccache validates compiler, flags and sources itself, so the key only
          # decides the hit rate: it turns over when the pinned QLever revision
          # or the build script changes, and restore-keys reuse the rest.
          key: ccache-${{ runner.os }}-15-${{ hashFiles('qlever/qlever.lock.json') }}-${{ hashFiles('qlever/scripts/build-macos-local-runtime.sh') }}
          # Deliberately broad: only the key decides which archive is restored,
          # never whether an object may be used - ccache re-hashes compiler,
          # flags and sources itself, so a stale archive costs a miss, not a
          # wrong binary. A narrow prefix would throw away every object on the
          # next QLever bump.
          restore-keys: |
            ccache-${{ runner.os }}-15-

      - name: Resolve build parallelism
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        id: parallelism
        run: |
          set -euo pipefail
          cpus=$(sysctl -n hw.ncpu)
          # One QLever translation unit is worth a gigabyte or more, so cap the
          # fan-out at one job per 2 GB instead of trusting the core count alone.
          # A larger runner then uses its cores; this one stays where it was, with
          # the numbers it decided from written into the log.
          memory_bytes=$(sysctl -n hw.memsize 2>/dev/null || echo 0)
          memory_cap=$(( memory_bytes / 1073741824 / 2 ))
          jobs=$cpus
          if [ "$memory_cap" -ge 1 ] && [ "$jobs" -gt "$memory_cap" ]; then jobs=$memory_cap; fi
          echo "cpus=$cpus memory_bytes=$memory_bytes memory_cap=$memory_cap jobs=$jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Build, bundle, sign, and smoke the native runtime
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          XPOD_QLEVER_WORKSPACE_ROOT: ${{ github.workspace }}
          XPOD_QLEVER_PLATFORM_BUILD_ROOT: ${{ runner.temp }}/xpod-qlever-macos
          XPOD_QLEVER_PLATFORM_RUNTIME_ARCHIVE: ${{ runner.temp }}/xpod-qlever-runtime/qlever-local-runtime-${{ needs.resolve.outputs.target }}.tar.gz
          XPOD_QLEVER_BUILD_JOBS: ${{ steps.parallelism.outputs.jobs }}
        run: qlever/scripts/build-macos-local-runtime.sh

      - name: Verify and smoke the reused native runtime
        if: steps.runtime_cache.outputs.cache-hit == 'true'
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/xpod-qlever-runtime
          SMOKE_ROOT: ${{ runner.temp }}/xpod-qlever-reuse-smoke
        run: |
          set -euo pipefail
          prior_source=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNTIME_ROOT + "/qlever-local-acceptance.json", "utf8")).sourceSha')
          node scripts/release-gate-evidence.cjs verify-qlever-local \
            --source-sha "$prior_source" \
            --evidence "$RUNTIME_ROOT/qlever-local-acceptance.json" \
            --expected-archive "$RUNTIME_ROOT/qlever-local-runtime-${{ needs.resolve.outputs.target }}.tar.gz"
          mkdir -p "$SMOKE_ROOT"
          tar -xzf "$RUNTIME_ROOT/qlever-local-runtime-${{ needs.resolve.outputs.target }}.tar.gz" -C "$SMOKE_ROOT"
          python3 qlever/scripts/verify-local-runtime-artifacts.py \
            --prefix "$SMOKE_ROOT" --lock qlever/qlever.lock.json \
            --build-source macos-${{ needs.resolve.outputs.arch }} --smoke-database "$RUNNER_TEMP/qlever-reuse-smoke.sqlite"

      # Runs only after the real runtime smoke (ready/ABI/RDF/FTS/VEC/shutdown)
      # succeeded, so the recorded hashes describe a functionally verified build.
      - name: Bind the qlever-local acceptance evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNTIME_ARCHIVE: ${{ runner.temp }}/xpod-qlever-runtime/qlever-local-runtime-${{ needs.resolve.outputs.target }}.tar.gz
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.cjs create-qlever-local \
            --source-sha "$SOURCE_SHA" \
            --archive "$RUNTIME_ARCHIVE" \
            --abi-platform macos-${{ needs.resolve.outputs.arch }} \
            --smoke-command 'verify-local-runtime-artifacts.py --build-source macos-${{ needs.resolve.outputs.arch }} (fresh or reused runtime: ready/ABI/RDF/FTS/VEC/shutdown smoke)' \
            --out "$(dirname "$RUNTIME_ARCHIVE")/qlever-local-acceptance.json"

      - name: Report compiler cache statistics
        if: always() && steps.runtime_cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache --show-stats --verbose || true

      - name: Upload the exact native runtime
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/xpod-qlever-runtime/qlever-local-runtime-${{ needs.resolve.outputs.target }}.tar.gz
            ${{ runner.temp }}/xpod-qlever-runtime/qlever-local-acceptance.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
