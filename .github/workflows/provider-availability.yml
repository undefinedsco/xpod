name: Provider Availability

# Independent third-party upstream monitoring only.
#
# This workflow is intentionally NOT a candidate/release gate and no candidate
# job may `needs` it. It discovers models from, and performs one real Chat
# completion against, a configured OpenAI-compatible upstream. It never
# exercises Xpod, a Pod, shared RC deployment or release acceptance, and it
# does not claim RC/product acceptance.
#
# There is no `schedule`: the rc environment (the only place the existing
# XPOD_LIVE_PROVIDER_API_KEY_CONFIG secret is available) is staging-only.
# Widen no policy; run it from staging with workflow_dispatch or a relevant
# staging push.
on:
  workflow_dispatch:
  push:
    branches: ['staging']
    paths:
      - '.github/workflows/provider-availability.yml'
      - 'scripts/check-provider-availability.ts'
      - 'scripts/helpers/chat-acceptance.ts'
      - 'packages/ai-connections-runtime/src/contract/provider-catalog.ts'
      - 'packages/ai-connections-runtime/src/contract/ai-connections-client.ts'
      - 'packages/ai-connections-runtime/src/contract/client/**'
      - 'packages/ai-connections/src/contract/provider-catalog.ts'
      - 'src/api/ai-gateway/providers/**'
      - 'tests/scripts/provider-availability.test.ts'

concurrency:
  # Serialize upstream probes so overlapping runs cannot hide an outage or
  # multiply third-party calls. An in-flight probe is never cancelled.
  group: xpod-provider-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provider-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rc
    steps:
      - name: Require the staging source branch
        # The rc environment is staging-only. A manual dispatch from any other
        # branch must fail explicitly instead of silently reusing rc policy.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF:-}" != "refs/heads/staging" ]; then
            echo "::error::provider availability is staging-only; dispatch it from staging"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The monitor reads the shared provider/offering catalog through its
      # published package export, exactly as product code does. Build only the
      # capability package and its type-only prerequisite; no product bundle or
      # candidate artifact is produced.
      - run: |
          bun run --filter @undefineds.co/extension-host-contracts build
          bun run --filter @undefineds.co/ai-connections-runtime build

      - name: Probe upstream models and one real Chat completion
        # Existing canary secret, scoped to this step only; no new secret and no
        # cross-job transfer.
        env:
          XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
        # The probe owns its exit status. It writes the safe report and fails
        # this step on an unavailable upstream; the upload and the final gate
        # below still run, and nothing turns that failure into success.
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/provider-availability"
          report_file="${report_dir}/provider-availability.json"
          mkdir -p "$report_dir"
          umask 077
          credential_file="${RUNNER_TEMP}/provider-availability-api-key"
          cleanup() { rm -f "$credential_file"; }
          trap cleanup EXIT
          if [ -n "${XPOD_LIVE_PROVIDER_API_KEY_CONFIG:-}" ]; then
            printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$credential_file"
          fi
          # No file means no credential: the monitor reports unconfigured and
          # this step fails. It never claims an upstream pass without a key.
          bun scripts/check-provider-availability.ts \
            --credential-file "$credential_file" \
            --output "$report_file"

      - name: Upload the safe provider availability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-availability-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-availability/provider-availability.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail this run unless the upstream actually passed
        if: always()
        run: |
          set -euo pipefail
          node - "${RUNNER_TEMP}/provider-availability/provider-availability.json" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          if (!fs.existsSync(file)) {
            console.error('::error::provider availability report is missing');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          // Only allowlisted fields are printed; raw ids never reach logs.
          if (report.configured !== true) {
            console.error(`::error::provider availability is unconfigured (${report.category ?? 'unknown'}); no upstream pass is claimed`);
            process.exit(1);
          }
          if (report.status !== 'passed' || report.success !== true) {
            console.error(`::error::provider upstream unavailable: phase=${report.phase ?? 'unknown'} httpStatus=${report.httpStatus ?? 'none'} category=${report.category ?? 'unknown'}`);
            process.exit(1);
          }
          console.log(`provider upstream passed: phase=${report.phase} httpStatus=${report.httpStatus} modelIdHash=${report.modelIdHash ?? 'none'}`);
          NODE
