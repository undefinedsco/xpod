name: CSS module preview product pilot

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test tests/bun/css-module-producer.test.ts

  native:
    needs: contract
    uses: ./.github/workflows/build-qlever-macos-runtime.yml

  darwin-arm64-preview:
    needs: [contract, native]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Produce the normal CSS preview
        env:
          GH_TOKEN: ${{ github.token }}
          CSS_NATIVE_ARTIFACT_ID: ${{ needs.native.outputs.artifact_id }}
          CSS_NATIVE_ARTIFACT_DIGEST: ${{ needs.native.outputs.artifact_digest }}
          CSS_NATIVE_SOURCE_SHA: ${{ needs.native.outputs.source_sha }}
          CSS_NATIVE_RUN_ID: ${{ needs.native.outputs.run_id }}
          CSS_NATIVE_RUN_ATTEMPT: ${{ needs.native.outputs.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$GITHUB_WORKSPACE/.test-data"
          root="$GITHUB_WORKSPACE/.test-data/css-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-darwin-arm64"
          echo "CSS_PRODUCT_ROOT=$root" >> "$GITHUB_ENV"
          python3 scripts/css-module-producer.py --out "$root"
      - name: Upload original preview and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: css-module-products-darwin-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CSS_PRODUCT_ROOT }}/product.tgz
            ${{ env.CSS_PRODUCT_ROOT }}/producer.receipt.json
            ${{ env.CSS_PRODUCT_ROOT }}/evidence/
            ${{ env.CSS_PRODUCT_ROOT }}/originals/
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure() && env.CSS_PRODUCT_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: css-module-diagnostics-darwin-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CSS_PRODUCT_ROOT }}/producer.receipt.json
            ${{ env.CSS_PRODUCT_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 30
