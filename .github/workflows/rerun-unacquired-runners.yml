name: Rerun jobs GitHub could not schedule

# Hosted macOS arm64 capacity is short: a queued job is cancelled after ~15 minutes with
# "The job was not acquired by Runner of type hosted even after multiple attempts", and the
# whole run fails although nothing was tested. Rerun the failed jobs of such a run once.
# Only the first attempt is retried, and only when GitHub itself reported the scheduling
# failure; the stable `Release` workflow is deliberately not listed.
on:
  workflow_run:
    workflows:
      - Release Candidate
      - AgentFS module mounted development acceptance
      - AgentFS cache development gate
      - AFS JS normal archive consumer
      - CLI package
      - CSS module preview products
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs when a runner was never acquired
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          unacquired=0
          for job in $(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs" --paginate \
              -q '.jobs[] | select(.conclusion == "cancelled" or .conclusion == "failure") | .id'); do
            if gh api "repos/$REPO/check-runs/$job/annotations" -q '.[].message' \
                | grep -q 'was not acquired by Runner'; then
              unacquired=1
              break
            fi
          done
          if [ "$unacquired" -eq 0 ]; then
            echo "No job lost its runner; nothing to rerun."
            exit 0
          fi
          echo "A job was never scheduled on a hosted runner; rerunning failed jobs of run $RUN_ID once."
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
