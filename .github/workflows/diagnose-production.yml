name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect
        required: true
        type: choice
        options:
          - co
          - cn
          - rc
        default: co
      rc_image_digest:
        description: Immutable RC image digest (used only for rc)
        required: false
        type: string
        default: sha256:88d032196d8a1896c8bfbc10ae920c704ed7030f0a7cb62ffb462470fccc6939

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose .${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout diagnostic script
        if: inputs.environment == 'rc'
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Capture Xpod state
        if: inputs.environment != 'rc'
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods -o wide
          kubectl -n "$SEALOS_NAMESPACE" describe deployment xpod-cloud
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-cloud
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-cloud --all-containers=true --tail=300 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-cloud --all-containers=true --previous --tail=300 --prefix=true --max-log-requests=10 || true

      - name: Probe exact RC image pull on observed node
        if: inputs.environment == 'rc'
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
          RC_IMAGE_DIGEST: ${{ inputs.rc_image_digest }}
        run: node scripts/diagnose-rc-image-pull.cjs

      - name: Clean up only this run's RC probe
        if: always() && inputs.environment == 'rc'
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
          RC_IMAGE_DIGEST: ${{ inputs.rc_image_digest }}
        run: node scripts/diagnose-rc-image-pull.cjs --cleanup
