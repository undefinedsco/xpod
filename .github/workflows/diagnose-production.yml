name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production environment to inspect
        required: true
        type: choice
        options:
          - co
          - cn
        default: co

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose .${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ inputs.environment }}
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Match the production workload to the accepted RC resource budget
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          set -euo pipefail
          test "$SEALOS_NAMESPACE" = ns-1yl0rye9
          test "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" = https://cloud.sealos.io:6443
          expected_image='ghcr.io/undefinedsco/xpod@sha256:ebb4815884e67960988bb14cc49e13985471b735559b50b6405ad2f0252951d8'
          test "$(kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-cloud -o 'jsonpath={.spec.template.spec.containers[?(@.name=="xpod")].image}')" = "$expected_image"
          kubectl -n "$SEALOS_NAMESPACE" set resources deployment/xpod-cloud -c xpod \
            --requests=cpu=500m,memory=1Gi --limits=cpu=3,memory=2Gi --dry-run=server -o name
          kubectl -n "$SEALOS_NAMESPACE" set resources deployment/xpod-cloud -c xpod \
            --requests=cpu=500m,memory=1Gi --limits=cpu=3,memory=2Gi
          kubectl -n "$SEALOS_NAMESPACE" rollout status deployment/xpod-cloud --timeout=600s

      - name: Inspect the accepted production image without changing workloads
        if: always()
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          set -euo pipefail
          test "$SEALOS_NAMESPACE" = ns-1yl0rye9
          test "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" = https://cloud.sealos.io:6443
          expected_image='ghcr.io/undefinedsco/xpod@sha256:ebb4815884e67960988bb14cc49e13985471b735559b50b6405ad2f0252951d8'
          test "$(kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-cloud -o 'jsonpath={.spec.template.spec.containers[?(@.name=="xpod")].image}')" = "$expected_image"
          kubectl -n "$SEALOS_NAMESPACE" get pods -l app=xpod-cloud -o json |
            jq '.items[] | {name:.metadata.name, node:.spec.nodeName, phase:.status.phase, init:.status.initContainerStatuses, containers:.status.containerStatuses}'
          timeout 15s kubectl -n "$SEALOS_NAMESPACE" top pod -l app=xpod-cloud --containers || true
          timeout 35s kubectl -n "$SEALOS_NAMESPACE" exec -i deployment/xpod-cloud -c xpod -- node - <<'NODE'
          const fs = require('node:fs');
          const dns = require('node:dns').promises;
          function read(path) { try { return fs.readFileSync(path, 'utf8').trim(); } catch { return null; } }
          function counters() {
            for (const name of ['cpu.stat', 'cpu.max', 'memory.current', 'memory.max', 'memory.events']) {
              console.log(JSON.stringify({counter:name, value:read(`/sys/fs/cgroup/${name}`)}));
            }
          }
          (async () => {
            counters();
            for (const pid of fs.readdirSync('/proc').filter(name => /^\d+$/.test(name))) {
              const status = read(`/proc/${pid}/status`);
              if (!status) continue;
              const fields = status.split('\n').filter(line => /^(Name|State|VmRSS|VmSize|Threads):/.test(line));
              console.log(JSON.stringify({pid, fields, wait:read(`/proc/${pid}/wchan`)}));
            }
            console.log(JSON.stringify({tcp:read('/proc/net/tcp'), tcp6:read('/proc/net/tcp6')}));
            const databaseDns = await Promise.race([
              dns.lookup('xpod-rdf-postgres', {all:true}),
              new Promise(resolve => setTimeout(() => resolve('lookup deadline exceeded'), 3000)),
            ]);
            console.log(JSON.stringify({databaseDns}));
            for (const port of [3000, 3001, 3002]) {
              const started = Date.now();
              try {
                const response = await fetch(`http://127.0.0.1:${port}/service/status`, {signal:AbortSignal.timeout(3000)});
                console.log(JSON.stringify({port, status:response.status, elapsedMs:Date.now()-started}));
                await response.body?.cancel();
              } catch (error) {
                console.log(JSON.stringify({port, error:error.name, elapsedMs:Date.now()-started}));
              }
            }
            counters();
          })().catch(error => { console.error(error.message); process.exitCode=1; });
          NODE
          kubectl -n "$SEALOS_NAMESPACE" logs deployment/xpod-cloud -c xpod --tail=80 --timestamps
