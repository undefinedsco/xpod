name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production environment to inspect
        required: true
        type: choice
        options:
          - co
          - cn
        default: co

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose .${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Capture Xpod state
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods -o wide
          kubectl -n "$SEALOS_NAMESPACE" describe deployment xpod-cloud
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-cloud
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-cloud --all-containers=true --tail=300 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-cloud --all-containers=true --previous --tail=300 --prefix=true --max-log-requests=10 || true

      - name: Inspect node ingress and TLS metadata
        if: always()
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          # Project only public routing/status metadata; never print Secret data,
          # resource annotations, deployment environment, or certificate keys.
          echo 'BEGIN_NODE_TLS_METADATA'
          kubectl -n "$SEALOS_NAMESPACE" get ingress -o json | jq '[.items[] | {
            name: .metadata.name,
            ingressClass: .spec.ingressClassName,
            routingAnnotations: ((.metadata.annotations // {}) | with_entries(select(.key == "kubernetes.io/ingress.class" or .key == "nginx.ingress.kubernetes.io/backend-protocol" or .key == "nginx.ingress.kubernetes.io/proxy-body-size" or .key == "nginx.ingress.kubernetes.io/proxy-connect-timeout" or .key == "nginx.ingress.kubernetes.io/proxy-read-timeout" or .key == "nginx.ingress.kubernetes.io/proxy-send-timeout"))),
            addresses: .status.loadBalancer.ingress,
            tls: [.spec.tls[]? | {hosts, secretName}],
            routes: [.spec.rules[]? | {host, paths: [.http.paths[]? | {path, pathType, service: .backend.service}]}]
          }]'
          kubectl -n "$SEALOS_NAMESPACE" get certificates.cert-manager.io -o json | jq '[.items[] | {
            name: .metadata.name,
            dnsNames: .spec.dnsNames,
            secretName: .spec.secretName,
            issuerRef: .spec.issuerRef,
            notBefore: .status.notBefore,
            notAfter: .status.notAfter,
            renewalTime: .status.renewalTime,
            conditions: [.status.conditions[]? | {type, status, reason, lastTransitionTime}]
          }]' || true
          kubectl -n "$SEALOS_NAMESPACE" get issuers.cert-manager.io -o json | jq '[.items[] | {
            name: .metadata.name,
            conditions: [.status.conditions[]? | {type, status, reason, lastTransitionTime}]
          }]' || true
          kubectl get clusterissuers.cert-manager.io -o json | jq '[.items[] | {
            name: .metadata.name,
            conditions: [.status.conditions[]? | {type, status, reason, lastTransitionTime}]
          }]' || true
          kubectl -n "$SEALOS_NAMESPACE" get secrets -o custom-columns='NAME:.metadata.name,TYPE:.type'
          echo 'PUBLIC_TLS_CERTIFICATE_SUMMARIES'
          while IFS= read -r secret; do
            [ -n "$secret" ] || continue
            echo "TLS certificate: $secret"
            kubectl -n "$SEALOS_NAMESPACE" get secret "$secret" -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          done < <(kubectl -n "$SEALOS_NAMESPACE" get secrets -o go-template='{{range .items}}{{if eq .type "kubernetes.io/tls"}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}')
          echo 'ID_ISSUER_SOLVER_TYPES'
          kubectl -n "$SEALOS_NAMESPACE" get issuer network-msaylbtjjodk -o json | jq '{
            name: .metadata.name,
            solvers: [.spec.acme.solvers[]? | {
              selector,
              http01: (if .http01 then {ingress: {class: .http01.ingress.class, ingressClassName: .http01.ingress.ingressClassName, name: .http01.ingress.name}} else null end),
              dns01ProviderTypes: ((.dns01 // {}) | keys)
            }]
          }' || true
          echo 'END_NODE_TLS_METADATA'
