name: Diagnose Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Xpod environment to inspect
        required: true
        type: choice
        options:
          - co
          - cn
          - rc
        default: co
      credential_fingerprint:
        description: Optional SHA256 of an owned RC client ID for read-only existence checks
        type: string
        required: false
      webid_fingerprint:
        description: Optional SHA256 of the matching owned RC WebID
        type: string
        required: false
      registry_probe:
        description: Optional read-only RC tcr-creds registry probe (rc only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose .${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Set up kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Capture Xpod state
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
          XPOD_DEPLOYMENT: ${{ inputs.environment == 'rc' && 'xpod-rc' || 'xpod-cloud' }}
        run: |
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE must be a valid Kubernetes name"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods -o wide
          kubectl -n "$SEALOS_NAMESPACE" get secrets --field-selector type=kubernetes.io/dockerconfigjson -o custom-columns=NAME:.metadata.name,TYPE:.type
          kubectl -n "$SEALOS_NAMESPACE" get serviceaccount default -o 'jsonpath={.imagePullSecrets[*].name}{"\n"}'
          kubectl -n "$SEALOS_NAMESPACE" describe deployment "$XPOD_DEPLOYMENT"
          kubectl -n "$SEALOS_NAMESPACE" get pods -l "app=$XPOD_DEPLOYMENT" -o 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}{.name}{" imageID="}{.imageID}{" restarts="}{.restartCount}{" lastState="}{.lastState}{"\n"}{end}{end}'
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l "app=$XPOD_DEPLOYMENT"
          kubectl -n "$SEALOS_NAMESPACE" logs -l "app=$XPOD_DEPLOYMENT" --all-containers=true --tail=300 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l "app=$XPOD_DEPLOYMENT" --all-containers=true --previous --tail=300 --prefix=true --max-log-requests=10 || true

      - name: Capture RC database state
        if: inputs.environment == 'rc'
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
          CREDENTIAL_FINGERPRINT: ${{ inputs.credential_fingerprint }}
          WEBID_FINGERPRINT: ${{ inputs.webid_fingerprint }}
        run: |
          set -euo pipefail
          kubectl -n "$SEALOS_NAMESPACE" describe statefulset xpod-rc-postgres
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc-postgres
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc-postgres --tail=300 --prefix=true || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc-postgres --previous --tail=300 --prefix=true || true
          if [ -z "$CREDENTIAL_FINGERPRINT$WEBID_FINGERPRINT" ]; then exit 0; fi
          if [[ ! "$CREDENTIAL_FINGERPRINT" =~ ^[a-f0-9]{64}$ || ! "$WEBID_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Both owned-resource fingerprints must be SHA256 hex"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec -i statefulset/xpod-rc-postgres -- \
            psql -X -v ON_ERROR_STOP=1 -U xpod_rc -d xpod_rc \
            -v credential_fingerprint="$CREDENTIAL_FINGERPRINT" \
            -v webid_fingerprint="$WEBID_FINGERPRINT" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '5s';
          WITH credential AS (
            SELECT payload->>'accountId' AS account_id, payload->>'webId' AS web_id
            FROM public.identity_store
            WHERE container = 'clientCredentials'
              AND encode(sha256(convert_to(id, 'UTF8')), 'hex') = :'credential_fingerprint'
          )
          SELECT json_build_object(
            'credentialRows', (SELECT count(*) FROM credential),
            'linkedCredentialRows', (SELECT count(*) FROM credential c JOIN public.identity_store w
              ON w.container = 'webIdLink' AND w.payload->>'accountId' = c.account_id AND w.payload->>'webId' = c.web_id),
            'accountRows', (SELECT count(*) FROM credential c JOIN public.identity_store a
              ON a.container = 'account' AND a.id = c.account_id),
            'ownedWebIdLinks', (SELECT count(*) FROM public.identity_store
              WHERE container = 'webIdLink' AND encode(sha256(convert_to(payload->>'webId', 'UTF8')), 'hex') = :'webid_fingerprint')
          );
          COMMIT;
          SQL

      - name: Probe RC registry credentials
        if: inputs.environment == 'rc' && inputs.registry_probe
        env:
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE must be a valid Kubernetes name"
            exit 1
          fi
          # Strictly read-only: stream the exact tcr-creds dockerconfigjson field
          # into an in-memory Node parser. No auth value, no other registry key,
          # and no raw input/error/stack is written to a file, argv, or the log.
          read -r -d '' tcr_probe_parser <<'NODE' || true
          const EXPECTED_AUTHORITY = 'ccr.ccs.tencentyun.com';
          const summary = {
            fieldNonempty: false,
            decodeStatus: 'not-attempted',
            parseStatus: 'not-attempted',
            authsIsObject: false,
            authorityMatchCount: 0,
            selectedEntryIsObject: false,
            selectedAuthPresent: false,
            selectedUsernamePresent: false,
            selectedPasswordPresent: false,
            selectedIdentityTokenPresent: false,
          };
          const chunks = [];
          process.stdin.on('data', (chunk) => chunks.push(chunk));
          process.stdin.on('end', () => {
            let decoded = '';
            try {
              const raw = Buffer.concat(chunks).toString('utf8').trim();
              summary.fieldNonempty = raw.length > 0;
              if (summary.fieldNonempty) {
                decoded = Buffer.from(raw, 'base64').toString('utf8');
                summary.decodeStatus = 'ok';
              }
            } catch {
              summary.decodeStatus = 'failed';
            }
            if (summary.fieldNonempty && summary.decodeStatus === 'ok') {
              let parsed;
              try {
                parsed = JSON.parse(decoded);
                summary.parseStatus = 'ok';
              } catch {
                summary.parseStatus = 'failed';
              }
              const auths = parsed && typeof parsed === 'object' ? parsed.auths : undefined;
              if (auths && typeof auths === 'object' && !Array.isArray(auths)) {
                summary.authsIsObject = true;
                let selected;
                for (const key of Object.keys(auths)) {
                  const authority = key.replace(/^https?:\/\//, '').split('/')[0];
                  if (authority === EXPECTED_AUTHORITY) {
                    summary.authorityMatchCount += 1;
                    if (selected === undefined) selected = auths[key];
                  }
                }
                if (summary.authorityMatchCount > 0) {
                  summary.selectedEntryIsObject = !!selected && typeof selected === 'object';
                  if (summary.selectedEntryIsObject) {
                    summary.selectedAuthPresent = typeof selected.auth === 'string' && selected.auth.length > 0;
                    summary.selectedUsernamePresent = typeof selected.username === 'string' && selected.username.length > 0;
                    summary.selectedPasswordPresent = typeof selected.password === 'string' && selected.password.length > 0;
                    summary.selectedIdentityTokenPresent =
                      typeof selected.identitytoken === 'string' && selected.identitytoken.length > 0;
                  }
                }
              }
            }
            process.stdout.write(`${JSON.stringify(summary)}\n`);
            const ok = summary.fieldNonempty
              && summary.decodeStatus === 'ok'
              && summary.parseStatus === 'ok'
              && summary.authsIsObject;
            process.exit(ok ? 0 : 1);
          });
          NODE
          set +e
          kubectl -n "$SEALOS_NAMESPACE" get secret tcr-creds \
            -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null \
            | node -e "$tcr_probe_parser"
          probe_statuses=("${PIPESTATUS[@]}")
          set -e
          kubectl_status=${probe_statuses[0]:-1}
          parser_status=${probe_statuses[1]:-1}
          if [ "$kubectl_status" -ne 0 ]; then
            echo "::error::RC registry probe could not fetch the tcr-creds secret field"
            exit 1
          fi
          if [ "$parser_status" -ne 0 ]; then
            echo "::error::RC registry probe could not parse the tcr-creds secret field"
            exit 1
          fi
