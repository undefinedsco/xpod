name: Release Candidate

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.candidate.outputs.target }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      shaTag: ${{ steps.candidate.outputs.shaTag }}
      sourceSha: ${{ steps.candidate.outputs.sourceSha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release candidate metadata
        id: candidate
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != release/* ]]; then
            echo "::error::candidate workflow can only run on release/** branches"
            exit 1
          fi
          metadata="$(node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --sha "$SOURCE_SHA" \
            --json)"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${metadata.targetVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${metadata.candidateVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `shaTag=${metadata.shaTag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sourceSha=${metadata.sourceSha}\n`);
          ' "$metadata"

  rc_prerequisites:
    needs: metadata
    runs-on: ubuntu-latest
    environment: rc
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
    steps:
      - name: Verify RC DNS and namespace prerequisites
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG_DATA is required"
            exit 1
          fi
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE must be a valid Kubernetes name"
            exit 1
          fi
          node - <<'NODE'
          const { Resolver } = require('node:dns').promises;
          const hosts = [
            'id-rc.undefineds.co',
            'pods-rc.undefineds.co',
            'api-rc.undefineds.co',
          ];
          const resolvers = [ undefined, [ '1.1.1.1', '8.8.8.8' ] ].map((servers) => {
            const resolver = new Resolver();
            if (servers) resolver.setServers(servers);
            return resolver;
          });
          Promise.all(hosts.map(async (host) => {
            for (const resolver of resolvers) {
              try {
                const addresses = await resolver.resolve4(host);
                if (addresses.length) return;
              } catch {}
            }
            throw new Error(`${host}: empty DNS result`);
          })).catch((error) => {
            console.error(`::error::all RC hosts must resolve before artifacts are published: ${error.message}`);
            process.exit(1);
          });
          NODE
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl auth can-i create deployments -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create services -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create ingresses.networking.k8s.io -n "$SEALOS_NAMESPACE" | grep -qx yes

  publish_qlever_runtime_sdk:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/publish-qlever-runtime-sdk.yml
    permissions:
      contents: read
      packages: write
    with:
      source_commit: ${{ needs.metadata.outputs.sourceSha }}

  publish_qlever_local_runtime:
    needs: publish_qlever_runtime_sdk
    uses: ./.github/workflows/publish-qlever-local-runtime.yml
    permissions:
      contents: read
      packages: write
    with:
      prior_sdk_image: ${{ needs.publish_qlever_runtime_sdk.outputs.image }}

  build_qlever_macos_runtime:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/build-qlever-macos-runtime.yml
    permissions:
      contents: read

  build_image:
    needs: [metadata, rc_prerequisites, publish_qlever_local_runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply candidate root version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/undefinedsco/xpod:sha-${{ needs.metadata.outputs.sourceSha }}
            ghcr.io/undefinedsco/xpod:${{ needs.metadata.outputs.candidate }}
          cache-from: type=gha,scope=xpod-server
          cache-to: type=gha,mode=max,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ needs.publish_qlever_local_runtime.outputs.image }}

  deploy_and_accept:
    needs: [metadata, build_image]
    runs-on: ubuntu-latest
    environment: rc
    concurrency:
      group: xpod-shared-rc-service
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      XPOD_RC_SEED_CONFIG: ${{ secrets.XPOD_RC_SEED_CONFIG }}
      XPOD_RC_SEED_SECRET_NAME: xpod-rc-seed-${{ github.run_id }}-${{ github.run_attempt }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      XPOD_RUNTIME_SECRET_NAME: ${{ vars.XPOD_RUNTIME_SECRET_NAME }}
      XPOD_ACCEPTANCE_REAL_XPOD: 'true'
      XPOD_ACCEPTANCE_RUN_VISUAL: 'true'
      XPOD_SETTINGS_E2E_BASE_URL: https://id-rc.undefineds.co
      XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
      XPOD_AI_PROXY_URL: ${{ secrets.XPOD_AI_PROXY_URL }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Login to GHCR for Local acceptance runtime
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: Install Chromium for authenticated acceptance
        run: bunx playwright install --with-deps chromium

      - name: Verify consent navigation before deployment
        run: |
          bun run build:packages
          # The candidate native conformance step hashes the compiled
          # dist/acceptance/run-installed-qlever-conformance.js against the copy
          # inside the built service image. A clean checkout must therefore emit
          # the same dist bytes the Dockerfile build stage produces.
          bun run build:ts
          bunx vitest run ui/src/pages/ConsentResume.test.tsx ui/src/pages/ConsentRetry.test.tsx --maxWorkers=2 --minWorkers=1
          bunx playwright test tests/e2e/consent-cross-origin-resume.spec.ts --workers=1

      - name: Set up kubeconfig
        run: |
          set -euo pipefail
          validate_k8s_name() {
            local name="$1"
            local label="$2"
            if [[ ! "$name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#name} -gt 63 ]]; then
              echo "::error::${label} must be a valid Kubernetes name"
              exit 1
            fi
          }
          if [ -z "$SEALOS_NAMESPACE" ]; then
            echo "::error::SEALOS_NAMESPACE is required"
            exit 1
          fi
          if [ -z "$XPOD_RUNTIME_SECRET_NAME" ]; then
            echo "::error::XPOD_RUNTIME_SECRET_NAME is required"
            exit 1
          fi
          if [ -z "$XPOD_RC_SEED_CONFIG" ]; then
            echo "::error::XPOD_RC_SEED_CONFIG is required"
            exit 1
          fi
          validate_k8s_name "$SEALOS_NAMESPACE" SEALOS_NAMESPACE
          validate_k8s_name "$XPOD_RUNTIME_SECRET_NAME" XPOD_RUNTIME_SECRET_NAME
          validate_k8s_name "$XPOD_RC_SEED_SECRET_NAME" XPOD_RC_SEED_SECRET_NAME
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Validate RC runtime secret isolation
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/xpod-rc.env"
          seed_file="${RUNNER_TEMP}/xpod-rc-seed.json"
          printf '%s\n' "$APP_ENV_FILE" > "$env_file"
          printf '%s\n' "$XPOD_RC_SEED_CONFIG" > "$seed_file"
          chmod 600 "$env_file"
          chmod 600 "$seed_file"
          node - "$env_file" "$seed_file" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const seedText = fs.readFileSync(process.argv[3], 'utf8');
          const required = [
            'CSS_REDIS_CLIENT',
            'CSS_MINIO_ENDPOINT',
            'CSS_MINIO_BUCKET_NAME',
            'CSS_MINIO_ACCESS_KEY',
            'CSS_MINIO_SECRET_KEY',
            'XPOD_INNGEST_EVENT_KEY',
            'XPOD_INNGEST_SIGNING_KEY',
            'XPOD_GATEWAY_LOCATOR_SECRET',
          ];
          const entries = new Map();
          for (const line of text.split(/\r?\n/)) {
            if (!line || line.trimStart().startsWith('#')) continue;
            const match = /^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/.exec(line);
            if (match) entries.set(match[1], match[2]);
          }
          for (const key of required) {
            if (!entries.has(key) || entries.get(key).trim() === '') {
              throw new Error(`missing required RC secret key: ${key}`);
            }
          }
          const seed = JSON.parse(seedText);
          if (!Array.isArray(seed)) {
            throw new Error('XPOD_RC_SEED_CONFIG must be a seed account array');
          }
          const accountKeys = seed.map((entry) => `${entry?.email || ''} ${entry?.pods?.map?.((pod) => pod?.name).join(' ') || ''}`.toLowerCase());
          if (!accountKeys.some((value) => value.includes('alice')) || !accountKeys.some((value) => value.includes('bob'))) {
            throw new Error('XPOD_RC_SEED_CONFIG must include Alice and Bob seed accounts');
          }
          const productionDomainPattern = /(^|[^A-Za-z0-9.-])id\.undefineds\.co\b/;
          const redisValue = entries.get('CSS_REDIS_CLIENT') || '';
          if (/(?:prod|production|xpod-cloud)/i.test(redisValue) || productionDomainPattern.test(redisValue)) {
            throw new Error('production Redis is not allowed in RC APP_ENV_FILE');
          }
          let redisUrl;
          try {
            redisUrl = new URL(redisValue);
          } catch {
            throw new Error('CSS_REDIS_CLIENT must be a valid Redis URL');
          }
          if (!['redis:', 'rediss:'].includes(redisUrl.protocol)) {
            throw new Error('CSS_REDIS_CLIENT must use redis:// or rediss://');
          }
          const dbMatch = /^\/([0-9]+)$/.exec(redisUrl.pathname);
          if (!dbMatch) {
            throw new Error('RC Redis URL must include an explicit nonzero DB index');
          }
          if (Number(dbMatch[1]) === 0) {
            throw new Error('RC Redis DB must use a non-default database index');
          }
          if (entries.get('CSS_MINIO_BUCKET_NAME') !== 'xpod-rc') {
            throw new Error('RC object-store bucket must be xpod-rc');
          }
          let objectStoreUrl;
          try {
            objectStoreUrl = new URL(entries.get('CSS_MINIO_ENDPOINT'));
          } catch {
            throw new Error('CSS_MINIO_ENDPOINT must be a valid URL');
          }
          if (objectStoreUrl.protocol !== 'https:' || !objectStoreUrl.hostname.endsWith('.r2.cloudflarestorage.com')) {
            throw new Error('RC object-store endpoint must use Cloudflare R2 over HTTPS');
          }
          const sanitized = [];
          for (const [ key, value ] of entries) {
            if (!['CSS_IDENTITY_DB_URL', 'CSS_SPARQL_ENDPOINT'].includes(key)) {
              sanitized.push(`${key}=${value}`);
            }
          }
          fs.writeFileSync(process.argv[2], `${sanitized.join('\n')}\n`);
          NODE
          bun scripts/verify-rc-r2-access.ts --env-file "$env_file"
          bun scripts/materialize-rc-seed-config.ts \
            --input "$seed_file" \
            --output "$seed_file" \
            --suffix "rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo '{"secret-isolation":"passed"}' > "${RUNNER_TEMP}/secret-isolation-check.json"

      # MANDATORY PREDEPLOYMENT GATE 1. Must run before "Create runtime secrets"
      # (which rotates the old PostgreSQL password/DSN) and before any RC resource
      # replacement. It proves the exact candidate service digest and the exact
      # immutable RC PostgreSQL digest are mutually compatible at the native SQL
      # ABI level, using only runner-local Docker with the existing GHCR login and
      # the namespace-owned tcr-creds pull auth for ccr.ccs.tencentyun.com.
      - name: Preflight immutable native images before any RC mutation
        run: |
          set -euo pipefail
          # Before the first secret read: restrict default file modes, create the
          # owned DOCKER_CONFIG directory, and register cleanup so any later
          # fetch/decode/parse/install/image-gate failure removes the auth config
          # while the existing RC resources stay untouched.
          umask 077
          docker_config_dir="${RUNNER_TEMP}/tcr-preflight-docker-config"
          install -d -m 700 "$docker_config_dir"
          cleanup_docker_config() {
            rm -rf "$docker_config_dir"
          }
          trap cleanup_docker_config EXIT
          # Stream the namespace secret through an in-memory parser. No raw auths
          # JSON and no all-registry docker config is ever written to disk; only
          # the ccr.ccs.tencentyun.com entry (plus the explicitly authorized
          # existing ghcr.io login) reaches the 0600 DOCKER_CONFIG file.
          read -r -d '' tcr_config_parser <<'NODE' || true
          // Outermost guard: a malformed secret must never print its own bytes.
          // An uncaught JSON.parse error includes a fragment of the decoded
          // credential (Node prints e.g. `... "FAKE_TEST_SENTINEL"...`), so every
          // read/decode/parse/write failure is caught here and replaced with a
          // fixed, non-sensitive message on stderr.
          try {
            const fs = require('node:fs');
            const path = require('node:path');
            const source = JSON.parse(fs.readFileSync(0, 'utf8'));
            const sourceKey = Object.keys(source.auths || {})
              .find((key) => /(^|\/\/)ccr\.ccs\.tencentyun\.com(\/|$)/.test(key));
            if (!sourceKey) {
              throw new Error('missing-authorized-tcr-entry');
            }
            const config = { auths: {} };
            const existingPath = path.join(process.env.HOME || '/root', '.docker', 'config.json');
            if (fs.existsSync(existingPath)) {
              const existing = JSON.parse(fs.readFileSync(existingPath, 'utf8'));
              if (existing.auths && existing.auths['ghcr.io']) {
                config.auths['ghcr.io'] = existing.auths['ghcr.io'];
              }
            }
            config.auths['ccr.ccs.tencentyun.com'] = source.auths[sourceKey];
            fs.writeFileSync(process.argv[1], `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          } catch {
            process.stderr.write('failed to install authorized registry credentials\n');
            process.exit(1);
          }
          NODE
          kubectl -n "$SEALOS_NAMESPACE" get secret tcr-creds -o jsonpath='{.data.\.dockerconfigjson}' \
            | base64 --decode \
            | node -e "$tcr_config_parser" "$docker_config_dir/config.json"
          DOCKER_CONFIG="$docker_config_dir" docker pull "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          DOCKER_CONFIG="$docker_config_dir" docker pull "ccr.ccs.tencentyun.com/undefineds/xpod-rdf-postgres@sha256:de247beacf40af59a9e209e02cf257b0bdb33d9f47a7f77e4eb379635a2488ba"
          mkdir -p "${RUNNER_TEMP}/immutable-native-conformance"
          DOCKER_CONFIG="$docker_config_dir" bun scripts/check-qlever-installed-image-conformance.ts \
            --installed-image "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}" \
            --pg-image "ccr.ccs.tencentyun.com/undefineds/xpod-rdf-postgres@sha256:de247beacf40af59a9e209e02cf257b0bdb33d9f47a7f77e4eb379635a2488ba" \
            --fixture qlever/tests/fixtures/qlever-semantic-conformance.cjs \
            --artifact-dir "${RUNNER_TEMP}/immutable-native-conformance"
          cleanup_docker_config
          trap - EXIT

      # MANDATORY PREDEPLOYMENT GATE 2. Verifies the assigned namespace kubelet
      # can pull the exact RC PostgreSQL digest with the existing tcr-creds
      # imagePullSecret, independently of the runner Docker gate above. It never
      # touches the existing RC database and cleans up its own Job.
      - name: Preflight exact PostgreSQL image pull in the assigned namespace
        run: |
          set -euo pipefail
          job_name="xpod-rc-pg-preflight"
          job_uid=""
          delete_preflight_job() {
            kubectl -n "$SEALOS_NAMESPACE" delete job "$job_name" --ignore-not-found --wait=true >/dev/null 2>&1
          }
          cleanup_preflight() {
            local original_status=$?
            if [ -n "$job_uid" ] && ! delete_preflight_job; then
              echo "::error::failed to clean up RC PostgreSQL pull preflight job ${job_name}; original exit status ${original_status} preserved"
            fi
            return "$original_status"
          }
          trap cleanup_preflight EXIT
          # A leftover Job from an earlier attempt may already be Complete=True.
          # Reading that stale condition would issue a false PASS for this run,
          # and a delete failure (e.g. missing RBAC) must hard stop rather than
          # silently reuse the stale result. --ignore-not-found still reports a
          # real API/permission error as nonzero.
          if ! delete_preflight_job; then
            echo "::error::could not clear a stale RC PostgreSQL pull preflight job; refusing to reuse stale results"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" apply -f deploy/sealos/rc-postgres/pull-preflight.yaml
          job_uid="$(kubectl -n "$SEALOS_NAMESPACE" get job "$job_name" -o jsonpath='{.metadata.uid}')"
          if [ -z "$job_uid" ]; then
            echo "::error::applied RC PostgreSQL pull preflight job has no UID"
            exit 1
          fi
          preflight_status="pending"
          for attempt in $(seq 1 120); do
            condition="$(kubectl -n "$SEALOS_NAMESPACE" get job "$job_name" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' 2>/dev/null || true)"
            if [[ "$condition" == *"Complete=True"* ]]; then
              preflight_status="complete"
              break
            fi
            if [[ "$condition" == *"Failed=True"* ]]; then
              preflight_status="failed"
              break
            fi
            sleep 5
          done
          if [ "$preflight_status" != "complete" ]; then
            echo "::error::RC PostgreSQL image pull preflight did not complete; the existing RC database is left untouched"
            kubectl -n "$SEALOS_NAMESPACE" describe "job/$job_name" || true
            kubectl -n "$SEALOS_NAMESPACE" logs "job/$job_name" --all-containers=true || true
            exit 1
          fi
          # The job must still be the exact object this run applied; a replaced
          # same-named Job would invalidate the observed Complete condition.
          observed_uid="$(kubectl -n "$SEALOS_NAMESPACE" get job "$job_name" -o jsonpath='{.metadata.uid}')"
          if [ "$observed_uid" != "$job_uid" ]; then
            echo "::error::RC PostgreSQL pull preflight job was replaced while running; refusing to trust its result"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" logs "job/$job_name" --all-containers=true
          if ! delete_preflight_job; then
            echo "::error::failed to clean up RC PostgreSQL pull preflight job ${job_name}"
            exit 1
          fi
          job_uid=""
          trap - EXIT

      - name: Create runtime secrets
        run: |
          set -euo pipefail
          pg_password="$(openssl rand -hex 32)"
          pg_host="xpod-rc-postgres"
          identity_db_url="postgresql://xpod_rc:${pg_password}@${pg_host}:5432/xpod_rc"
          sparql_endpoint="postgresql://xpod_rc:${pg_password}@${pg_host}:5432/xpod_rc"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$identity_db_url"
          echo "::add-mask::$sparql_endpoint"
          printf 'CSS_IDENTITY_DB_URL=%s\n' "$identity_db_url" >> "${RUNNER_TEMP}/xpod-rc.env"
          printf 'CSS_SPARQL_ENDPOINT=%s\n' "$sparql_endpoint" >> "${RUNNER_TEMP}/xpod-rc.env"
          kubectl -n "$SEALOS_NAMESPACE" create secret generic xpod-rc-postgres-secret \
            --from-literal=POSTGRES_DB=xpod_rc \
            --from-literal=POSTGRES_USER=xpod_rc \
            --from-literal=POSTGRES_PASSWORD="$pg_password" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RUNTIME_SECRET_NAME" \
            --from-env-file="${RUNNER_TEMP}/xpod-rc.env" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RC_SEED_SECRET_NAME" \
            --from-file=rc.json="${RUNNER_TEMP}/xpod-rc-seed.json" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy RC image by digest
        run: |
          set -euo pipefail
          postgres_manifest="${RUNNER_TEMP}/xpod-rc-postgres.rendered.yaml"
          rendered_manifest="${RUNNER_TEMP}/xpod-rc.rendered.yaml"
          node scripts/render-rc-manifests.cjs \
            --overlay deploy/sealos/rc-postgres \
            --output "$postgres_manifest" \
            --namespace "$SEALOS_NAMESPACE"
          node scripts/render-rc-manifests.cjs \
            --overlay deploy/sealos/rc \
            --output "$rendered_manifest" \
            --namespace "$SEALOS_NAMESPACE" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME" \
            --seed-secret-name "$XPOD_RC_SEED_SECRET_NAME" \
            --image "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc --cascade=foreground --wait=true --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete statefulset/xpod-rc-postgres --cascade=foreground --wait=true --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete service/xpod-rc-postgres --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete pvc/data-xpod-rc-postgres-0 --ignore-not-found
          kubectl apply -f "$postgres_manifest"
          kubectl rollout status statefulset/xpod-rc-postgres -n "$SEALOS_NAMESPACE" --timeout=600s
          postgres_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod xpod-rc-postgres-0 -o jsonpath='{.status.containerStatuses[?(@.name=="postgres")].imageID}')"
          if [[ "$postgres_image_id" != *"de247beacf40af59a9e209e02cf257b0bdb33d9f47a7f77e4eb379635a2488ba"* ]]; then
            echo "::error::RC PostgreSQL imageID mismatch"
            exit 1
          fi
          postgres_version_num="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc --no-align --tuples-only --command 'SHOW server_version_num' | tr -d '[:space:]')"
          if ! [[ "$postgres_version_num" =~ ^17[0-9]{4}$ ]]; then
            echo "::error::RC database must run PostgreSQL 17"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -v ON_ERROR_STOP=1 -U xpod_rc -d xpod_rc --command 'CREATE EXTENSION IF NOT EXISTS vector'
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -v ON_ERROR_STOP=1 -U xpod_rc -d xpod_rc --command 'CREATE EXTENSION IF NOT EXISTS xpod_rdf'
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -v ON_ERROR_STOP=1 -U xpod_rc -d xpod_rc --command 'CREATE EXTENSION IF NOT EXISTS xpod_qlever'
          vector_version="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc --no-align --tuples-only \
              --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | tr -d '[:space:]')"
          if [ -z "$vector_version" ]; then
            echo "::error::RC database did not activate the vector extension"
            exit 1
          fi
          native_capabilities="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc --no-align --tuples-only \
              --command 'SELECT xpod_rdf.native_sparql_capabilities()::text' | tr -d '[:space:]')"
          printf '%s' "$native_capabilities" | node -e "const input=[];process.stdin.on('data',(chunk)=>input.push(chunk));process.stdin.on('end',()=>{const caps=JSON.parse(Buffer.concat(input).toString());if(caps.abiVersion!==1||caps.ready!==true)throw new Error('RC native SPARQL ABI1 is not ready');});"
          kubectl -n "$SEALOS_NAMESPACE" get configmap gateway -o yaml \
            | node scripts/update-gateway-rc-configmap.cjs --namespace "$SEALOS_NAMESPACE" \
            | kubectl apply -f -
          kubectl apply -f "$rendered_manifest"
          kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-inngest -o json > "${RUNNER_TEMP}/inngest.json"
          node scripts/patch-shared-inngest-rc.cjs \
            --input "${RUNNER_TEMP}/inngest.json" \
            --output "${RUNNER_TEMP}/inngest-rc.json" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME"
          kubectl apply -f "${RUNNER_TEMP}/inngest-rc.json"
          kubectl -n "$SEALOS_NAMESPACE" rollout restart deployment/gateway
          kubectl rollout status deployment/gateway -n "$SEALOS_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/xpod-rc -n "$SEALOS_NAMESPACE" --timeout=2400s
          expected_image="ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          deployment_image="$(kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-rc -o jsonpath='{.spec.template.spec.containers[?(@.name=="xpod")].image}')"
          if [ "$deployment_image" != "$expected_image" ]; then
            echo "::error::deployment image digest mismatch"
            exit 1
          fi
          pod_name="$(kubectl -n "$SEALOS_NAMESPACE" get pods -l app=xpod-rc -o json | node -e '
            const input = [];
            process.stdin.on("data", (chunk) => input.push(chunk));
            process.stdin.on("end", () => {
              const digest = process.argv[1];
              const pods = JSON.parse(Buffer.concat(input)).items || [];
              const pod = pods.find(({ metadata, status }) => {
                const containerStatus = status?.containerStatuses?.find(({ name }) => name === "xpod");
                return !metadata.deletionTimestamp && status?.phase === "Running" &&
                  containerStatus?.ready === true && containerStatus.imageID?.includes(digest);
              });
              if (!pod) process.exit(1);
              process.stdout.write(pod.metadata.name);
            });
          ' "${{ needs.build_image.outputs.digest }}")"
          pod_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.status.containerStatuses[?(@.name=="xpod")].imageID}')"
          if [[ "$pod_image_id" != *"${{ needs.build_image.outputs.digest }}"* ]]; then
            echo "::error::ready pod imageID digest mismatch"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- node -e "fetch('http://127.0.0.1:3000/service/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
          kubectl -n "$SEALOS_NAMESPACE" get secret "$XPOD_RUNTIME_SECRET_NAME" -o json \
            | node -e "const input=[];process.stdin.on('data',(chunk)=>input.push(chunk));process.stdin.on('end',()=>{const data=JSON.parse(Buffer.concat(input)).data||{};for(const key of ['CSS_MINIO_ENDPOINT','CSS_MINIO_BUCKET_NAME','CSS_MINIO_ACCESS_KEY','CSS_MINIO_SECRET_KEY'])if(!data[key])throw new Error('deployed RC secret is missing '+key);});"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc-minio service/xpod-rc-minio job/xpod-rc-minio-init pvc/xpod-rc-minio secret/xpod-rc-object-store --ignore-not-found
          cat > "${RUNNER_TEMP}/deployment-checks.json" <<'JSON'
          {
            "image": "passed",
            "deployed-digest": "passed",
            "direct-pod": "passed",
            "postgres-17": "passed",
            "postgres-ephemeral": "passed",
            "postgres-image-id": "passed",
            "service-image-id": "passed",
            "vector": "passed"
          }
          JSON

      - name: Verify native RC database QLever SQL ABI against the exact candidate
        run: |
          set -euo pipefail
          pod_name="$(kubectl -n "$SEALOS_NAMESPACE" get pods -l app=xpod-rc -o json | node -e '
            const input = [];
            process.stdin.on("data", (chunk) => input.push(chunk));
            process.stdin.on("end", () => {
              const digest = process.argv[1];
              const pods = JSON.parse(Buffer.concat(input)).items || [];
              const pod = pods.find(({ metadata, status }) => {
                const containerStatus = status?.containerStatuses?.find(({ name }) => name === "xpod");
                return !metadata.deletionTimestamp && status?.phase === "Running" &&
                  containerStatus?.ready === true && containerStatus.imageID?.includes(digest);
              });
              if (!pod) process.exit(1);
              process.stdout.write(pod.metadata.name);
            });
          ' "${{ needs.build_image.outputs.digest }}")"
          service_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.status.containerStatuses[?(@.name=="xpod")].imageID}')"
          service_pod_uid="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.metadata.uid}')"
          postgres_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod xpod-rc-postgres-0 -o jsonpath='{.status.containerStatuses[?(@.name=="postgres")].imageID}')"
          postgres_pod_uid="$(kubectl -n "$SEALOS_NAMESPACE" get pod xpod-rc-postgres-0 -o jsonpath='{.metadata.uid}')"
          if [[ "$postgres_image_id" != *"de247beacf40af59a9e209e02cf257b0bdb33d9f47a7f77e4eb379635a2488ba"* ]]; then
            echo "::error::native RC acceptance ran against an unexpected PostgreSQL imageID"
            exit 1
          fi
          if [ -z "$service_pod_uid" ] || [ -z "$postgres_pod_uid" ]; then
            echo "::error::could not read the RC service/PostgreSQL Pod UID for this sample"
            exit 1
          fi
          fixture_hash="$(sha256sum qlever/tests/fixtures/qlever-semantic-conformance.cjs | awk '{print $1}')"
          if [ "$fixture_hash" != "597dc09c9b252541e35483cf9d34461a410d4a747808f917948671bd81890e6a" ]; then
            echo "::error::public QLever semantic fixture hash drifted from the pinned RC contract"
            exit 1
          fi
          expected_native="$(sha256sum dist/acceptance/run-installed-qlever-conformance.js | awk '{print $1}')"
          native_runner_hash="$(kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- sha256sum dist/acceptance/run-installed-qlever-conformance.js | awk '{print $1}')"
          if [ "$native_runner_hash" != "$expected_native" ]; then
            echo "::error::candidate native conformance runner does not match the source tree"
            exit 1
          fi
          # Isolation: PostgresRdfEngine.initialize runs xpod_rdf.ensure_statistics_triggers(),
          # which DROP/CREATEs global statistics triggers on public.rdf_quads/rdf_sources.
          # A per-schema search_path cannot contain that, so the public16 gate runs in a
          # unique owned database created on the SAME exact PostgreSQL pod and dropped
          # again even on failure. The RC business database is never used.
          run_slug="$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed -E 's/^_+|_+$//g' | cut -c1-40)"
          native_db="xpod_rc_native_${run_slug}"
          container_work_dir="/tmp/xpod-rc-native-${run_slug}"
          if [[ ! "$native_db" =~ ^[a-z][a-z0-9_]{0,62}$ || "$native_db" = "xpod_rc" ]]; then
            echo "::error::derived native conformance database name is invalid or matches the RC business database"
            exit 1
          fi
          if [[ ! "$container_work_dir" =~ ^/tmp/xpod-rc-native-[a-z0-9_]+$ ]]; then
            echo "::error::derived native conformance work directory is invalid"
            exit 1
          fi
          # Ownership stays false until CREATE DATABASE succeeds, so a failed
          # create never triggers a DROP of a database this run did not create.
          native_db_owned=0
          container_work_dir_created=0
          # The DROP must be verified: a silently ignored failure would leave an
          # owned database behind. The existence probe must also check its own
          # command exit, because `! command` suppresses errexit and an empty
          # probe result must never be read as "absent". On the normal path a
          # failed cleanup fails the step; on the failure path the original exit
          # status is preserved while the cleanup failure is reported explicitly.
          drop_native_db() {
            local drop_status=0
            if ! kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
              psql -U xpod_rc -d xpod_rc -v ON_ERROR_STOP=1 \
                --command "DROP DATABASE IF EXISTS ${native_db} WITH (FORCE)" >/dev/null 2>&1; then
              drop_status=1
            fi
            local probe_output
            if ! probe_output="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
              psql -U xpod_rc -d xpod_rc --no-align --tuples-only \
                --command "SELECT 1 FROM pg_database WHERE datname = '${native_db}'")"; then
              echo "::error::failed to verify removal of owned native conformance database ${native_db}; the existence probe command failed"
              return 1
            fi
            if [ "$(printf '%s' "$probe_output" | tr -d '[:space:]')" = "1" ]; then
              drop_status=1
            fi
            if [ "$drop_status" -ne 0 ]; then
              echo "::error::failed to drop owned native conformance database ${native_db}; it must be removed manually"
              return 1
            fi
            return 0
          }
          remove_container_work_dir() {
            if ! kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- \
              rm -rf "$container_work_dir" >/dev/null 2>&1; then
              echo "::error::failed to remove temporary in-container conformance directory ${container_work_dir}"
              return 1
            fi
            if ! kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- \
              test ! -e "$container_work_dir" >/dev/null 2>&1; then
              echo "::error::failed to verify removal of temporary in-container conformance directory ${container_work_dir}"
              return 1
            fi
            return 0
          }
          assert_rc_identity_unchanged() {
            local current_service_pod_uid current_service_image_id current_postgres_pod_uid current_postgres_image_id
            current_service_pod_uid="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.metadata.uid}')"
            current_service_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.status.containerStatuses[?(@.name=="xpod")].imageID}')"
            current_postgres_pod_uid="$(kubectl -n "$SEALOS_NAMESPACE" get pod xpod-rc-postgres-0 -o jsonpath='{.metadata.uid}')"
            current_postgres_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod xpod-rc-postgres-0 -o jsonpath='{.status.containerStatuses[?(@.name=="postgres")].imageID}')"
            if [ "$current_service_pod_uid" != "$service_pod_uid" ] \
              || [ "$current_service_image_id" != "$service_image_id" ] \
              || [ "$current_postgres_pod_uid" != "$postgres_pod_uid" ] \
              || [ "$current_postgres_image_id" != "$postgres_image_id" ]; then
              echo "::error::RC identities changed during native acceptance (PostgreSQL/service Pod replaced); failing the sample"
              return 1
            fi
            return 0
          }
          cleanup_native_conformance() {
            local original_status=$?
            if [ "$native_db_owned" -eq 1 ] && ! drop_native_db; then
              echo "::error::native conformance database cleanup failed after an earlier failure; original exit status ${original_status} preserved"
            fi
            if [ "$container_work_dir_created" -eq 1 ] && ! remove_container_work_dir; then
              echo "::error::temporary in-container conformance directory cleanup failed after an earlier failure; original exit status ${original_status} preserved"
            fi
            return "$original_status"
          }
          trap cleanup_native_conformance EXIT
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc -v ON_ERROR_STOP=1 \
              --command "CREATE DATABASE ${native_db} TEMPLATE template0"
          native_db_owned=1
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d "${native_db}" -v ON_ERROR_STOP=1 \
              --command 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS xpod_rdf; CREATE EXTENSION IF NOT EXISTS xpod_qlever;'
          # No workflow-side schema DDL: the installed conformance runner's own
          # PostgresRdfEngine.initialize creates the authority + physical schema.
          native_capabilities="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d "${native_db}" --no-align --tuples-only \
              --command 'SELECT xpod_rdf.native_sparql_capabilities()::text' | tr -d '[:space:]')"
          printf '%s' "$native_capabilities" | node -e "const input=[];process.stdin.on('data',(chunk)=>input.push(chunk));process.stdin.on('end',()=>{const caps=JSON.parse(Buffer.concat(input).toString());if(caps.abiVersion!==1||caps.ready!==true)throw new Error('RC native SPARQL ABI1 is not ready');});"
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- env XPOD_RC_NATIVE_WORK_DIR="$container_work_dir" bun -e "const fs=require('node:fs');const dir=process.env.XPOD_RC_NATIVE_WORK_DIR;if(!dir)throw new Error('native conformance work directory is required');fs.rmSync(dir,{recursive:true,force:true});fs.mkdirSync(dir,{mode:0o700,recursive:true});fs.chmodSync(dir,0o700);"
          container_work_dir_created=1
          kubectl -n "$SEALOS_NAMESPACE" exec -i "$pod_name" -c xpod -- env XPOD_RC_NATIVE_WORK_DIR="$container_work_dir" bun -e "const fs=require('node:fs');const dir=process.env.XPOD_RC_NATIVE_WORK_DIR;const chunks=[];process.stdin.on('data',(chunk)=>chunks.push(chunk));process.stdin.on('end',()=>fs.writeFileSync(dir+'/qlever-semantic-conformance.cjs',Buffer.concat(chunks),{mode:0o600}));" < qlever/tests/fixtures/qlever-semantic-conformance.cjs
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- env XPOD_RC_NATIVE_DATABASE="${native_db}" XPOD_RC_NATIVE_WORK_DIR="$container_work_dir" bun -e "if(!process.env.CSS_SPARQL_ENDPOINT)throw new Error('CSS_SPARQL_ENDPOINT must be present in the container');if(!process.env.XPOD_RC_NATIVE_DATABASE)throw new Error('native conformance database is required');if(!process.env.XPOD_RC_NATIVE_WORK_DIR)throw new Error('native conformance work directory is required');const url=new URL(process.env.CSS_SPARQL_ENDPOINT);url.pathname='/'+process.env.XPOD_RC_NATIVE_DATABASE;process.env.XPOD_QLEVER_PG_DSN=url.toString();process.env.XPOD_QLEVER_CONFORMANCE_BACKEND='pg';process.env.XPOD_QLEVER_SEMANTIC_FIXTURE_PATH=process.env.XPOD_RC_NATIVE_WORK_DIR+'/qlever-semantic-conformance.cjs';process.env.XPOD_QLEVER_CONFORMANCE_ARTIFACT_PATH=process.env.XPOD_RC_NATIVE_WORK_DIR+'/pg-installed-conformance.json';process.env.XPOD_QLEVER_CONFORMANCE_TIMEOUT_MS='1200000';require('node:child_process').execFileSync(process.execPath,['dist/acceptance/run-installed-qlever-conformance.js'],{stdio:'inherit'});"
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- cat "$container_work_dir/pg-installed-conformance.json" > "${RUNNER_TEMP}/pg-installed-conformance.json"
          # The performance/acceptance sample is only valid if the exact same
          # PostgreSQL and service Pod instances produced it.
          if ! assert_rc_identity_unchanged; then
            exit 1
          fi
          if ! remove_container_work_dir; then
            exit 1
          fi
          container_work_dir_created=0
          if ! drop_native_db; then
            exit 1
          fi
          native_db_owned=0
          trap - EXIT
          node - "${RUNNER_TEMP}/pg-installed-conformance.json" "$fixture_hash" "$native_runner_hash" "$native_capabilities" "$service_image_id" "$postgres_image_id" "$service_pod_uid" "$postgres_pod_uid" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const fixtureSha = process.argv[3];
          const runnerSha = process.argv[4];
          const capabilities = JSON.parse(process.argv[5]);
          const serviceImageId = process.argv[6];
          const postgresImageId = process.argv[7];
          const servicePodUid = process.argv[8];
          const postgresPodUid = process.argv[9];
          if (report.schemaVersion !== 1 || report.status !== 'ok' || report.backend !== 'pg') {
            throw new Error('native RC QLever conformance did not complete successfully');
          }
          if (capabilities.abiVersion !== 1 || capabilities.ready !== true) {
            throw new Error('RC native SPARQL ABI1 is not ready');
          }
          if (!serviceImageId.includes(process.env.EXPECTED_DIGEST)) {
            throw new Error('native RC acceptance ran against an unexpected service imageID');
          }
          if (!postgresImageId.includes('de247beacf40af59a9e209e02cf257b0bdb33d9f47a7f77e4eb379635a2488ba')) {
            throw new Error('native RC acceptance ran against an unexpected PostgreSQL imageID');
          }
          const evidence = {
            schemaVersion: 1,
            status: 'ok',
            sourceSha: process.env.SOURCE_SHA,
            fixtureSha,
            runnerSha,
            nativeCapabilities: capabilities,
            serviceImageId,
            postgresImageId,
            servicePodUid,
            postgresPodUid,
            conformance: report,
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/native-conformance-evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          const checks = {
            'native-sql-abi1': 'passed',
            'native-qlever-pg-conformance': 'passed',
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/native-conformance-checks.json`, `${JSON.stringify(checks, null, 2)}\n`);
          NODE
        env:
          EXPECTED_DIGEST: ${{ needs.build_image.outputs.digest }}
          SOURCE_SHA: ${{ needs.metadata.outputs.sourceSha }}

      - name: Verify RC TLS certificates
        run: |
          set -euo pipefail
          for pair in \
            'xpod-rc-id-tls:id-rc.undefineds.co' \
            'xpod-rc-pods-tls:pods-rc.undefineds.co' \
            'xpod-rc-api-tls:api-rc.undefineds.co'
          do
            secret_name="${pair%%:*}"
            host="${pair#*:}"
            cert_file="${RUNNER_TEMP}/${secret_name}.crt"
            for attempt in $(seq 1 60); do
              if kubectl -n "$SEALOS_NAMESPACE" get secret "$secret_name" -o 'jsonpath={.data.tls\.crt}' 2>/dev/null | base64 -d > "$cert_file" && [ -s "$cert_file" ]; then
                break
              fi
              sleep 5
            done
            if [ ! -s "$cert_file" ]; then
              echo "::error::$secret_name did not receive tls.crt"
              exit 1
            fi
            openssl x509 -in "$cert_file" -noout -checkhost "$host"
          done

      - name: Verify public RC service
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.co/service/status > /dev/null
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.co/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error --max-time 15 https://pods-rc.undefineds.co/ > /dev/null
          curl --fail --silent --show-error --max-time 15 https://api-rc.undefineds.co/service/status > /dev/null
          dashboard_file="$RUNNER_TEMP/dashboard.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.co/dashboard/ --output "$dashboard_file"
          if ! grep -qi '<!doctype html\|<html' "$dashboard_file"; then
            echo "::error::dashboard did not return HTML"
            exit 1
          fi
          settings_file="$RUNNER_TEMP/settings.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.co/settings/ --output "$settings_file"
          if ! grep -qi '<!doctype html\|<html' "$settings_file"; then
            echo "::error::settings did not return HTML"
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://api-rc.undefineds.co/api/pod/settings/status)"
          if [ "$status" != "401" ]; then
            echo "::error::protected settings route must reject anonymous requests with 401"
            exit 1
          fi
          cat > "${RUNNER_TEMP}/public-checks.json" <<'JSON'
          {
            "service-status": "passed",
            "public-service": "passed",
            "oidc": "passed",
            "dashboard": "passed",
            "protected-route": "passed"
          }
          JSON

      - name: Authenticated pod smoke
        run: |
          set -euo pipefail
          bun scripts/prepare-rc-authenticated-smoke.ts \
            --base-url "$XPOD_SETTINGS_E2E_BASE_URL" \
            --seed-config "${RUNNER_TEMP}/xpod-rc-seed.json" \
            --output-env "${RUNNER_TEMP}/rc-authenticated-smoke.env" \
            --state-dir "${RUNNER_TEMP}/rc-authenticated-smoke-state"
          set -a
          . "${RUNNER_TEMP}/rc-authenticated-smoke.env"
          set +a
          set +e
          bun scripts/accept-xpod-settings.ts --allow-incomplete --output-dir "${RUNNER_TEMP}/acceptance"
          acceptance_status=$?
          set -e
          cat "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.md"
          if [ "$acceptance_status" -ne 0 ]; then
            exit "$acceptance_status"
          fi
          node scripts/assert-rc-authenticated-smoke.cjs "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.json"
          printf '%s\n' '{ "authenticated-pod": "passed" }' > "${RUNNER_TEMP}/authenticated-check.json"

      - name: Live Gateway login and Chat acceptance
        run: |
          set -euo pipefail
          if [ -z "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" ]; then
            echo "::error::XPOD_LIVE_PROVIDER_API_KEY_CONFIG secret is required for live Pod read/write, Gateway key, models, and chat acceptance"
            exit 1
          fi
          provider_file="${RUNNER_TEMP}/live-provider-api-key"
          printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$provider_file"
          chmod 600 "$provider_file"

          local_name="xpod-rc-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_name_file="${RUNNER_TEMP}/live-gateway-local-container-name"
          printf '%s\n' "$local_name" > "$local_name_file"

          docker run --detach --name "$local_name" \
            --publish 127.0.0.1::5737 \
            --env XPOD_EDITION=local \
            --env SOLID_OIDC_ISSUER=https://id-rc.undefineds.co/ \
            --env CSS_ROOT_FILE_PATH=/app/data \
            --env CSS_IDENTITY_DB_URL=/app/data/identity.sqlite \
            --env DATABASE_URL=/app/data/identity.sqlite \
            --env CSS_SPARQL_ENDPOINT=/app/data/quadstore.sqlite \
            --env CSS_RDF_INDEX_PATH=/app/data/rdf-index.sqlite \
            "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"

          host_port="$(docker port "$local_name" 5737/tcp | sed -E 's/.*:([0-9]+)$/\1/' | tail -1)"
          if [[ ! "$host_port" =~ ^[0-9]+$ ]]; then
            echo "::error::failed to resolve the temporary Local Xpod port"
            docker logs "$local_name" || true
            exit 1
          fi
          gateway="http://127.0.0.1:${host_port}/"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 2 "${gateway}service/status" > /dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$local_name" 2>/dev/null || true)" != "true" ]]; then
              echo "::error::temporary Local Xpod exited before Gateway became reachable"
              docker logs "$local_name" || true
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 "${gateway}service/status" > /dev/null

          XPOD_LIVE_PROVIDER_KEY_FILE="$provider_file" \
          XPOD_LIVE_GATEWAY_URL="$gateway" \
          XPOD_LIVE_CLOUD_IDP="https://id-rc.undefineds.co/" \
          bun run ai-connections:accept:live

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidencePath = path.join(process.cwd(), '.test-data', 'acceptance', 'live-gateway-login-chat-local.json');
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const required = [
            ['pod-read-write', 'podReadWrite'],
            ['gateway-key', 'gatewayAuth'],
            ['ai-connections', 'aiConnections'],
            ['models', 'models'],
            ['chat', 'chat'],
          ];
          const checks = {};
          for (const [checkName, layerName] of required) {
            const layer = evidence.layers?.[layerName];
            if (layer?.ok !== true) {
              throw new Error(`${checkName} did not pass: ${layer?.detail || 'missing evidence'}`);
            }
            checks[checkName] = 'passed';
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'live-gateway-checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Create service acceptance evidence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const temp = process.env.RUNNER_TEMP;
          const checks = {
            ...JSON.parse(fs.readFileSync(path.join(temp, 'deployment-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'secret-isolation-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'public-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'authenticated-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'live-gateway-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'native-conformance-checks.json'), 'utf8')),
          };
          fs.writeFileSync(path.join(temp, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Upload service acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/checks.json
          if-no-files-found: error

      # The promotion checks file only ever holds "passed" summaries. The full
      # native evidence (public16 semantics+search report, exact PG/service image
      # IDs, source/fixture/runner hashes, native ABI capabilities) is a separate
      # source-bound artifact.
      - name: Upload native conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-native-conformance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-conformance-evidence.json
            ${{ runner.temp }}/immutable-native-conformance/installed-image-conformance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dump diagnostics
        if: failure()
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods,svc -o wide || true
          kubectl -n "$SEALOS_NAMESPACE" describe deployment xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe statefulset xpod-rc-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" get events --sort-by='.lastTimestamp' | tail -n 200 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 --previous || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc-postgres --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker inspect "$local_name" || true
              docker logs "$local_name" || true
            fi
          fi

      - name: Cleanup temporary Local Xpod
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker rm --force "$local_name" >/dev/null 2>&1 || true
            fi
          fi

      - name: Scale RC deployments to zero
        if: ${{ always() && vars.XPOD_RC_SCALE_TO_ZERO == 'true' }}
        run: |
          kubectl -n "$SEALOS_NAMESPACE" scale deployment/xpod-rc --replicas=0 || true
          kubectl -n "$SEALOS_NAMESPACE" scale statefulset/xpod-rc-postgres --replicas=0 || true

  build_desktop_rc:
    name: Build macOS RC desktop
    needs: [metadata, build_qlever_macos_runtime]
    runs-on: macos-15
    environment: rc
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT: ${{ github.workspace }}/.test-data/qlever-runtime/qlever-local-runtime-darwin-arm64.tar.gz
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_qlever_macos_runtime.outputs.artifact_name }}
          path: ${{ github.workspace }}/.test-data/qlever-runtime
      - run: bun install --frozen-lockfile
      - name: Apply and verify the candidate version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version
          node -e 'if (require("./desktop/package.json").version !== process.env.CANDIDATE_VERSION) process.exit(1)'
      - name: Build desktop with the accepted native runtime
        working-directory: desktop
        run: bun run dist
      # The Account document links `/app/assets/main.css` by name. A build that
      # emits the stylesheet under another name (or not at all) ships a login page
      # with no styles, which already happened once in production.
      - name: Verify the Account document's assets were built
        run: |
          set -euo pipefail
          test -s static/app/auth.html
          grep -oE '/app/assets/[A-Za-z0-9._-]+' static/app/auth.html | sort -u | while read -r asset; do
            if [[ ! -s "static${asset}" ]]; then
              echo "::error::static${asset} is referenced by static/app/auth.html but was not built"
              exit 1
            fi
          done
          echo "Account document assets verified"
      - name: Verify root npm package boundary
        env:
          XPOD_INCLUDE_PLATFORM_PACKAGES: 'true'
        run: |
          set -euo pipefail
          node scripts/run-npm-pack.cjs .test-data/npm-preflight .test-data/npm-preflight-cache
          node scripts/check-pack-json.cjs .test-data/npm-preflight/pack.json
      - name: Verify packed Node and Bun consumers before publication
        run: |
          set -euo pipefail
          node scripts/check-package-registry-consumer.cjs .test-data/npm-preflight/pack.json "${RUNNER_TEMP}/xpod-packed-node" .test-data/npm-consumer-cache
          node scripts/check-package-registry-consumer.cjs .test-data/npm-preflight/pack.json "${RUNNER_TEMP}/xpod-packed-bun" .test-data/bun-consumer-cache bun
      - name: Save root package boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-boundary-${{ github.sha }}
          path: .test-data/npm-preflight/pack.json
          if-no-files-found: ignore
      - name: Verify desktop version and native runtime payload
        run: |
          set -euo pipefail
          app="desktop/release/mac-arm64/Xpod.app"
          runtime="$app/Contents/Resources/runtime/qlever/bin/xpod_qlever_local_runtime"
          [[ "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" == "$CANDIDATE_VERSION" ]]
          test -x "$runtime"
          test -s "$app/Contents/Resources/runtime/qlever/manifest.json"
      # The desktop updates itself by verifying the downloaded bundle, so the
      # archive must ship a valid ad-hoc signature (after-pack hook) rather than
      # the linker's unsealed one.

  finalize_acceptance:
    name: Finalize RC acceptance
    needs:
      - metadata
      - build_image
      - deploy_and_accept
      - build_desktop_rc
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: read
    env:
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/service-acceptance
      - name: Create the unified acceptance manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const checksPath = path.join(process.env.RUNNER_TEMP, 'service-acceptance', 'checks.json');
          const checks = {
            ...JSON.parse(fs.readFileSync(checksPath, 'utf8')),
            'qlever-local': 'passed',
            'desktop': 'passed',
            'package-consumers': 'passed',
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE
          node scripts/release-acceptance-manifest.cjs create \
            --target-version "${{ needs.metadata.outputs.target }}" \
            --candidate-version "$CANDIDATE_VERSION" \
            --source-sha "${{ needs.metadata.outputs.sourceSha }}" \
            --source-branch "$REF_NAME" \
            --image-digest "${{ needs.build_image.outputs.digest }}" \
            --endpoint "https://id-rc.undefineds.co" \
            --accepted-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --checks-file "${RUNNER_TEMP}/checks.json" > "${RUNNER_TEMP}/release-acceptance.json"
      - name: Upload the only stable-promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/release-acceptance.json
          if-no-files-found: error
