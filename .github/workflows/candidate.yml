name: Release Candidate

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.candidate.outputs.target }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      shaTag: ${{ steps.candidate.outputs.shaTag }}
      sourceSha: ${{ steps.candidate.outputs.sourceSha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release candidate metadata
        id: candidate
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != release/* ]]; then
            echo "::error::candidate workflow can only run on release/** branches"
            exit 1
          fi
          metadata="$(node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --sha "$SOURCE_SHA" \
            --json)"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${metadata.targetVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${metadata.candidateVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `shaTag=${metadata.shaTag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sourceSha=${metadata.sourceSha}\n`);
          ' "$metadata"

  rc_prerequisites:
    needs: metadata
    runs-on: ubuntu-latest
    environment: rc
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
    steps:
      - name: Verify RC DNS and namespace prerequisites
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG_DATA is required"
            exit 1
          fi
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE must be a valid Kubernetes name"
            exit 1
          fi
          node - <<'NODE'
          const { Resolver } = require('node:dns').promises;
          const hosts = [
            'id-rc.undefineds.co',
            'pods-rc.undefineds.co',
            'api-rc.undefineds.co',
          ];
          const resolvers = [ undefined, [ '1.1.1.1', '8.8.8.8' ] ].map((servers) => {
            const resolver = new Resolver();
            if (servers) resolver.setServers(servers);
            return resolver;
          });
          Promise.all(hosts.map(async (host) => {
            for (const resolver of resolvers) {
              try {
                const addresses = await resolver.resolve4(host);
                if (addresses.length) return;
              } catch {}
            }
            throw new Error(`${host}: empty DNS result`);
          })).catch((error) => {
            console.error(`::error::all RC hosts must resolve before artifacts are published: ${error.message}`);
            process.exit(1);
          });
          NODE
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl auth can-i create deployments -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create services -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create ingresses.networking.k8s.io -n "$SEALOS_NAMESPACE" | grep -qx yes

  publish_qlever_runtime_sdk:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/publish-qlever-runtime-sdk.yml
    permissions:
      contents: read
      packages: write
    with:
      source_commit: ${{ needs.metadata.outputs.sourceSha }}

  publish_qlever_local_runtime:
    needs: publish_qlever_runtime_sdk
    uses: ./.github/workflows/publish-qlever-local-runtime.yml
    permissions:
      contents: read
      packages: write
    with:
      prior_sdk_image: ${{ needs.publish_qlever_runtime_sdk.outputs.image }}

  build_qlever_macos_runtime:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/build-qlever-macos-runtime.yml
    permissions:
      contents: read

  build_image:
    needs: [metadata, rc_prerequisites, publish_qlever_local_runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply candidate root version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/undefinedsco/xpod:sha-${{ needs.metadata.outputs.sourceSha }}
            ghcr.io/undefinedsco/xpod:${{ needs.metadata.outputs.candidate }}
          cache-from: type=gha,scope=xpod-server
          cache-to: type=gha,mode=max,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ needs.publish_qlever_local_runtime.outputs.image }}

  deploy_and_accept:
    needs: [metadata, build_image]
    runs-on: ubuntu-latest
    environment: rc
    concurrency:
      group: xpod-shared-rc-service
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      XPOD_RC_SEED_CONFIG: ${{ secrets.XPOD_RC_SEED_CONFIG }}
      XPOD_RC_SEED_SECRET_NAME: xpod-rc-seed-${{ github.run_id }}-${{ github.run_attempt }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      XPOD_RUNTIME_SECRET_NAME: ${{ vars.XPOD_RUNTIME_SECRET_NAME }}
      XPOD_ACCEPTANCE_REAL_XPOD: 'true'
      XPOD_ACCEPTANCE_RUN_VISUAL: 'true'
      XPOD_SETTINGS_E2E_BASE_URL: https://id-rc.undefineds.co
      XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
      XPOD_AI_PROXY_URL: ${{ secrets.XPOD_AI_PROXY_URL }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Login to GHCR for Local acceptance runtime
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: Install Chromium for authenticated acceptance
        run: bunx playwright install --with-deps chromium

      - name: Set up kubeconfig
        run: |
          set -euo pipefail
          validate_k8s_name() {
            local name="$1"
            local label="$2"
            if [[ ! "$name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#name} -gt 63 ]]; then
              echo "::error::${label} must be a valid Kubernetes name"
              exit 1
            fi
          }
          if [ -z "$SEALOS_NAMESPACE" ]; then
            echo "::error::SEALOS_NAMESPACE is required"
            exit 1
          fi
          if [ -z "$XPOD_RUNTIME_SECRET_NAME" ]; then
            echo "::error::XPOD_RUNTIME_SECRET_NAME is required"
            exit 1
          fi
          if [ -z "$XPOD_RC_SEED_CONFIG" ]; then
            echo "::error::XPOD_RC_SEED_CONFIG is required"
            exit 1
          fi
          validate_k8s_name "$SEALOS_NAMESPACE" SEALOS_NAMESPACE
          validate_k8s_name "$XPOD_RUNTIME_SECRET_NAME" XPOD_RUNTIME_SECRET_NAME
          validate_k8s_name "$XPOD_RC_SEED_SECRET_NAME" XPOD_RC_SEED_SECRET_NAME
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Validate RC runtime secret isolation
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/xpod-rc.env"
          seed_file="${RUNNER_TEMP}/xpod-rc-seed.json"
          printf '%s\n' "$APP_ENV_FILE" > "$env_file"
          printf '%s\n' "$XPOD_RC_SEED_CONFIG" > "$seed_file"
          chmod 600 "$env_file"
          chmod 600 "$seed_file"
          node - "$env_file" "$seed_file" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const seedText = fs.readFileSync(process.argv[3], 'utf8');
          const required = [
            'CSS_REDIS_CLIENT',
            'CSS_MINIO_ENDPOINT',
            'CSS_MINIO_BUCKET_NAME',
            'CSS_MINIO_ACCESS_KEY',
            'CSS_MINIO_SECRET_KEY',
            'XPOD_INNGEST_EVENT_KEY',
            'XPOD_INNGEST_SIGNING_KEY',
            'XPOD_GATEWAY_LOCATOR_SECRET',
          ];
          const entries = new Map();
          for (const line of text.split(/\r?\n/)) {
            if (!line || line.trimStart().startsWith('#')) continue;
            const match = /^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/.exec(line);
            if (match) entries.set(match[1], match[2]);
          }
          for (const key of required) {
            if (!entries.has(key) || entries.get(key).trim() === '') {
              throw new Error(`missing required RC secret key: ${key}`);
            }
          }
          const seed = JSON.parse(seedText);
          if (!Array.isArray(seed)) {
            throw new Error('XPOD_RC_SEED_CONFIG must be a seed account array');
          }
          const accountKeys = seed.map((entry) => `${entry?.email || ''} ${entry?.pods?.map?.((pod) => pod?.name).join(' ') || ''}`.toLowerCase());
          if (!accountKeys.some((value) => value.includes('alice')) || !accountKeys.some((value) => value.includes('bob'))) {
            throw new Error('XPOD_RC_SEED_CONFIG must include Alice and Bob seed accounts');
          }
          const productionDomainPattern = /(^|[^A-Za-z0-9.-])id\.undefineds\.co\b/;
          const redisValue = entries.get('CSS_REDIS_CLIENT') || '';
          if (/(?:prod|production|xpod-cloud)/i.test(redisValue) || productionDomainPattern.test(redisValue)) {
            throw new Error('production Redis is not allowed in RC APP_ENV_FILE');
          }
          let redisUrl;
          try {
            redisUrl = new URL(redisValue);
          } catch {
            throw new Error('CSS_REDIS_CLIENT must be a valid Redis URL');
          }
          if (!['redis:', 'rediss:'].includes(redisUrl.protocol)) {
            throw new Error('CSS_REDIS_CLIENT must use redis:// or rediss://');
          }
          const dbMatch = /^\/([0-9]+)$/.exec(redisUrl.pathname);
          if (!dbMatch) {
            throw new Error('RC Redis URL must include an explicit nonzero DB index');
          }
          if (Number(dbMatch[1]) === 0) {
            throw new Error('RC Redis DB must use a non-default database index');
          }
          if (entries.get('CSS_MINIO_BUCKET_NAME') !== 'xpod-rc') {
            throw new Error('RC object-store bucket must be xpod-rc');
          }
          let objectStoreUrl;
          try {
            objectStoreUrl = new URL(entries.get('CSS_MINIO_ENDPOINT'));
          } catch {
            throw new Error('CSS_MINIO_ENDPOINT must be a valid URL');
          }
          if (objectStoreUrl.protocol !== 'https:' || !objectStoreUrl.hostname.endsWith('.r2.cloudflarestorage.com')) {
            throw new Error('RC object-store endpoint must use Cloudflare R2 over HTTPS');
          }
          const sanitized = [];
          for (const [ key, value ] of entries) {
            if (!['CSS_IDENTITY_DB_URL', 'CSS_SPARQL_ENDPOINT'].includes(key)) {
              sanitized.push(`${key}=${value}`);
            }
          }
          fs.writeFileSync(process.argv[2], `${sanitized.join('\n')}\n`);
          NODE
          bun scripts/verify-rc-r2-access.ts --env-file "$env_file"
          bun scripts/materialize-rc-seed-config.ts \
            --input "$seed_file" \
            --output "$seed_file" \
            --suffix "rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo '{"secret-isolation":"passed"}' > "${RUNNER_TEMP}/secret-isolation-check.json"

      - name: Create runtime secrets
        run: |
          set -euo pipefail
          pg_password="$(openssl rand -hex 32)"
          pg_host="xpod-rc-postgres"
          identity_db_url="postgresql://xpod_rc:${pg_password}@${pg_host}:5432/xpod_rc"
          sparql_endpoint="postgresql://xpod_rc:${pg_password}@${pg_host}:5432/xpod_rc"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$identity_db_url"
          echo "::add-mask::$sparql_endpoint"
          printf 'CSS_IDENTITY_DB_URL=%s\n' "$identity_db_url" >> "${RUNNER_TEMP}/xpod-rc.env"
          printf 'CSS_SPARQL_ENDPOINT=%s\n' "$sparql_endpoint" >> "${RUNNER_TEMP}/xpod-rc.env"
          kubectl -n "$SEALOS_NAMESPACE" create secret generic xpod-rc-postgres-secret \
            --from-literal=POSTGRES_DB=xpod_rc \
            --from-literal=POSTGRES_USER=xpod_rc \
            --from-literal=POSTGRES_PASSWORD="$pg_password" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RUNTIME_SECRET_NAME" \
            --from-env-file="${RUNNER_TEMP}/xpod-rc.env" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RC_SEED_SECRET_NAME" \
            --from-file=rc.json="${RUNNER_TEMP}/xpod-rc-seed.json" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy RC image by digest
        run: |
          set -euo pipefail
          postgres_manifest="${RUNNER_TEMP}/xpod-rc-postgres.rendered.yaml"
          rendered_manifest="${RUNNER_TEMP}/xpod-rc.rendered.yaml"
          node scripts/render-rc-manifests.cjs \
            --overlay deploy/sealos/rc-postgres \
            --output "$postgres_manifest" \
            --namespace "$SEALOS_NAMESPACE"
          node scripts/render-rc-manifests.cjs \
            --overlay deploy/sealos/rc \
            --output "$rendered_manifest" \
            --namespace "$SEALOS_NAMESPACE" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME" \
            --seed-secret-name "$XPOD_RC_SEED_SECRET_NAME" \
            --image "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc --cascade=foreground --wait=true --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete statefulset/xpod-rc-postgres --cascade=foreground --wait=true --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete service/xpod-rc-postgres --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" delete pvc/data-xpod-rc-postgres-0 --ignore-not-found
          kubectl apply -f "$postgres_manifest"
          kubectl rollout status statefulset/xpod-rc-postgres -n "$SEALOS_NAMESPACE" --timeout=600s
          postgres_version_num="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc --no-align --tuples-only --command 'SHOW server_version_num' | tr -d '[:space:]')"
          if ! [[ "$postgres_version_num" =~ ^17[0-9]{4}$ ]]; then
            echo "::error::RC database must run PostgreSQL 17"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -v ON_ERROR_STOP=1 -U xpod_rc -d xpod_rc --command 'CREATE EXTENSION IF NOT EXISTS vector'
          vector_version="$(kubectl -n "$SEALOS_NAMESPACE" exec statefulset/xpod-rc-postgres -- \
            psql -U xpod_rc -d xpod_rc --no-align --tuples-only \
              --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | tr -d '[:space:]')"
          if [ -z "$vector_version" ]; then
            echo "::error::RC database did not activate the vector extension"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" get configmap gateway -o yaml \
            | node scripts/update-gateway-rc-configmap.cjs --namespace "$SEALOS_NAMESPACE" \
            | kubectl apply -f -
          kubectl apply -f "$rendered_manifest"
          kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-inngest -o json > "${RUNNER_TEMP}/inngest.json"
          node scripts/patch-shared-inngest-rc.cjs \
            --input "${RUNNER_TEMP}/inngest.json" \
            --output "${RUNNER_TEMP}/inngest-rc.json" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME"
          kubectl apply -f "${RUNNER_TEMP}/inngest-rc.json"
          kubectl -n "$SEALOS_NAMESPACE" rollout restart deployment/gateway
          kubectl rollout status deployment/gateway -n "$SEALOS_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/xpod-rc -n "$SEALOS_NAMESPACE" --timeout=900s
          expected_image="ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          deployment_image="$(kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-rc -o jsonpath='{.spec.template.spec.containers[?(@.name=="xpod")].image}')"
          if [ "$deployment_image" != "$expected_image" ]; then
            echo "::error::deployment image digest mismatch"
            exit 1
          fi
          pod_name="$(kubectl -n "$SEALOS_NAMESPACE" get pods -l app=xpod-rc -o json | node -e '
            const input = [];
            process.stdin.on("data", (chunk) => input.push(chunk));
            process.stdin.on("end", () => {
              const digest = process.argv[1];
              const pods = JSON.parse(Buffer.concat(input)).items || [];
              const pod = pods.find(({ metadata, status }) => {
                const containerStatus = status?.containerStatuses?.find(({ name }) => name === "xpod");
                return !metadata.deletionTimestamp && status?.phase === "Running" &&
                  containerStatus?.ready === true && containerStatus.imageID?.includes(digest);
              });
              if (!pod) process.exit(1);
              process.stdout.write(pod.metadata.name);
            });
          ' "${{ needs.build_image.outputs.digest }}")"
          pod_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.status.containerStatuses[?(@.name=="xpod")].imageID}')"
          if [[ "$pod_image_id" != *"${{ needs.build_image.outputs.digest }}"* ]]; then
            echo "::error::ready pod imageID digest mismatch"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- node -e "fetch('http://127.0.0.1:3000/service/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
          kubectl -n "$SEALOS_NAMESPACE" get secret "$XPOD_RUNTIME_SECRET_NAME" -o json \
            | node -e "const input=[];process.stdin.on('data',(chunk)=>input.push(chunk));process.stdin.on('end',()=>{const data=JSON.parse(Buffer.concat(input)).data||{};for(const key of ['CSS_MINIO_ENDPOINT','CSS_MINIO_BUCKET_NAME','CSS_MINIO_ACCESS_KEY','CSS_MINIO_SECRET_KEY'])if(!data[key])throw new Error('deployed RC secret is missing '+key);});"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc-minio service/xpod-rc-minio job/xpod-rc-minio-init pvc/xpod-rc-minio secret/xpod-rc-object-store --ignore-not-found
          cat > "${RUNNER_TEMP}/deployment-checks.json" <<'JSON'
          {
            "image": "passed",
            "deployed-digest": "passed",
            "direct-pod": "passed",
            "postgres-17": "passed",
            "postgres-ephemeral": "passed",
            "vector": "passed"
          }
          JSON

      - name: Verify RC TLS certificates
        run: |
          set -euo pipefail
          for pair in \
            'xpod-rc-id-tls:id-rc.undefineds.co' \
            'xpod-rc-pods-tls:pods-rc.undefineds.co' \
            'xpod-rc-api-tls:api-rc.undefineds.co'
          do
            secret_name="${pair%%:*}"
            host="${pair#*:}"
            cert_file="${RUNNER_TEMP}/${secret_name}.crt"
            for attempt in $(seq 1 60); do
              if kubectl -n "$SEALOS_NAMESPACE" get secret "$secret_name" -o 'jsonpath={.data.tls\.crt}' 2>/dev/null | base64 -d > "$cert_file" && [ -s "$cert_file" ]; then
                break
              fi
              sleep 5
            done
            if [ ! -s "$cert_file" ]; then
              echo "::error::$secret_name did not receive tls.crt"
              exit 1
            fi
            openssl x509 -in "$cert_file" -noout -checkhost "$host"
          done

      - name: Verify public RC service
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.co/service/status > /dev/null
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.co/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error --max-time 15 https://pods-rc.undefineds.co/ > /dev/null
          curl --fail --silent --show-error --max-time 15 https://api-rc.undefineds.co/service/status > /dev/null
          dashboard_file="$RUNNER_TEMP/dashboard.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.co/dashboard/ --output "$dashboard_file"
          if ! grep -qi '<!doctype html\|<html' "$dashboard_file"; then
            echo "::error::dashboard did not return HTML"
            exit 1
          fi
          settings_file="$RUNNER_TEMP/settings.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.co/settings/ --output "$settings_file"
          if ! grep -qi '<!doctype html\|<html' "$settings_file"; then
            echo "::error::settings did not return HTML"
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://api-rc.undefineds.co/api/pod/settings/status)"
          if [ "$status" != "401" ]; then
            echo "::error::protected settings route must reject anonymous requests with 401"
            exit 1
          fi
          cat > "${RUNNER_TEMP}/public-checks.json" <<'JSON'
          {
            "service-status": "passed",
            "public-service": "passed",
            "oidc": "passed",
            "dashboard": "passed",
            "protected-route": "passed"
          }
          JSON

      - name: Authenticated pod smoke
        run: |
          set -euo pipefail
          bun scripts/prepare-rc-authenticated-smoke.ts \
            --base-url "$XPOD_SETTINGS_E2E_BASE_URL" \
            --seed-config "${RUNNER_TEMP}/xpod-rc-seed.json" \
            --output-env "${RUNNER_TEMP}/rc-authenticated-smoke.env" \
            --state-dir "${RUNNER_TEMP}/rc-authenticated-smoke-state"
          set -a
          . "${RUNNER_TEMP}/rc-authenticated-smoke.env"
          set +a
          set +e
          bun scripts/accept-xpod-settings.ts --allow-incomplete --output-dir "${RUNNER_TEMP}/acceptance"
          acceptance_status=$?
          set -e
          cat "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.md"
          if [ "$acceptance_status" -ne 0 ]; then
            exit "$acceptance_status"
          fi
          node scripts/assert-rc-authenticated-smoke.cjs "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.json"
          printf '%s\n' '{ "authenticated-pod": "passed" }' > "${RUNNER_TEMP}/authenticated-check.json"

      - name: Live Gateway login and Chat acceptance
        run: |
          set -euo pipefail
          if [ -z "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" ]; then
            echo "::error::XPOD_LIVE_PROVIDER_API_KEY_CONFIG secret is required for live Pod read/write, Gateway key, models, and chat acceptance"
            exit 1
          fi
          provider_file="${RUNNER_TEMP}/live-provider-api-key"
          printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$provider_file"
          chmod 600 "$provider_file"

          local_name="xpod-rc-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_name_file="${RUNNER_TEMP}/live-gateway-local-container-name"
          printf '%s\n' "$local_name" > "$local_name_file"

          docker run --detach --name "$local_name" \
            --publish 127.0.0.1::5737 \
            --env XPOD_EDITION=local \
            --env SOLID_OIDC_ISSUER=https://id-rc.undefineds.co/ \
            --env CSS_ROOT_FILE_PATH=/app/data \
            --env CSS_IDENTITY_DB_URL=/app/data/identity.sqlite \
            --env DATABASE_URL=/app/data/identity.sqlite \
            --env CSS_SPARQL_ENDPOINT=/app/data/quadstore.sqlite \
            --env CSS_RDF_INDEX_PATH=/app/data/rdf-index.sqlite \
            "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"

          host_port="$(docker port "$local_name" 5737/tcp | sed -E 's/.*:([0-9]+)$/\1/' | tail -1)"
          if [[ ! "$host_port" =~ ^[0-9]+$ ]]; then
            echo "::error::failed to resolve the temporary Local Xpod port"
            docker logs "$local_name" || true
            exit 1
          fi
          gateway="http://127.0.0.1:${host_port}/"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 2 "${gateway}service/status" > /dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$local_name" 2>/dev/null || true)" != "true" ]]; then
              echo "::error::temporary Local Xpod exited before Gateway became reachable"
              docker logs "$local_name" || true
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 "${gateway}service/status" > /dev/null

          XPOD_LIVE_PROVIDER_KEY_FILE="$provider_file" \
          XPOD_LIVE_GATEWAY_URL="$gateway" \
          XPOD_LIVE_CLOUD_IDP="https://id-rc.undefineds.co/" \
          bun run ai-connections:accept:live

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidencePath = path.join(process.cwd(), '.test-data', 'acceptance', 'live-gateway-login-chat-local.json');
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const required = [
            ['pod-read-write', 'podReadWrite'],
            ['gateway-key', 'gatewayAuth'],
            ['ai-connections', 'aiConnections'],
            ['models', 'models'],
            ['chat', 'chat'],
          ];
          const checks = {};
          for (const [checkName, layerName] of required) {
            const layer = evidence.layers?.[layerName];
            if (layer?.ok !== true) {
              throw new Error(`${checkName} did not pass: ${layer?.detail || 'missing evidence'}`);
            }
            checks[checkName] = 'passed';
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'live-gateway-checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Create service acceptance evidence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const temp = process.env.RUNNER_TEMP;
          const checks = {
            ...JSON.parse(fs.readFileSync(path.join(temp, 'deployment-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'secret-isolation-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'public-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'authenticated-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'live-gateway-checks.json'), 'utf8')),
          };
          fs.writeFileSync(path.join(temp, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Upload service acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/checks.json
          if-no-files-found: error

      - name: Dump diagnostics
        if: failure()
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods,svc -o wide || true
          kubectl -n "$SEALOS_NAMESPACE" describe deployment xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe statefulset xpod-rc-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" get events --sort-by='.lastTimestamp' | tail -n 200 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 --previous || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc-postgres --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker inspect "$local_name" || true
              docker logs "$local_name" || true
            fi
          fi

      - name: Cleanup temporary Local Xpod
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker rm --force "$local_name" >/dev/null 2>&1 || true
            fi
          fi

      - name: Scale RC deployments to zero
        if: ${{ always() && vars.XPOD_RC_SCALE_TO_ZERO == 'true' }}
        run: |
          kubectl -n "$SEALOS_NAMESPACE" scale deployment/xpod-rc --replicas=0 || true
          kubectl -n "$SEALOS_NAMESPACE" scale statefulset/xpod-rc-postgres --replicas=0 || true

  publish_npm_rc:
    name: Publish npm RC staging packages
    needs: [metadata, deploy_and_accept, build_qlever_macos_runtime]
    runs-on: macos-15
    environment: rc
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      XPOD_PUBLISH_REGISTRY: https://registry.npmjs.org
      XPOD_PUBLISH_TAG: rc
      XPOD_PUBLISH_PLATFORM_PACKAGES: 'false'
      XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT: ${{ github.workspace }}/.test-data/qlever-runtime/qlever-local-runtime-darwin-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_qlever_macos_runtime.outputs.artifact_name }}
          path: ${{ github.workspace }}/.test-data/qlever-runtime

      - run: bun install --frozen-lockfile

      - name: Apply the immutable candidate version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version
          bun run check:platform-package-version

      - name: Build the public package
        run: bun run build

      - name: Publish the native macOS package under the RC staging tag
        run: node scripts/publish-platform-packages.cjs --tag=rc --target=darwin-arm64

      - name: Publish the root package under the RC staging tag
        run: node scripts/publish-release.cjs --skip-build

  verify_npm_node:
    name: Verify npm RC with Node ${{ matrix.node-version }}
    needs: [metadata, publish_npm_rc]
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 25]
    env:
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      XPOD_PACKAGE_SMOKE_INCLUDE_OPTIONAL: 'true'
      XPOD_QLEVER_SEMANTIC_FIXTURE_PATH: ${{ github.workspace }}/qlever/tests/fixtures/qlever-semantic-conformance.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Wait for the exact public candidate
        run: node scripts/wait-for-npm-package.cjs "@undefineds.co/xpod@$CANDIDATE_VERSION"
      - name: Install the root and native optional package
        run: node scripts/package-smoke-install.cjs "@undefineds.co/xpod@$CANDIDATE_VERSION" "${{ runner.temp }}/xpod-package-smoke" .test-data/npm-cache
      - name: Start and query the installed Local runtime
        run: node scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke"

  verify_npm_bun:
    name: Verify npm RC with Bun on Node ${{ matrix.node-version }}
    needs: [metadata, publish_npm_rc]
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 25]
    env:
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      XPOD_PACKAGE_SMOKE_INCLUDE_OPTIONAL: 'true'
      XPOD_QLEVER_SEMANTIC_FIXTURE_PATH: ${{ github.workspace }}/qlever/tests/fixtures/qlever-semantic-conformance.cjs
      XPOD_SMOKE_NODE: bun
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Wait for the exact public candidate
        run: node scripts/wait-for-npm-package.cjs "@undefineds.co/xpod@$CANDIDATE_VERSION"
      - name: Install the root and native optional package with Bun
        run: node scripts/package-smoke-install.cjs "@undefineds.co/xpod@$CANDIDATE_VERSION" "${{ runner.temp }}/xpod-package-smoke-bun" .test-data/bun-cache bun
      - name: Start and query the installed Local runtime with Bun
        run: bun scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke-bun"

  build_desktop_rc:
    name: Build macOS RC desktop
    needs: [metadata, verify_npm_node, verify_npm_bun, build_qlever_macos_runtime]
    runs-on: macos-15
    environment: rc
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT: ${{ github.workspace }}/.test-data/qlever-runtime/qlever-local-runtime-darwin-arm64.tar.gz
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_qlever_macos_runtime.outputs.artifact_name }}
          path: ${{ github.workspace }}/.test-data/qlever-runtime
      - run: bun install --frozen-lockfile
      - name: Apply and verify the candidate version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version
          node -e 'if (require("./desktop/package.json").version !== process.env.CANDIDATE_VERSION) process.exit(1)'
      - name: Build desktop with the accepted native runtime
        working-directory: desktop
        run: bun run dist
      - name: Verify desktop version and native runtime payload
        run: |
          set -euo pipefail
          app="desktop/release/mac-arm64/Xpod.app"
          runtime="$app/Contents/Resources/runtime/qlever/bin/xpod_qlever_local_runtime"
          [[ "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" == "$CANDIDATE_VERSION" ]]
          test -x "$runtime"
          test -s "$app/Contents/Resources/runtime/qlever/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: xpod-desktop-macos-${{ needs.metadata.outputs.candidate }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  finalize_acceptance:
    name: Finalize unified RC acceptance
    needs:
      - metadata
      - build_image
      - deploy_and_accept
      - verify_npm_node
      - verify_npm_bun
      - build_desktop_rc
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/service-acceptance
      - name: Promote only the fully verified npm candidate to next
        run: |
          set -euo pipefail
          packages=( @undefineds.co/xpod @undefineds.co/xpod-darwin-arm64 )
          for package in "${packages[@]}"; do
            for attempt in {1..5}; do
              if npm dist-tag add "$package@$CANDIDATE_VERSION" next --registry https://registry.npmjs.org; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::Failed to update the npm next tag for $package"
                exit 1
              fi
              sleep "$((attempt * 2))"
            done
          done
          for package in "${packages[@]}"; do
            for attempt in {1..12}; do
              actual="$(npm view "$package" dist-tags.next --json --prefer-online --registry https://registry.npmjs.org 2>/dev/null || true)"
              actual="${actual%\"}"
              actual="${actual#\"}"
              if [[ "$actual" == "$CANDIDATE_VERSION" ]]; then
                break
              fi
              if [[ "$attempt" -eq 12 ]]; then
                echo "::error::npm next did not converge for $package"
                exit 1
              fi
              sleep 5
            done
          done
      - name: Create the unified acceptance manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const checksPath = path.join(process.env.RUNNER_TEMP, 'service-acceptance', 'checks.json');
          const checks = {
            ...JSON.parse(fs.readFileSync(checksPath, 'utf8')),
            'qlever-local': 'passed',
            'npm-node': 'passed',
            'npm-bun': 'passed',
            'npm-next': 'passed',
            'desktop': 'passed',
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE
          node scripts/release-acceptance-manifest.cjs create \
            --target-version "${{ needs.metadata.outputs.target }}" \
            --candidate-version "$CANDIDATE_VERSION" \
            --source-sha "${{ needs.metadata.outputs.sourceSha }}" \
            --source-branch "$REF_NAME" \
            --image-digest "${{ needs.build_image.outputs.digest }}" \
            --endpoint "https://id-rc.undefineds.co" \
            --accepted-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --checks-file "${RUNNER_TEMP}/checks.json" > "${RUNNER_TEMP}/release-acceptance.json"
      - name: Upload the only stable-promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/release-acceptance.json
          if-no-files-found: error
