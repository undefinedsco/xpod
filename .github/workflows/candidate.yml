name: Release Candidate

on:
  push:
    branches: ['staging']
  workflow_dispatch:
    inputs:
      task_diagnostic_only:
        description: 'Diagnose Task against the fixed rc230 runtime; never produces release acceptance'
        type: boolean
        required: false
        default: false

concurrency:
  group: xpod-rc-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    if: ${{ inputs.task_diagnostic_only != true }}
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.candidate.outputs.target }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      shaTag: ${{ steps.candidate.outputs.shaTag }}
      sourceSha: ${{ steps.candidate.outputs.sourceSha }}
      runAttempt: ${{ steps.candidate.outputs.runAttempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release candidate metadata
        id: candidate
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != staging ]]; then
            echo "::error::merge into staging before requesting RC"
            exit 1
          fi
          metadata="$(node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --sha "$SOURCE_SHA" \
            --json)"
          node -e '
            const metadata = JSON.parse(process.argv[1]);
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${metadata.targetVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${metadata.candidateVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `shaTag=${metadata.shaTag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sourceSha=${metadata.sourceSha}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `runAttempt=${process.env.RUN_ATTEMPT}\n`);
          ' "$metadata"

  rc_prerequisites:
    needs: metadata
    runs-on: ubuntu-latest
    environment: rc
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify RC DNS and namespace prerequisites
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG_DATA is required"
            exit 1
          fi
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE must be a valid Kubernetes name"
            exit 1
          fi
          node - <<'NODE'
          const { Resolver } = require('node:dns').promises;
          const hosts = [
            'id-rc.undefineds.cn',
            'pods-rc.undefineds.cn',
            'api-rc.undefineds.cn',
          ];
          const resolvers = [ undefined, [ '1.1.1.1', '8.8.8.8' ] ].map((servers) => {
            const resolver = new Resolver();
            if (servers) resolver.setServers(servers);
            return resolver;
          });
          Promise.all(hosts.map(async (host) => {
            for (const resolver of resolvers) {
              try {
                const addresses = await resolver.resolve4(host);
                if (addresses.length) return;
              } catch {}
            }
            throw new Error(`${host}: empty DNS result`);
          })).catch((error) => {
            console.error(`::error::all RC hosts must resolve before artifacts are published: ${error.message}`);
            process.exit(1);
          });
          NODE
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          node scripts/verify-rc-cluster-target.cjs
          node scripts/check-rc-deployment-boundary.cjs
          kubectl auth can-i create deployments -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create services -n "$SEALOS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create ingresses.networking.k8s.io -n "$SEALOS_NAMESPACE" | grep -qx yes

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run build:packages

      # Read-only preflight: an already published shared version may differ from the
      # freshly packed payload only in the provenance field gitHead. That case PASSES and
      # the verified registry tarball is reused (no republish); any real content, member,
      # mode, or manifest semantic divergence fails closed here, before expensive artifact
      # jobs. It downloads and raw-integrity-checks the existing registry tarballs and
      # consumes the exact mixed tarballs. It never publishes and never moves a dist-tag.
      - name: Verify shared package reuse without publishing
        env:
          XPOD_ACCEPTED_SHA: ${{ github.sha }}
        run: node scripts/publish-workspace-packages.cjs --verify-only

  publish_qlever_runtime_sdk:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/publish-qlever-runtime-sdk.yml
    permissions:
      contents: read
      packages: write
    with:
      source_commit: ${{ needs.metadata.outputs.sourceSha }}

  publish_qlever_local_runtime:
    needs: publish_qlever_runtime_sdk
    uses: ./.github/workflows/publish-qlever-local-runtime.yml
    permissions:
      contents: read
      packages: write
    with:
      prior_sdk_image: ${{ needs.publish_qlever_runtime_sdk.outputs.image }}

  build_qlever_macos_runtime:
    needs: [metadata, rc_prerequisites]
    uses: ./.github/workflows/build-qlever-macos-runtime.yml
    permissions:
      contents: read

  build_image:
    needs: [metadata, rc_prerequisites, publish_qlever_local_runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply candidate root version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ needs.metadata.outputs.runAttempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/undefinedsco/xpod:sha-${{ needs.metadata.outputs.sourceSha }}
            ghcr.io/undefinedsco/xpod:${{ needs.metadata.outputs.candidate }}
          cache-from: type=gha,scope=xpod-server
          cache-to: type=gha,mode=max,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ needs.publish_qlever_local_runtime.outputs.image }}

  deploy_and_accept:
    needs: [metadata, build_image]
    runs-on: ubuntu-latest
    environment: rc
    concurrency:
      group: xpod-shared-rc-service
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      XPOD_RC_SEED_CONFIG: ${{ secrets.XPOD_RC_SEED_CONFIG }}
      XPOD_RC_SEED_SECRET_NAME: xpod-rc-seed-${{ github.run_id }}-${{ github.run_attempt }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      XPOD_RUNTIME_SECRET_NAME: ${{ vars.XPOD_RUNTIME_SECRET_NAME }}
      XPOD_ACCEPTANCE_REAL_XPOD: 'true'
      XPOD_ACCEPTANCE_RUN_VISUAL: 'true'
      XPOD_SETTINGS_E2E_BASE_URL: https://id-rc.undefineds.cn
      XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
      XPOD_AI_PROXY_URL: ${{ secrets.XPOD_AI_PROXY_URL }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Login to GHCR for Local acceptance runtime
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: Verify the desktop self-update verifier
        run: node --test tests/scripts/desktop-self-update-acceptance.node-test.cjs tests/scripts/packaged-update-phases.node-test.mjs tests/scripts/desktop-permission-acceptance.node-test.cjs tests/scripts/desktop-permission-workflow.node-test.cjs tests/scripts/rc-cleanup-ownership.node-test.cjs tests/scripts/bun-single-runtime-entry.node-test.cjs tests/scripts/platform-package-budget.node-test.cjs

      - name: Install Chromium for authenticated acceptance
        run: bunx playwright install --with-deps chromium

      - name: Verify consent navigation before deployment
        run: |
          bun run build:packages
          bunx vitest run ui/src/pages/ConsentResume.test.tsx ui/src/pages/ConsentRetry.test.tsx --maxWorkers=2 --minWorkers=1
          bunx playwright test tests/e2e/consent-cross-origin-resume.spec.ts --workers=1

      - name: Set up kubeconfig
        id: rc_kubeconfig
        run: |
          set -euo pipefail
          validate_k8s_name() {
            local name="$1"
            local label="$2"
            if [[ ! "$name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#name} -gt 63 ]]; then
              echo "::error::${label} must be a valid Kubernetes name"
              exit 1
            fi
          }
          if [ -z "$SEALOS_NAMESPACE" ]; then
            echo "::error::SEALOS_NAMESPACE is required"
            exit 1
          fi
          if [ -z "$XPOD_RUNTIME_SECRET_NAME" ]; then
            echo "::error::XPOD_RUNTIME_SECRET_NAME is required"
            exit 1
          fi
          if [ -z "$XPOD_RC_SEED_CONFIG" ]; then
            echo "::error::XPOD_RC_SEED_CONFIG is required"
            exit 1
          fi
          validate_k8s_name "$SEALOS_NAMESPACE" SEALOS_NAMESPACE
          validate_k8s_name "$XPOD_RUNTIME_SECRET_NAME" XPOD_RUNTIME_SECRET_NAME
          validate_k8s_name "$XPOD_RC_SEED_SECRET_NAME" XPOD_RC_SEED_SECRET_NAME
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          node scripts/verify-rc-cluster-target.cjs
          node scripts/check-rc-deployment-boundary.cjs

      - name: Validate RC runtime secret isolation
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/xpod-rc.env"
          seed_file="${RUNNER_TEMP}/xpod-rc-seed.json"
          printf '%s\n' "$APP_ENV_FILE" > "$env_file"
          printf '%s\n' "$XPOD_RC_SEED_CONFIG" > "$seed_file"
          chmod 600 "$env_file"
          chmod 600 "$seed_file"
          node - "$env_file" "$seed_file" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const seedText = fs.readFileSync(process.argv[3], 'utf8');
          const required = [
            'CSS_IDENTITY_DB_URL',
            'CSS_SPARQL_ENDPOINT',
            'CSS_REDIS_CLIENT',
            'CSS_MINIO_ENDPOINT',
            'CSS_MINIO_BUCKET_NAME',
            'CSS_MINIO_ACCESS_KEY',
            'CSS_MINIO_SECRET_KEY',
            'XPOD_INNGEST_EVENT_KEY',
            'XPOD_INNGEST_SIGNING_KEY',
          ];
          const entries = new Map();
          for (const line of text.split(/\r?\n/)) {
            if (!line || line.trimStart().startsWith('#')) continue;
            const match = /^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/.exec(line);
            if (match) entries.set(match[1], match[2]);
          }
          for (const key of required) {
            if (!entries.has(key) || entries.get(key).trim() === '') {
              throw new Error(`missing required RC secret key: ${key}`);
            }
          }
          const namespace = process.env.SEALOS_NAMESPACE;
          const sharedPostgresHosts = new Set([
            'xpod-rdf-postgres',
            `xpod-rdf-postgres.${namespace}`,
            `xpod-rdf-postgres.${namespace}.svc`,
            `xpod-rdf-postgres.${namespace}.svc.cluster.local`,
          ]);
          for (const key of ['CSS_IDENTITY_DB_URL', 'CSS_SPARQL_ENDPOINT']) {
            let url;
            try { url = new URL(entries.get(key)); } catch {
              throw new Error(`${key} must be a valid PostgreSQL URL`);
            }
            if (!['postgres:', 'postgresql:'].includes(url.protocol) ||
                decodeURIComponent(url.username) !== 'xpod_rc' || url.pathname !== '/xpod_rc' ||
                !sharedPostgresHosts.has(url.hostname) || (url.port && url.port !== '5432')) {
              throw new Error(`${key} must use the isolated xpod_rc database and role on shared PostgreSQL`);
            }
          }
          const seed = JSON.parse(seedText);
          if (!Array.isArray(seed)) {
            throw new Error('XPOD_RC_SEED_CONFIG must be a seed account array');
          }
          const accountKeys = seed.map((entry) => `${entry?.email || ''} ${entry?.pods?.map?.((pod) => pod?.name).join(' ') || ''}`.toLowerCase());
          if (!accountKeys.some((value) => value.includes('alice')) || !accountKeys.some((value) => value.includes('bob'))) {
            throw new Error('XPOD_RC_SEED_CONFIG must include Alice and Bob seed accounts');
          }
          require('./scripts/check-rc-deployment-boundary.cjs').validateDatabases(entries);
          const productionDomainPattern = /(^|[^A-Za-z0-9.-])id\.undefineds\.(?:co|cn)\b/;
          const redisValue = entries.get('CSS_REDIS_CLIENT') || '';
          if (/(?:prod|production|xpod-cloud)/i.test(redisValue) || productionDomainPattern.test(redisValue)) {
            throw new Error('production Redis is not allowed in RC APP_ENV_FILE');
          }
          let redisUrl;
          try {
            redisUrl = new URL(redisValue);
          } catch {
            throw new Error('CSS_REDIS_CLIENT must be a valid Redis URL');
          }
          if (!['redis:', 'rediss:'].includes(redisUrl.protocol)) {
            throw new Error('CSS_REDIS_CLIENT must use redis:// or rediss://');
          }
          const dbMatch = /^\/([0-9]+)$/.exec(redisUrl.pathname);
          if (!dbMatch) {
            throw new Error('RC Redis URL must include an explicit nonzero DB index');
          }
          if (Number(dbMatch[1]) === 0) {
            throw new Error('RC Redis DB must use a non-default database index');
          }
          if (entries.get('CSS_MINIO_BUCKET_NAME') !== 'xpod-rc') {
            throw new Error('RC object-store bucket must be xpod-rc');
          }
          let objectStoreUrl;
          try {
            objectStoreUrl = new URL(entries.get('CSS_MINIO_ENDPOINT'));
          } catch {
            throw new Error('CSS_MINIO_ENDPOINT must be a valid URL');
          }
          if (objectStoreUrl.protocol !== 'https:' || !objectStoreUrl.hostname.endsWith('.r2.cloudflarestorage.com')) {
            throw new Error('RC object-store endpoint must use Cloudflare R2 over HTTPS');
          }
          // RC 与 cn/co 共用同一个 Postgres 实例，库由 APP_ENV_FILE 指定；
          // 这两个键不再过滤（过滤会让配置里的值静默失效）。
          fs.writeFileSync(process.argv[2], `${[ ...entries ].map(([ key, value ]) => `${key}=${value}`).join('\n')}\n`);
          NODE
          bun scripts/verify-rc-r2-access.ts --env-file "$env_file"
          bun scripts/materialize-rc-seed-config.ts \
            --input "$seed_file" \
            --output "$seed_file" \
            --suffix "rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo '{"secret-isolation":"passed"}' > "${RUNNER_TEMP}/secret-isolation-check.json"

      - name: Create runtime secrets
        run: |
          set -euo pipefail
          # 不再创建独立的 RC Postgres 及其随机密码；DB URL 由 APP_ENV_FILE 提供。
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RUNTIME_SECRET_NAME" \
            --from-env-file="${RUNNER_TEMP}/xpod-rc.env" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$SEALOS_NAMESPACE" create secret generic "$XPOD_RC_SEED_SECRET_NAME" \
            --from-file=rc.json="${RUNNER_TEMP}/xpod-rc-seed.json" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Reset the shared RC database
        run: |
          set -euo pipefail
          # RC 与 cn/co 共用 xpod-rdf-postgres：不重建实例，只重置 RC 自己的库。
          # 扩展顺序是硬要求：vector -> xpod_rdf -> xpod_qlever；
          # 顺序错了会缺 native_sparql_capabilities，应用启动即失败。
          # 用 statefulset/<name> 交给 kubectl 挑就绪 Pod；不用 items[0]（可能选中正在终止的那个）
          kubectl -n "$SEALOS_NAMESPACE" exec -i statefulset/xpod-rdf-postgres -- sh -s <<'SQL'
          set -e
          export PGPASSWORD="$POSTGRES_PASSWORD"
          version="$(psql -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -Atc 'SHOW server_version_num')"
          case "$version" in
            17????) ;;
            *) echo 'RC requires PostgreSQL 17 before database reset'; exit 1 ;;
          esac
          psql -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS xpod_rc WITH (FORCE)'
          psql -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE xpod_rc OWNER xpod_rc'
          psql -U "$POSTGRES_USER" -d xpod_rc -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
          psql -U "$POSTGRES_USER" -d xpod_rc -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS xpod_rdf VERSION '0.2.0'"
          psql -U "$POSTGRES_USER" -d xpod_rc -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS xpod_qlever VERSION '0.4.0'"
          postgres_version_num="$(psql -U "$POSTGRES_USER" -d xpod_rc --no-align --tuples-only --command 'SHOW server_version_num' | tr -d '[:space:]')"
          if ! echo "$postgres_version_num" | grep -Eq '^17[0-9]{4}$'; then
            echo 'RC database must run PostgreSQL 17' >&2
            exit 1
          fi
          vector_version="$(psql -U "$POSTGRES_USER" -d xpod_rc --no-align --tuples-only --command "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | tr -d '[:space:]')"
          test -n "$vector_version"
          # 扩展是用超级用户装的，schema 因此归 postgres：应用角色读不了，
          # 会以 "permission denied for schema xpod_rdf" 起不来。整库交给应用角色。
          psql -U "$POSTGRES_USER" -d xpod_rc -v ON_ERROR_STOP=1 <<'SQL2'
          DO $do$
          DECLARE r record;
          BEGIN
            FOR r IN SELECT nspname FROM pg_namespace
                     WHERE nspname NOT IN ('pg_catalog','information_schema','pg_toast')
                       AND pg_get_userbyid(nspowner) <> 'xpod_rc'
            LOOP
              EXECUTE format('ALTER SCHEMA %I OWNER TO xpod_rc', r.nspname);
              EXECUTE format('GRANT ALL ON SCHEMA %I TO xpod_rc', r.nspname);
              EXECUTE format('GRANT ALL ON ALL TABLES IN SCHEMA %I TO xpod_rc', r.nspname);
              EXECUTE format('GRANT ALL ON ALL SEQUENCES IN SCHEMA %I TO xpod_rc', r.nspname);
              EXECUTE format('GRANT ALL ON ALL FUNCTIONS IN SCHEMA %I TO xpod_rc', r.nspname);
            END LOOP;
          END
          $do$;
          SQL2
          extensions="$(psql -U "$POSTGRES_USER" -d xpod_rc -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_extension WHERE extname IN ('vector', 'xpod_rdf', 'xpod_qlever')")"
          test "$extensions" = 3
          SQL

      - name: Deploy RC image by digest
        run: |
          set -euo pipefail
          rendered_manifest="${RUNNER_TEMP}/xpod-rc.rendered.yaml"
          node scripts/render-rc-manifests.cjs \
            --overlay deploy/sealos/rc \
            --output "$rendered_manifest" \
            --namespace "$SEALOS_NAMESPACE" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME" \
            --seed-secret-name "$XPOD_RC_SEED_SECRET_NAME" \
            --image "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc --cascade=foreground --wait=true --ignore-not-found
          kubectl -n "$SEALOS_NAMESPACE" get configmap gateway -o yaml \
            | node scripts/update-gateway-rc-configmap.cjs --namespace "$SEALOS_NAMESPACE" \
            | kubectl apply -f -
          kubectl apply -f "$rendered_manifest"
          kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-inngest -o json > "${RUNNER_TEMP}/inngest.json"
          node scripts/patch-shared-inngest-rc.cjs \
            --input "${RUNNER_TEMP}/inngest.json" \
            --output "${RUNNER_TEMP}/inngest-rc.json" \
            --secret-name "$XPOD_RUNTIME_SECRET_NAME"
          kubectl apply -f "${RUNNER_TEMP}/inngest-rc.json"
          kubectl -n "$SEALOS_NAMESPACE" rollout restart deployment/gateway
          kubectl rollout status deployment/gateway -n "$SEALOS_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/xpod-rc -n "$SEALOS_NAMESPACE" --timeout=2400s
          expected_image="ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"
          deployment_image="$(kubectl -n "$SEALOS_NAMESPACE" get deployment xpod-rc -o jsonpath='{.spec.template.spec.containers[?(@.name=="xpod")].image}')"
          if [ "$deployment_image" != "$expected_image" ]; then
            echo "::error::deployment image digest mismatch"
            exit 1
          fi
          pod_name="$(kubectl -n "$SEALOS_NAMESPACE" get pods -l app=xpod-rc -o json | node -e '
            const input = [];
            process.stdin.on("data", (chunk) => input.push(chunk));
            process.stdin.on("end", () => {
              const digest = process.argv[1];
              const pods = JSON.parse(Buffer.concat(input)).items || [];
              const pod = pods.find(({ metadata, status }) => {
                const containerStatus = status?.containerStatuses?.find(({ name }) => name === "xpod");
                return !metadata.deletionTimestamp && status?.phase === "Running" &&
                  containerStatus?.ready === true && containerStatus.imageID?.includes(digest);
              });
              if (!pod) process.exit(1);
              process.stdout.write(pod.metadata.name);
            });
          ' "${{ needs.build_image.outputs.digest }}")"
          pod_image_id="$(kubectl -n "$SEALOS_NAMESPACE" get pod "$pod_name" -o jsonpath='{.status.containerStatuses[?(@.name=="xpod")].imageID}')"
          if [[ "$pod_image_id" != *"${{ needs.build_image.outputs.digest }}"* ]]; then
            echo "::error::ready pod imageID digest mismatch"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" exec "$pod_name" -c xpod -- node -e "fetch('http://127.0.0.1:3000/service/status').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
          kubectl -n "$SEALOS_NAMESPACE" get secret "$XPOD_RUNTIME_SECRET_NAME" -o json \
            | node -e "const input=[];process.stdin.on('data',(chunk)=>input.push(chunk));process.stdin.on('end',()=>{const data=JSON.parse(Buffer.concat(input)).data||{};for(const key of ['CSS_MINIO_ENDPOINT','CSS_MINIO_BUCKET_NAME','CSS_MINIO_ACCESS_KEY','CSS_MINIO_SECRET_KEY'])if(!data[key])throw new Error('deployed RC secret is missing '+key);});"
          kubectl -n "$SEALOS_NAMESPACE" delete deployment/xpod-rc-minio service/xpod-rc-minio job/xpod-rc-minio-init pvc/xpod-rc-minio secret/xpod-rc-object-store --ignore-not-found
          # postgres-ephemeral 指逻辑库 xpod_rc 每轮 DROP/CREATE 后的新鲜状态；
          # 物理实例 xpod-rdf-postgres 由 cn/co/RC 共享，不重建实例、不回收 PVC。
          cat > "${RUNNER_TEMP}/deployment-checks.json" <<'JSON'
          {
            "image": "passed",
            "deployed-digest": "passed",
            "direct-pod": "passed",
            "postgres-17": "passed",
            "postgres-isolated": "passed",
            "vector": "passed"
          }
          JSON

      - name: Verify RC TLS certificates
        run: |
          set -euo pipefail
          for pair in \
            'xpod-rc-id-tls:id-rc.undefineds.cn' \
            'xpod-rc-pods-tls:pods-rc.undefineds.cn' \
            'xpod-rc-api-tls:api-rc.undefineds.cn'
          do
            secret_name="${pair%%:*}"
            host="${pair#*:}"
            cert_file="${RUNNER_TEMP}/${secret_name}.crt"
            for attempt in $(seq 1 60); do
              if kubectl -n "$SEALOS_NAMESPACE" get secret "$secret_name" -o 'jsonpath={.data.tls\.crt}' 2>/dev/null | base64 -d > "$cert_file" && [ -s "$cert_file" ]; then
                break
              fi
              sleep 5
            done
            if [ ! -s "$cert_file" ]; then
              echo "::error::$secret_name did not receive tls.crt"
              exit 1
            fi
            openssl x509 -in "$cert_file" -noout -checkhost "$host"
          done

      - name: Verify public RC service
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.cn/service/status > /dev/null
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.cn/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error --max-time 15 https://pods-rc.undefineds.cn/ > /dev/null
          curl --fail --silent --show-error --max-time 15 https://api-rc.undefineds.cn/service/status > /dev/null
          dashboard_file="$RUNNER_TEMP/dashboard.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.cn/dashboard/ --output "$dashboard_file"
          if ! grep -qi '<!doctype html\|<html' "$dashboard_file"; then
            echo "::error::dashboard did not return HTML"
            exit 1
          fi
          settings_file="$RUNNER_TEMP/settings.html"
          curl --fail --silent --show-error --location --max-time 15 https://id-rc.undefineds.cn/settings/ --output "$settings_file"
          if ! grep -qi '<!doctype html\|<html' "$settings_file"; then
            echo "::error::settings did not return HTML"
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://api-rc.undefineds.cn/api/pod/settings/status)"
          if [ "$status" != "401" ]; then
            echo "::error::protected settings route must reject anonymous requests with 401"
            exit 1
          fi
          cat > "${RUNNER_TEMP}/public-checks.json" <<'JSON'
          {
            "service-status": "passed",
            "public-service": "passed",
            "oidc": "passed",
            "dashboard": "passed",
            "protected-route": "passed"
          }
          JSON

      - name: Authenticated pod smoke
        run: |
          set -euo pipefail
          bun scripts/prepare-rc-authenticated-smoke.ts \
            --base-url "$XPOD_SETTINGS_E2E_BASE_URL" \
            --seed-config "${RUNNER_TEMP}/xpod-rc-seed.json" \
            --output-env "${RUNNER_TEMP}/rc-authenticated-smoke.env" \
            --state-dir "${RUNNER_TEMP}/rc-authenticated-smoke-state"
          set -a
          . "${RUNNER_TEMP}/rc-authenticated-smoke.env"
          set +a
          set +e
          bun scripts/accept-xpod-settings.ts --allow-incomplete --output-dir "${RUNNER_TEMP}/acceptance"
          acceptance_status=$?
          set -e
          cat "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.md"
          if [ "$acceptance_status" -ne 0 ]; then
            exit "$acceptance_status"
          fi
          node scripts/assert-rc-authenticated-smoke.cjs "${RUNNER_TEMP}/acceptance/xpod-light-settings-acceptance.json"
          printf '%s\n' '{ "authenticated-pod": "passed" }' > "${RUNNER_TEMP}/authenticated-check.json"

      - name: Live Gateway login and Chat acceptance
        run: |
          set -euo pipefail
          if [ -z "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" ]; then
            echo "::error::XPOD_LIVE_PROVIDER_API_KEY_CONFIG secret is required for live Pod read/write, Gateway key, models, and chat acceptance"
            exit 1
          fi
          provider_file="${RUNNER_TEMP}/live-provider-api-key"
          printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$provider_file"
          chmod 600 "$provider_file"

          local_name="xpod-rc-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_name_file="${RUNNER_TEMP}/live-gateway-local-container-name"
          printf '%s\n' "$local_name" > "$local_name_file"

          docker run --detach --name "$local_name" \
            --publish 127.0.0.1::5737 \
            --env XPOD_EDITION=local \
            --env SOLID_OIDC_ISSUER=https://id-rc.undefineds.cn/ \
            --env CSS_ROOT_FILE_PATH=/app/data \
            --env CSS_IDENTITY_DB_URL=/app/data/identity.sqlite \
            --env DATABASE_URL=/app/data/identity.sqlite \
            --env CSS_SPARQL_ENDPOINT=/app/data/quadstore.sqlite \
            --env CSS_RDF_INDEX_PATH=/app/data/rdf-index.sqlite \
            "ghcr.io/undefinedsco/xpod@${{ needs.build_image.outputs.digest }}"

          host_port="$(docker port "$local_name" 5737/tcp | sed -E 's/.*:([0-9]+)$/\1/' | tail -1)"
          if [[ ! "$host_port" =~ ^[0-9]+$ ]]; then
            echo "::error::failed to resolve the temporary Local Xpod port"
            docker logs "$local_name" || true
            exit 1
          fi
          gateway="http://127.0.0.1:${host_port}/"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 2 "${gateway}service/status" > /dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$local_name" 2>/dev/null || true)" != "true" ]]; then
              echo "::error::temporary Local Xpod exited before Gateway became reachable"
              docker logs "$local_name" || true
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 "${gateway}service/status" > /dev/null

          XPOD_LIVE_PROVIDER_KEY_FILE="$provider_file" \
          XPOD_LIVE_TASK_APPROVAL=1 \
          XPOD_LIVE_GATEWAY_URL="$gateway" \
          XPOD_LIVE_CLOUD_IDP="https://id-rc.undefineds.cn/" \
          bun run ai-connections:accept:live

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidencePath = path.join(process.cwd(), '.test-data', 'acceptance', 'live-gateway-login-chat-local.json');
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const required = [
            ['pod-read-write', 'podReadWrite'],
            ['gateway-key', 'gatewayAuth'],
            ['ai-connections', 'aiConnections'],
            ['models', 'models'],
            ['chat', 'chat'],
            ['task-approval', 'taskApproval'],
          ];
          const checks = {};
          for (const [checkName, layerName] of required) {
            const layer = evidence.layers?.[layerName];
            if (layer?.ok !== true) {
              throw new Error(`${checkName} did not pass: ${layer?.detail || 'missing evidence'}`);
            }
            checks[checkName] = 'passed';
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'live-gateway-checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Create service acceptance evidence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const temp = process.env.RUNNER_TEMP;
          const checks = {
            ...JSON.parse(fs.readFileSync(path.join(temp, 'deployment-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'secret-isolation-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'public-checks.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'authenticated-check.json'), 'utf8')),
            ...JSON.parse(fs.readFileSync(path.join(temp, 'live-gateway-checks.json'), 'utf8')),
          };
          fs.writeFileSync(path.join(temp, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Upload service acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/checks.json
          if-no-files-found: error

      - &task_safe_evidence_projection
        name: Project safe Task approval evidence
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const input = path.join(process.cwd(), '.test-data', 'acceptance', 'live-gateway-login-chat-local.json');
          const diagnostic = Boolean(process.env.DIAGNOSTIC_RUNTIME_SOURCE_SHA);
          let task;
          try { task = JSON.parse(fs.readFileSync(input, 'utf8')).taskApproval; } catch {}
          if (!task || !Array.isArray(task.cases)) {
            console.log('::warning::Task approval evidence is missing or unreadable');
            if (!diagnostic) process.exit(0);
          }
          const booleanFields = ['ok', 'queuedAck', 'approvalPending', 'sessionPaused', 'sessionCompleted',
            'sameRun', 'markerMatches', 'markerAbsent', 'duplicateResume', 'stableAfterDuplicateOrStop'];
          const cases = (task?.cases ?? []).filter(row => row && ['approved', 'rejected', 'stopped'].includes(row.kind)).map(row => {
            const safe = { kind: row.kind };
            for (const field of booleanFields) if (typeof row[field] === 'boolean') safe[field] = row[field];
            if (['approved', 'rejected'].includes(row.decision)) safe.decision = row.decision;
            if (['completed', 'cancelled', 'failed'].includes(row.terminalStatus)) safe.terminalStatus = row.terminalStatus;
            if (row.acceptancePhase !== undefined) {
              if (typeof row.acceptancePhase !== 'string' || !new RegExp(`^${row.kind}:(prepare|queued|checkpoint|decision|terminal|duplicate)$`).test(row.acceptancePhase)) throw new Error('Invalid safe Task phase');
              safe.acceptancePhase = row.acceptancePhase;
            }
            if (row.failureDetails !== undefined) {
              const details = row.failureDetails;
              const substages = ['queued-request', 'queued-assert', 'checkpoint-run-read', 'checkpoint-approval-read',
                'checkpoint-match', 'checkpoint-session-read', 'checkpoint-session-assert', 'checkpoint-marker-read',
                'checkpoint-marker-assert', 'decision-request', 'decision-assert', 'decision-persisted-read',
                'decision-persisted-assert', 'decision-resume-request', 'decision-resume-assert', 'other'];
              const names = ['LiveTaskEvidenceError', 'Error', 'TypeError', 'SyntaxError', 'AbortError', 'TimeoutError', 'DOMException', 'other'];
              const codes = ['ENOSPC', 'ECONNREFUSED', 'ECONNRESET', 'ETIMEDOUT', 'ENOTFOUND', 'EACCES', 'ERR_INVALID_URL'];
              if (!details || typeof details !== 'object' || Array.isArray(details)
                || !substages.includes(details.substage) || !['assertion', 'timeout', 'connection', 'parse', 'other'].includes(details.category)
                || !names.includes(details.name) || ['code', 'causeCode'].some(field => details[field] !== undefined && !codes.includes(details[field]))) throw new Error('Invalid safe Task failure details');
              const taskErrors = ['authentication_required', 'pod_owner_mismatch', 'service_access_missing', 'resource_id_required', 'approval_required', 'run_not_found', 'approval_not_authorized', 'approval_checkpoint_mismatch', 'approval_expired', 'run_checkpoint_mismatch', 'task_not_found', 'agent_execution_credential_unavailable', 'ai_connection_invocation_issuer_required', 'run_conditional_auth_required', 'run_strong_etag_required', 'run_turtle_document_required', 'run_persisted_status_invalid', 'run_persisted_timestamp_invalid', 'run_conditional_update_conflict', 'continuation_claim_required', 'continuation_release_required', 'run_workspace_required', 'approval_session_storage_unavailable', 'run_document_read_failed', 'run_document_update_failed', 'other_error'];
              if (['httpStatus', 'runDocumentHttpStatus'].some(field => details[field] !== undefined && (!Number.isInteger(details[field]) || details[field] < 100 || details[field] > 599))
                || details.taskError !== undefined && !taskErrors.includes(details.taskError)
                || details.errorEnvelope !== undefined && !['error_string', 'json_other', 'non_json', 'oversized', 'unreadable'].includes(details.errorEnvelope)
                || details.taskResumeStage !== undefined && !['route_request', 'route_validation', 'route_run_read', 'run_read', 'approval_validation', 'checkpoint_validation', 'task_lookup', 'task_auth_restore', 'invocation_issue', 'continuation_prepare', 'continuation_complete', 'continuation_release', 'run_result_read'].includes(details.taskResumeStage)
                || details.taskResumeErrorType !== undefined && !['error', 'type_error', 'range_error', 'syntax_error', 'non_error'].includes(details.taskResumeErrorType)) throw new Error('Invalid safe Task failure details');
              let taskResumeFailure;
              if (details.taskResumeFailure !== undefined) {
                const failure = details.taskResumeFailure;
                const failureNames = ['Error', 'TypeError', 'RangeError', 'SyntaxError', 'ReferenceError', 'EvalError', 'URIError', 'AggregateError'];
                const modules = ['api/runs/RunStateCenter', 'api/runs/InngestRunExecutionBackend', 'api/runs/ConditionalResourceDocument',
                  'api/runs/RunApproval', 'api/runs/RunCancellation', 'api/runs/ManagedRunWorker', 'api/runs/store',
                  'api/chatkit/pod-store', 'api/tasks/TaskMaterializer', 'api/tasks/TaskService', 'api/handlers/TaskHandler'];
                const record = value => value && typeof value === 'object' && !Array.isArray(value);
                if (!record(failure) || !failureNames.includes(failure.name)
                  || Object.keys(failure).some(key => !['name', 'code', 'causeCode', 'site'].includes(key))
                  || ['code', 'causeCode'].some(key => Object.hasOwn(failure, key) && !codes.includes(failure[key]))) throw new Error('Invalid safe Task failure details');
                taskResumeFailure = { name: failure.name };
                for (const key of ['code', 'causeCode']) if (failure[key] !== undefined) taskResumeFailure[key] = failure[key];
                if (Object.hasOwn(failure, 'site')) {
                  const site = failure.site;
                  if (!record(site) || Object.keys(site).some(key => !['module', 'line', 'column', 'coordinate', 'kind'].includes(key))
                    || !modules.includes(site.module) || site.kind !== 'first_project_frame'
                    || !['compiled_js', 'source_ts'].includes(site.coordinate)
                    || ['line', 'column'].some(key => !Number.isSafeInteger(site[key]) || site[key] <= 0 || site[key] > 1000000)) throw new Error('Invalid safe Task failure details');
                  taskResumeFailure.site = { module: site.module, line: site.line, column: site.column, coordinate: site.coordinate, kind: site.kind };
                }
              }
              safe.failureDetails = { substage: details.substage, category: details.category, name: details.name };
              if (taskResumeFailure) safe.failureDetails.taskResumeFailure = taskResumeFailure;
              for (const field of ['code', 'causeCode', 'httpStatus', 'runDocumentHttpStatus', 'taskError', 'errorEnvelope', 'taskResumeStage', 'taskResumeErrorType']) if (details[field] !== undefined) safe.failureDetails[field] = details[field];
            }
            const snapshot = row.terminalSnapshot;
            if (snapshot !== undefined) {
              if (!snapshot || typeof snapshot !== 'object' || Array.isArray(snapshot)
                || !['completed', 'cancelled', 'failed'].includes(snapshot.status) || typeof snapshot.errorPresent !== 'boolean'
                || !['pi_assistant_error', 'pi_assistant_aborted', 'other_error', 'none'].includes(snapshot.errorClassification)
                || snapshot.modelRequest !== 'unobserved' || typeof snapshot.steps?.available !== 'boolean') throw new Error('Invalid safe Task terminal snapshot');
              const steps = { available: snapshot.steps.available };
              if (snapshot.steps.approvalTool !== undefined) {
                if (typeof snapshot.steps.approvalTool !== 'boolean') throw new Error('Invalid safe approval-tool flag');
                steps.approvalTool = snapshot.steps.approvalTool;
              }
              if (snapshot.steps.counts !== undefined) {
                const { RunStepType } = require('@undefineds.co/models');
                const allowed = new Set(Object.values(RunStepType));
                steps.counts = {};
                for (const [type, count] of Object.entries(snapshot.steps.counts)) {
                  if (!allowed.has(type) || !Number.isSafeInteger(count) || count < 0) throw new Error('Invalid safe Task step count');
                  steps.counts[type] = count;
                }
              }
              safe.terminalSnapshot = { status: snapshot.status, errorPresent: snapshot.errorPresent,
                errorClassification: snapshot.errorClassification, modelRequest: snapshot.modelRequest, steps };
            }
            const failure = row.producerFailure;
            const errorClasses = ['none', 'unknown', 'auth_required', 'service_access_missing', 'token_exchange_failed',
              'provider_error', 'provider_aborted', 'sandbox_unavailable', 'worker_start_failed', 'worker_exited', 'execution_state_error'];
            if (failure && ['failed', 'cancelled', 'completed'].includes(failure.status)
                && typeof failure.errorPresent === 'boolean' && errorClasses.includes(failure.errorClass)
                && Number.isSafeInteger(failure.errorLength) && failure.errorLength >= 0 && failure.errorLength <= 1000000) {
              safe.producerFailure = { status: failure.status, errorPresent: failure.errorPresent,
                errorLength: failure.errorLength, errorClass: failure.errorClass };
              if (Number.isInteger(failure.httpStatus) && failure.httpStatus >= 400 && failure.httpStatus <= 599) {
                safe.producerFailure.httpStatus = failure.httpStatus;
              }
              // Allowlisted runner classification tokens only; never the provider body.
              for (const field of ['providerClass', 'providerApi', 'providerName', 'providerModel']) {
                if (typeof failure[field] === 'string' && /^[A-Za-z0-9_.:\-]{1,64}$/.test(failure[field])) {
                  safe.producerFailure[field] = failure[field];
                }
              }
            }
            return safe;
          });
          const cleanup = {};
          for (const field of ['ok', 'grantRevoked']) {
            if (typeof task?.cleanup?.[field] === 'boolean') cleanup[field] = task.cleanup[field];
          }
          for (const field of ['tasksPaused', 'runsStopped', 'sessionsTerminal']) {
            const value = task?.cleanup?.[field];
            if (Number.isSafeInteger(value) && value >= 0) cleanup[field] = value;
          }
          const evidence = {
            schemaVersion: 1, sourceSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ok: task?.ok === true, failurePresent: Boolean(task?.failure), cases, cleanup,
          };
          if (diagnostic) Object.assign(evidence, { purpose: 'task-runtime-diagnostic', accepted: false,
            diagnosticSourceSha: process.env.GITHUB_SHA, runtimeSourceSha: process.env.DIAGNOSTIC_RUNTIME_SOURCE_SHA,
            evidencePresent: Boolean(task) });
          const output = diagnostic ? path.join(process.env.RUNNER_TEMP, 'task-diagnostic-safe') : process.env.RUNNER_TEMP;
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'task-approval-evidence.json'), `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload safe Task approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-approval-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-approval-evidence.json
          if-no-files-found: warn

      - &task_model_failure_diagnostics
        name: Project safe Task model failure evidence
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/task-model-diagnostic-safe"
          raw_log="${RUNNER_TEMP}/task-model-diagnostic.private.log"
          trap 'rm -f "$raw_log"' EXIT
          local_name="xpod-rc-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          name_file="${RUNNER_TEMP}/live-gateway-local-container-name"
          if [ -n "${DIAGNOSTIC_RUNTIME_SOURCE_SHA:-}" ]; then
            local_name="xpod-task-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            name_file="${RUNNER_TEMP}/task-diagnostic-container-name"
          fi
          if [ -f "$name_file" ] && [ "$(cat "$name_file")" = "$local_name" ]; then
            docker logs --timestamps "$local_name" > "$raw_log" 2>&1 || true
          fi
          bun scripts/helpers/project-task-model-diagnostics.ts "$raw_log" \
            "${RUNNER_TEMP}/task-model-diagnostic-safe/task-model-failure-evidence.json"

      - &task_model_failure_diagnostics_upload
        name: Upload safe Task model failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-model-failure-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-model-diagnostic-safe/
          if-no-files-found: error
          retention-days: 14

      - name: Dump diagnostics
        if: ${{ failure() && steps.rc_kubeconfig.outcome == 'success' }}
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get deploy,rs,pods,svc -o wide || true
          kubectl -n "$SEALOS_NAMESPACE" describe deployment xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe statefulset xpod-rdf-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rc || true
          kubectl -n "$SEALOS_NAMESPACE" describe pods -l app=xpod-rdf-postgres || true
          kubectl -n "$SEALOS_NAMESPACE" get events --sort-by='.lastTimestamp' | tail -n 200 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rc --all-containers=true --tail=200 --prefix=true --max-log-requests=10 --previous || true
          kubectl -n "$SEALOS_NAMESPACE" logs -l app=xpod-rdf-postgres --all-containers=true --tail=200 --prefix=true --max-log-requests=10 || true
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker inspect "$local_name" || true
              docker logs "$local_name" || true
            fi
          fi

      - name: Cleanup temporary Local Xpod
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/live-gateway-local-container-name" ]; then
            local_name="$(cat "${RUNNER_TEMP}/live-gateway-local-container-name")"
            if [ -n "$local_name" ]; then
              docker rm --force "$local_name" >/dev/null 2>&1 || true
            fi
          fi

  build_desktop_rc:
    name: Build macOS RC desktop
    needs: [metadata, build_qlever_macos_runtime, deploy_and_accept]
    runs-on: macos-15
    environment: rc
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT: ${{ github.workspace }}/.test-data/qlever-runtime/qlever-local-runtime-darwin-arm64.tar.gz
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
      XPOD_AI_PROXY_URL: ${{ secrets.XPOD_AI_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_qlever_macos_runtime.outputs.artifact_name }}
          path: ${{ github.workspace }}/.test-data/qlever-runtime
      - run: bun install --frozen-lockfile
      # Bun skips Electron's postinstall; bootstrap its binary for desktop tests
      # and packaging on clean runners.
      - name: Bootstrap the Electron vendor binary
        run: node node_modules/electron/install.js
      - name: Apply and verify the candidate version
        run: |
          node scripts/release-candidate.cjs \
            --branch "$REF_NAME" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ needs.metadata.outputs.runAttempt }}" \
            --sha "${{ github.sha }}" \
            --apply-root-version
          node -e 'if (require("./desktop/package.json").version !== process.env.CANDIDATE_VERSION) process.exit(1)'
      # desktop/test/** is excluded from the root vitest and Bun test runs, so without this the
      # brand provenance, Dock and updater suites never execute in CI. The desktop `test` script
      # builds first (`bun run build`), so this also type checks the desktop sources.
      - name: Run the desktop unit test suite
        working-directory: desktop
        run: bun run test
      - name: Build desktop with the accepted native runtime
        working-directory: desktop
        env:
          # Raises the anonymous api.github.com rate limit for the native-source docs tree read.
          GH_TOKEN: ${{ github.token }}
        run: bun run dist
      # The Account document links `/app/assets/main.css` by name. A build that
      # emits the stylesheet under another name (or not at all) ships a login page
      # with no styles, which already happened once in production.
      - name: Verify the Account document's assets were built
        run: |
          set -euo pipefail
          test -s static/app/auth.html
          grep -oE '/app/assets/[A-Za-z0-9._-]+' static/app/auth.html | sort -u | while read -r asset; do
            if [[ ! -s "static${asset}" ]]; then
              echo "::error::static${asset} is referenced by static/app/auth.html but was not built"
              exit 1
            fi
          done
          echo "Account document assets verified"
      - name: Verify root npm package boundary
        env:
          XPOD_INCLUDE_PLATFORM_PACKAGES: 'true'
        run: |
          set -euo pipefail
          node scripts/run-npm-pack.cjs .test-data/npm-preflight .test-data/npm-preflight-cache
          node scripts/check-pack-json.cjs .test-data/npm-preflight/pack.json
      - name: Verify shared applet tarballs in a clean Bun consumer
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/workspace-package-consumer.cjs --local \
            --source-sha "$SOURCE_SHA" \
            --archive-dir "${RUNNER_TEMP}/package-consumer-archive/workspace" \
            --evidence "${RUNNER_TEMP}/workspace-consumer-evidence.json"
      - name: Verify packed Node and Bun consumers before publication
        run: |
          set -euo pipefail
          node scripts/check-package-registry-consumer.cjs .test-data/npm-preflight/pack.json "${RUNNER_TEMP}/xpod-packed-node" .test-data/npm-consumer-cache
          node scripts/check-package-registry-consumer.cjs .test-data/npm-preflight/pack.json "${RUNNER_TEMP}/xpod-packed-bun" .test-data/bun-consumer-cache bun
      # Binds the gate to the exact packed root tarball the Node/Bun consumers
      # installed and to the workspace applet tarballs for this source SHA. This
      # is a package/consumer check only; the bundled native runtime is proven by
      # the separate qlever-local gate.
      - name: Bind the package-consumers acceptance evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.cjs create-package-consumers \
            --source-sha "$SOURCE_SHA" \
            --pack-json .test-data/npm-preflight/pack.json \
            --node-result "${RUNNER_TEMP}/xpod-packed-node/result.json" \
            --bun-result "${RUNNER_TEMP}/xpod-packed-bun/result.json" \
            --workspace-evidence "${RUNNER_TEMP}/workspace-consumer-evidence.json" \
            --archive-dir "${RUNNER_TEMP}/package-consumer-archive" \
            --out "${RUNNER_TEMP}/package-consumer-evidence.json"
      - name: Upload package-consumers acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-consumer-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/package-consumer-evidence.json
            ${{ runner.temp }}/package-consumer-archive
          if-no-files-found: error
          retention-days: 30
      - name: Save root package boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-boundary-${{ github.sha }}
          path: .test-data/npm-preflight/pack.json
          if-no-files-found: ignore
      - name: Save measured native package publication budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-native-package-budget-${{ github.sha }}
          path: |
            desktop/runtime-pack-budget.json
            desktop/runtime-pack.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify desktop version and native runtime payload
        run: |
          set -euo pipefail
          app="desktop/release/mac-arm64/Xpod.app"
          runtime="$app/Contents/Resources/runtime/qlever/bin/xpod_qlever_local_runtime"
          [[ "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" == "$CANDIDATE_VERSION" ]]
          test -x "$runtime"
          test -s "$app/Contents/Resources/runtime/qlever/manifest.json"
      # The desktop updates itself by verifying the downloaded bundle, so the
      # archive must ship a valid ad-hoc signature (after-pack hook) rather than
      # the linker's unsealed one.

      - name: Download the previously released desktop bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/xpod-old-desktop"
          mkdir -p "$dest"
          # The acceptance proves a *released* build upgrades to this candidate, and
          # the verifier rejects evidence unless oldVersion < newVersion. Taking the
          # newest stable release unconditionally breaks that contract once a stable
          # newer than the candidate exists: the released app is then asked to
          # "upgrade" to an older version, the updater refuses, no update is offered
          # and the packaged app never exits -- so the baseline is resolved by
          # version order (`scripts/select-desktop-update-baseline.cjs`).
          gh release list --repo "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName,publishedAt,isDraft > "$dest/releases.json"
          old_tag="$(node scripts/select-desktop-update-baseline.cjs \
            --candidate "$CANDIDATE_VERSION" \
            --releases "$dest/releases.json")"
          gh release download "$old_tag" --repo "${{ github.repository }}" \
            --pattern '*-arm64-mac.zip' --dir "$dest" --clobber
          old_zip="$(find "$dest" -maxdepth 1 -type f -name '*-arm64-mac.zip' -print -quit)"
          if [ -z "$old_zip" ]; then
            echo "::error::$old_tag does not publish an arm64 desktop zip"
            exit 1
          fi
          unzip -q "$old_zip" -d "$dest/unpacked"
          old_app="$(find "$dest/unpacked" -type d -name 'Xpod.app' -print -quit)"
          if [ -z "$old_app" ]; then
            echo "::error::$old_zip does not contain Xpod.app"
            exit 1
          fi
          echo "XPOD_OLD_DESKTOP_TAG=$old_tag" >> "$GITHUB_ENV"
          printf 'baseline tag: %s\nbaseline app: %s\n' "$old_tag" "$old_app"

      # The doc-mandated desktop gate: launch the released build, let it detect,
      # download, checksum-verify, swap the bundle and relaunch as this exact
      # candidate, then bind the run to the source SHA and both archives.
      - name: Accept the real desktop self-update (released -> candidate)
        run: |
          set -euo pipefail
          old_app="$(find "${RUNNER_TEMP}/xpod-old-desktop/unpacked" -type d -name 'Xpod.app' -print -quit)"
          old_zip="$(find "${RUNNER_TEMP}/xpod-old-desktop" -maxdepth 1 -type f -name '*-arm64-mac.zip' -print -quit)"
          new_zip="$(find "$PWD/desktop/release" -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          if [ -z "$old_app" ] || [ -z "$old_zip" ]; then
            echo "::error::the released desktop baseline is missing"
            exit 1
          fi
          if [ -z "$new_zip" ]; then
            echo "::error::candidate desktop zip is missing"
            exit 1
          fi
          evidence="${RUNNER_TEMP}/desktop-self-update-evidence.json"
          node desktop/scripts/packaged-update-acceptance.mjs \
            --old "$old_app" \
            --old-zip "$old_zip" \
            --old-release-tag "$XPOD_OLD_DESKTOP_TAG" \
            --new-zip "$new_zip" \
            --version "$CANDIDATE_VERSION" \
            --source-sha "${{ github.sha }}" \
            --timeout 180000 \
            --evidence-out "$evidence"
          node scripts/desktop-self-update-acceptance.cjs verify \
            --evidence "$evidence" \
            --source-sha "${{ github.sha }}" \
            --new-version "$CANDIDATE_VERSION"

      - name: Upload desktop self-update acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-self-update-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-self-update-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Accept actual packaged desktop permissions and operations
        run: |
          set -euo pipefail
          test -n "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG"
          provider_file="${RUNNER_TEMP}/desktop-provider-api-key"
          printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$provider_file"
          chmod 600 "$provider_file"
          new_zip="$(find "$PWD/desktop/release" -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          test -n "$new_zip"
          bun scripts/accept-packaged-desktop-permissions.ts \
            --archive "$new_zip" \
            --version "$CANDIDATE_VERSION" \
            --source-sha "${{ github.sha }}" \
            --issuer "https://id-rc.undefineds.cn/" \
            --key-file "$provider_file" \
            --private-directory "${RUNNER_TEMP}/desktop-permission-private" \
            --evidence "${RUNNER_TEMP}/desktop-permission-evidence.json"
          node scripts/desktop-permission-acceptance.cjs \
            --evidence "${RUNNER_TEMP}/desktop-permission-evidence.json" \
            --source-sha "${{ github.sha }}" \
            --version "$CANDIDATE_VERSION" \
            --expected-archive "$new_zip"

      - name: Upload allowlisted desktop permission evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-permission-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-permission-evidence.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: xpod-desktop-macos-${{ needs.metadata.outputs.candidate }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      # Keep the redacted producer failure summary last so the release archive
      # stays the first upload in this job and no gate reads it as the artifact.
      - name: Upload desktop permission failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-permission-failure-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-permission-private/failure-safe.json
          if-no-files-found: ignore
          retention-days: 30

  finalize_acceptance:
    name: Finalize RC acceptance
    needs:
      - metadata
      - build_image
      - deploy_and_accept
      - build_desktop_rc
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: read
    env:
      CANDIDATE_VERSION: ${{ needs.metadata.outputs.candidate }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - uses: actions/download-artifact@v4
        with:
          name: release-service-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/service-acceptance
      - uses: actions/download-artifact@v4
        with:
          name: desktop-self-update-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-self-update
      - uses: actions/download-artifact@v4
        with:
          name: desktop-permission-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-permissions
      - uses: actions/download-artifact@v4
        with:
          name: xpod-desktop-macos-${{ needs.metadata.outputs.candidate }}
          path: ${{ runner.temp }}/xpod-desktop-candidate
      # The `desktop` check is only accepted from the source-bound evidence the
      # macOS job produced AND must byte-match the uploaded candidate archive;
      # bundle presence alone never sets it.
      - name: Verify the combined mandatory desktop acceptance evidence
        run: |
          set -euo pipefail
          candidate_zip="$(find "${{ runner.temp }}/xpod-desktop-candidate" -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          if [ -z "$candidate_zip" ]; then
            echo "::error::uploaded candidate desktop zip is missing"
            exit 1
          fi
          node scripts/desktop-acceptance.cjs \
            --self-update-evidence "${{ runner.temp }}/desktop-self-update/desktop-self-update-evidence.json" \
            --permission-evidence "${{ runner.temp }}/desktop-permissions/desktop-permission-evidence.json" \
            --source-sha "${{ github.sha }}" \
            --version "$CANDIDATE_VERSION" \
            --expected-archive "$candidate_zip" \
            --checks-out "${{ runner.temp }}/desktop-check.json"
      # `qlever-local` and `package-consumers` are only accepted from the
      # source/artifact-bound evidence the producing jobs uploaded AND must
      # byte-match the artifacts downloaded here; a missing or mismatched
      # artifact fails the job before any check is written.
      - name: Download the accepted qlever-local runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: qlever-local-runtime-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/qlever-local-runtime
      - name: Download the package-consumers acceptance artifact
        uses: actions/download-artifact@v4
        with:
          name: package-consumer-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/package-consumer
      - name: Verify the qlever-local acceptance evidence
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.cjs verify-qlever-local \
            --evidence "${{ runner.temp }}/qlever-local-runtime/qlever-local-acceptance.json" \
            --source-sha "${{ github.sha }}" \
            --expected-archive "${{ runner.temp }}/qlever-local-runtime/qlever-local-runtime-darwin-arm64.tar.gz" \
            --checks-out "${{ runner.temp }}/qlever-local-check.json"
      - name: Verify the package-consumers acceptance evidence
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.cjs verify-package-consumers \
            --evidence "${{ runner.temp }}/package-consumer/package-consumer-evidence.json" \
            --source-sha "${{ github.sha }}" \
            --archive-dir "${{ runner.temp }}/package-consumer" \
            --checks-out "${{ runner.temp }}/package-consumer-check.json"
      - name: Create the unified acceptance manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const checksPath = path.join(process.env.RUNNER_TEMP, 'service-acceptance', 'checks.json');
          const desktopChecks = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'desktop-check.json'), 'utf8'));
          if (desktopChecks.desktop !== 'passed') {
            throw new Error('combined desktop acceptance did not verify');
          }
          const qleverChecks = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'qlever-local-check.json'), 'utf8'));
          if (qleverChecks['qlever-local'] !== 'passed') {
            throw new Error('qlever-local acceptance did not verify');
          }
          const packageConsumerChecks = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'package-consumer-check.json'), 'utf8'));
          if (packageConsumerChecks['package-consumers'] !== 'passed') {
            throw new Error('package-consumers acceptance did not verify');
          }
          const checks = {
            ...JSON.parse(fs.readFileSync(checksPath, 'utf8')),
            'qlever-local': qleverChecks['qlever-local'],
            'desktop': desktopChecks.desktop,
            'package-consumers': packageConsumerChecks['package-consumers'],
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'checks.json'), `${JSON.stringify(checks, null, 2)}\n`);
          NODE
          node scripts/release-acceptance-manifest.cjs create \
            --target-version "${{ needs.metadata.outputs.target }}" \
            --candidate-version "$CANDIDATE_VERSION" \
            --source-sha "${{ needs.metadata.outputs.sourceSha }}" \
            --source-branch "$REF_NAME" \
            --image-digest "${{ needs.build_image.outputs.digest }}" \
            --endpoint "https://id-rc.undefineds.cn" \
            --accepted-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --checks-file "${RUNNER_TEMP}/checks.json" > "${RUNNER_TEMP}/release-acceptance.json"
      - name: Upload the only stable-promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/release-acceptance.json
          if-no-files-found: error

  task_runtime_diagnostic:
    name: Task runtime diagnostic (not release acceptance)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task_diagnostic_only == true }}
    runs-on: ubuntu-latest
    environment: rc
    permissions:
      contents: read
      packages: read
    env:
      # Build the checked-out server locally; reuse unchanged, independently published native input.
      DIAGNOSTIC_RUNTIME_SOURCE_SHA: ${{ github.sha }}
      DIAGNOSTIC_NATIVE_SOURCE_SHA: 35dce6f1fc5f69b189b695d5321d68e9c0df9331
      DIAGNOSTIC_IMAGE: xpod-task-diagnostic:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Restrict diagnostic branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/staging) ;;
            *) echo '::error::Task diagnostic is restricted to staging'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Check the existing RC identity service without credentials
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/task-diagnostic-safe"
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.cn/service/status > /dev/null
          curl --fail --silent --show-error --max-time 15 https://id-rc.undefineds.cn/.well-known/openid-configuration > "${RUNNER_TEMP}/task-diagnostic-oidc.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const discovery = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'task-diagnostic-oidc.json'), 'utf8'));
          if (new URL(discovery.issuer).origin !== 'https://id-rc.undefineds.cn') throw new Error('RC identity issuer mismatch');
          NODE

      - name: Set up Docker Buildx for local diagnostics
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR to read the existing native runtime
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the unchanged published native input
        id: native
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DIAGNOSTIC_NATIVE_SOURCE_SHA"
          git diff --quiet "$DIAGNOSTIC_NATIVE_SOURCE_SHA" HEAD -- \
            qlever docker/qlever-local-runtime docker/qlever-runtime-sdk Dockerfile
          native_tag="ghcr.io/undefinedsco/xpod-qlever-local-runtime:sha-${DIAGNOSTIC_NATIVE_SOURCE_SHA}"
          native_digest="$(docker buildx imagetools inspect "$native_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! printf '%s' "$native_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo '::error::Invalid immutable native input digest'; exit 1
          fi
          native_image="ghcr.io/undefinedsco/xpod-qlever-local-runtime@${native_digest}"
          docker pull "$native_image"
          docker image inspect --format '{"imageId":"{{.Id}}","sourceSha":"{{index .Config.Labels "org.opencontainers.image.revision"}}"}' \
            "$native_image" > "${RUNNER_TEMP}/task-diagnostic-native-input.json"
          printf 'image=%s\n' "$native_image" >> "$GITHUB_OUTPUT"

      - name: Build current source only for local Task diagnostics
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.DIAGNOSTIC_IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ steps.native.outputs.image }}

      - name: Bind the locally built diagnostic runtime and native input
        env:
          DIAGNOSTIC_NATIVE_IMAGE: ${{ steps.native.outputs.image }}
        run: |
          set -euo pipefail
          docker image inspect --format '{"imageId":"{{.Id}}","sourceSha":"{{index .Config.Labels "org.opencontainers.image.revision"}}"}' \
            "$DIAGNOSTIC_IMAGE" > "${RUNNER_TEMP}/task-diagnostic-runtime-input.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const load = name => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), 'utf8'));
          const runtime = load('task-diagnostic-runtime-input.json');
          const native = load('task-diagnostic-native-input.json');
          if (runtime.sourceSha !== process.env.GITHUB_SHA || native.sourceSha !== process.env.DIAGNOSTIC_NATIVE_SOURCE_SHA
            || !/^sha256:[a-f0-9]{64}$/.test(runtime.imageId) || !/^sha256:[a-f0-9]{64}$/.test(native.imageId)
            || !/^ghcr\.io\/undefinedsco\/xpod-qlever-local-runtime@sha256:[a-f0-9]{64}$/.test(process.env.DIAGNOSTIC_NATIVE_IMAGE)) {
            throw new Error('Task diagnostic source/native binding mismatch');
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'task-diagnostic-safe', 'runtime-binding.json'), JSON.stringify({
            schemaVersion: 1, purpose: 'task-runtime-diagnostic', accepted: false,
            diagnosticSourceSha: process.env.GITHUB_SHA, runtimeSourceSha: runtime.sourceSha,
            image: process.env.DIAGNOSTIC_IMAGE, runtimeImageId: runtime.imageId,
            nativeSourceSha: native.sourceSha, nativeImage: process.env.DIAGNOSTIC_NATIVE_IMAGE, nativeImageId: native.imageId,
            nativeSdkRebuilt: false, nativeInputUnchanged: true, identityOrigin: 'https://id-rc.undefineds.cn',
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          }, null, 2) + '\n');
          NODE

      - run: bun install --frozen-lockfile

      - name: Run unchanged real live Task acceptance against current source
        env:
          XPOD_LIVE_PROVIDER_API_KEY_CONFIG: ${{ secrets.XPOD_LIVE_PROVIDER_API_KEY_CONFIG }}
          XPOD_AI_PROXY_URL: ${{ secrets.XPOD_AI_PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -z "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" ]; then
            echo '::error::RC live provider configuration is required'
            exit 1
          fi
          provider_file="${RUNNER_TEMP}/task-diagnostic-provider-config"
          printf '%s\n' "$XPOD_LIVE_PROVIDER_API_KEY_CONFIG" > "$provider_file"
          chmod 600 "$provider_file"
          local_name="xpod-task-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$local_name" > "${RUNNER_TEMP}/task-diagnostic-container-name"
          docker run --detach --name "$local_name" \
            --publish 127.0.0.1::5737 \
            --env XPOD_EDITION=local \
            --env SOLID_OIDC_ISSUER=https://id-rc.undefineds.cn/ \
            --env CSS_ROOT_FILE_PATH=/app/data \
            --env CSS_IDENTITY_DB_URL=/app/data/identity.sqlite \
            --env DATABASE_URL=/app/data/identity.sqlite \
            --env CSS_SPARQL_ENDPOINT=/app/data/quadstore.sqlite \
            --env CSS_RDF_INDEX_PATH=/app/data/rdf-index.sqlite \
            "$DIAGNOSTIC_IMAGE"
          host_port="$(docker port "$local_name" 5737/tcp | sed -E 's/.*:([0-9]+)$/\1/' | tail -1)"
          if [[ ! "$host_port" =~ ^[0-9]+$ ]]; then
            echo '::error::failed to resolve the owned Local Xpod port'
            exit 1
          fi
          gateway="http://127.0.0.1:${host_port}/"
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 2 "${gateway}service/status" > /dev/null; then break; fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$local_name" 2>/dev/null || true)" != true ]]; then
              echo '::error::owned Local Xpod exited before Gateway readiness'
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 "${gateway}service/status" > /dev/null
          XPOD_LIVE_PROVIDER_KEY_FILE="$provider_file" \
          XPOD_LIVE_TASK_APPROVAL=1 \
          XPOD_LIVE_GATEWAY_URL="$gateway" \
          XPOD_LIVE_CLOUD_IDP=https://id-rc.undefineds.cn/ \
          bun run ai-connections:accept:live

      # Reuse the same strict allowlist projection as normal candidate failure evidence.
      - *task_safe_evidence_projection
      - *task_model_failure_diagnostics
      - *task_model_failure_diagnostics_upload

      - name: Save controlled diagnostics from only the owned Local container
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/task-diagnostic-safe"
          local_name="xpod-task-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "${RUNNER_TEMP}/task-diagnostic-container-name" ] && [ "$(cat "${RUNNER_TEMP}/task-diagnostic-container-name")" = "$local_name" ]; then
            docker inspect --format '{{json .State}}' "$local_name" > "${RUNNER_TEMP}/task-diagnostic-state.private.json" 2>/dev/null || true
            docker logs --timestamps "$local_name" > "${RUNNER_TEMP}/task-diagnostic-docker.private.log" 2>&1 || true
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = name => { try { return fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), 'utf8'); } catch { return ''; } };
          let state;
          try { state = JSON.parse(read('task-diagnostic-state.private.json')); } catch {}
          const logs = read('task-diagnostic-docker.private.log');
          const fixed = ['Pi assistant ended with error', 'Pi assistant ended with aborted',
            'ECONNREFUSED', 'ENOTFOUND', 'EAI_AGAIN', 'ETIMEDOUT', 'ECONNRESET'];
          const statuses = {};
          const unattributedModelHttpCompletions = [];
          for (const line of logs.split('\n')) {
            if (line.match(/\[([A-Za-z][A-Za-z0-9]*)\]/)?.[1] !== 'TracingHandler') continue;
            const match = line.match(/\[TracingHandler\]\s+\{Primary\}\s+(?:info|warn):\s+(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(.+?)\s+->\s+([1-5]\d\d)\s+\((\d+)ms\)/);
            if (!match) continue;
            statuses[match[3]] = (statuses[match[3]] ?? 0) + 1;
            const route = match[2].split('?')[0];
            const knownPath = ['/v1/chat/completions', '/v1/messages', '/v1/models', '/v1/meta'].find(value => route.endsWith(value));
            if (knownPath) unattributedModelHttpCompletions.push({ method: match[1], path: knownPath, status: Number(match[3]), durationMs: Number(match[4]) });
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'task-diagnostic-safe', 'docker-diagnostics.json'), JSON.stringify({
            schemaVersion: 1, purpose: 'task-runtime-diagnostic', accepted: false, logsPresent: Boolean(logs),
            statePresent: Boolean(state), running: state?.Running === true, oomKilled: state?.OOMKilled === true,
            exitCode: Number.isSafeInteger(state?.ExitCode) ? state.ExitCode : null,
            unattributedFixedLiteralOccurrences: fixed.filter(value => logs.includes(value)), httpStatusCounts: statuses, unattributedModelHttpCompletions,
            attribution: 'Uncorrelated log literals and HTTP completions; may include ordinary Chat or unrelated requests, never proof of Task upstream traffic',
            upstreamStreamingEvidence: 'unobserved unless explicitly captured by an existing safe logger',
          }, null, 2) + '\n');
          NODE

      - name: Cleanup only the owned diagnostic container and private files
        if: always()
        run: |
          set -euo pipefail
          cleanup_private_files() {
            rm -f "${RUNNER_TEMP}/task-diagnostic-container-name" "${RUNNER_TEMP}/task-diagnostic-provider-config" \
              "${RUNNER_TEMP}/task-diagnostic-oidc.json" "${RUNNER_TEMP}/task-diagnostic-state.private.json" \
              "${RUNNER_TEMP}/task-diagnostic-docker.private.log"
          }
          trap cleanup_private_files EXIT
          local_name="xpod-task-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "${RUNNER_TEMP}/task-diagnostic-container-name" ]; then
            if [ "$(cat "${RUNNER_TEMP}/task-diagnostic-container-name")" != "$local_name" ]; then
              echo '::error::Diagnostic container ownership marker mismatch'; exit 1
            fi
            docker rm --force "$local_name" >/dev/null 2>&1 || true
          fi
          docker info >/dev/null 2>&1
          remaining="$(docker ps --all --filter "name=^/${local_name}$" --format '{{.Names}}')"
          if [ -n "$remaining" ]; then
            echo '::error::Owned diagnostic container remains after cleanup'; exit 1
          fi
          cleanup_private_files
          mkdir -p "${RUNNER_TEMP}/task-diagnostic-safe"
          printf '%s\n' '{"schemaVersion":1,"purpose":"task-runtime-diagnostic","accepted":false,"ownedContainerAbsent":true,"privateFilesRemoved":true}' \
            > "${RUNNER_TEMP}/task-diagnostic-safe/cleanup.json"

      - name: Upload diagnostic evidence (never stable-promotion evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-runtime-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-diagnostic-safe/
          if-no-files-found: error
          retention-days: 14

  cleanup_rc:
    name: Cleanup RC after all acceptance jobs
    needs: [deploy_and_accept, build_desktop_rc, finalize_acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: rc
    concurrency:
      group: xpod-shared-rc-service
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      XPOD_RC_SEED_SECRET_NAME: xpod-rc-seed-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Scale RC deployments to zero
        run: |
          set -euo pipefail
          if [[ ! "$SEALOS_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ || ${#SEALOS_NAMESPACE} -gt 63 ]]; then
            echo "::error::SEALOS_NAMESPACE is invalid"
            exit 1
          fi
          test -n "$KUBE_CONFIG_DATA"
          umask 077
          export KUBECONFIG="${RUNNER_TEMP}/rc-cleanup-kubeconfig"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$KUBECONFIG"
          node scripts/check-rc-deployment-boundary.cjs
          observation="${RUNNER_TEMP}/rc-cleanup-deployment.json"
          kubectl -n "$SEALOS_NAMESPACE" get deployment/xpod-rc --ignore-not-found -o json > "$observation"
          set +e
          node scripts/rc-cleanup-ownership.cjs deployment "$observation" "$SEALOS_NAMESPACE" "$XPOD_RC_SEED_SECRET_NAME"
          ownership_status=$?
          set -e
          if [ "$ownership_status" -eq 0 ]; then
            kubectl -n "$SEALOS_NAMESPACE" scale deployment/xpod-rc --replicas=0
            if [ -n "$(kubectl -n "$SEALOS_NAMESPACE" get deployment/xpod-rc-inngest --ignore-not-found -o name)" ]; then
              kubectl -n "$SEALOS_NAMESPACE" scale deployment/xpod-rc-inngest --replicas=0
            fi
            kubectl -n "$SEALOS_NAMESPACE" delete secret "$XPOD_RC_SEED_SECRET_NAME" --ignore-not-found
          elif [ "$ownership_status" -eq 2 ]; then
            echo 'RC is absent or belongs to another run; resources retained'
          else
            exit "$ownership_status"
          fi
