name: Readonly QLever SDK normal job
on:
  workflow_call:
    inputs:
      sdk_profile:
        type: string
        default: module-bookworm-gcc12
      target:
        type: string
        required: true
      source_commit:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      kernel_probe_only:
        type: boolean
        default: false
    outputs:
      image:
        value: ${{ jobs.sdk.outputs.image }}
      digest:
        value: ${{ jobs.sdk.outputs.digest }}
      tag:
        value: ${{ jobs.sdk.outputs.tag }}
      sdk_artifact_id:
        value: ${{ jobs.sdk.outputs.sdk_artifact_id }}
      sdk_artifact_digest:
        value: ${{ jobs.sdk.outputs.sdk_artifact_digest }}
      sdk_master_sha256:
        value: ${{ jobs.sdk.outputs.sdk_master_sha256 }}
      sdk_master_bytes:
        value: ${{ jobs.sdk.outputs.sdk_master_bytes }}
jobs:
  sdk:
    runs-on: ${{ inputs.target == 'linux-x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.publish.outputs.tag }}
      sdk_artifact_id: ${{ steps.sdk_upload.outputs.artifact-id }}
      sdk_artifact_digest: ${{ steps.sdk_upload.outputs.artifact-digest }}
      sdk_master_sha256: ${{ steps.master.outputs.master_sha256 }}
      sdk_master_bytes: ${{ steps.master.outputs.master_bytes }}
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Before this fixed shell, no checkout script/package/install/test runs on
      # the host. Candidate build code runs only in BuildKit or the RO guest.
      - name: Verify controller closure
        id: controller
        env:
          TARGET: ${{ inputs.target }}
          SDK_PROFILE: ${{ inputs.sdk_profile }}
          KERNEL_PROBE_ONLY: ${{ inputs.kernel_probe_only }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin SOURCE="$GITHUB_WORKSPACE" DEST="$RUNNER_TEMP/qlever-sdk-controller" TARGET="$TARGET" SDK_PROFILE="$SDK_PROFILE" KERNEL_PROBE_ONLY="$KERNEL_PROBE_ONLY" PUBLISH="$PUBLISH" SOURCE_SHA="$GITHUB_SHA" REQUESTED_SHA="${{ inputs.source_commit }}" EVENT="$GITHUB_EVENT_PATH" RUN_ID="$GITHUB_RUN_ID" ATTEMPT="$GITHUB_RUN_ATTEMPT" OUTPUT="$GITHUB_OUTPUT" /usr/bin/python3 -I -S - <<'PYCODE'
          import hashlib,importlib.util,json,os,pathlib,stat,time
          if os.environ['KERNEL_PROBE_ONLY'] not in ['true','false'] or os.environ['PUBLISH'] not in ['true','false']:raise RuntimeError('Exact diagnostic/publish modes required')
          if os.environ['KERNEL_PROBE_ONLY']=='true' and (os.environ['PUBLISH']=='true' or os.environ['SDK_PROFILE']!='service-trixie'):raise RuntimeError('Kernel diagnostics require service-trixie and cannot publish')
          pins={"qlever/scripts/sdk-readonly-normal-route.py":"15769e514aa2ee6a82cb213e184702b3501d82be2f52cb401935b102441a98dd","qlever/scripts/sdk-readonly-result-context.py":"399ed47e71111da617d93b14f259adbfd73b5cacd28c3f75a212236050b18a90","qlever/scripts/sdk-readonly-executor.py":"70fe276f4e696145e9befb6b24822a6ee9f03fedb9a931ce0c02ff5215580d86","qlever/scripts/sdk-readonly-executor-bindings.py":"b953f52c5c74622dd76f925c78656266b924f4c45cc6d43a9deb7c5c2a81e82b","qlever/scripts/sdk-readonly-executor-entry.py":"54f6d66c420965aea80a67e915009dc681424df44577c933b6b8c5fbd36443a9","qlever/scripts/sdk-image-originals.py":"b3543e5454b1a96b59605e0e979595c80be17f2b5d4cebe47a640b7cc687e91e","qlever/scripts/sdk-command-materials.py":"353ccadc3b80596fbfc12a7f40770aff9b799e9ace10dbc31140350068aab4e8","qlever/scripts/sdk-execution-budget.py":"329194655827de1d03a31db5f311ba1cc59fd0ade7edf2ef48fcc8fae52ebfee","qlever/scripts/sdk-owned-runs.py":"520241ea81d57d82a33550c44ed3809378fd81d03bc14a8a5985f871b6b64680","qlever/scripts/sdk-subreaper-guard.py":"5a7c1ecf3f570cc83897ccac30843ecd513a5d2b001f250e13e16a636e22fa4a","qlever/scripts/sdk-tar-budget.py":"e244da8ca8aa2c85cca03d8deebc56a2edca13749c1cc79fffad14872e52f30d","qlever/scripts/sdk-debian-binary-originals.py":"f9f780094a7e0d7e530ff1f3200b1ef187587bd6e4463b4291940186f6fd5e5c","qlever/scripts/sdk-debian-index-bindings.py":"ad87a17bdb781f34a6a78a5e970d1f9c69d0750a1fcc4ba3f711db317bd75e13","scripts/agentfs-native-ci/supervise.py":"139185a450f07812edc1300e24b68787012d1f334e6f27c2bb9e6b8a84d2af77","scripts/lib/module-artifact-limits.json":"c1c529aba719356c682affbe630c215e28cc07163192f8f3b601aab7b0126bd4","qlever/scripts/sdk-readonly-collection.py":"44e4be27c022fc2c5383dd6ffcb8949512e663cbfa5b500985e9592517ef9d1e","qlever/scripts/qlever_compiler_profile.py":"7b9c05563e21ff05e33e3ac61641ad418fe48b5cc48e3399ca02c14beb6d248b","qlever/scripts/sdk-local-daemon-originals.py":"9c5541b959d86d690f1d1806e123ce046008d8e82ab5127685e51d31c8e5dcd5","qlever/scripts/sdk-service-profile-materials.py":"42c4456ab88a8899785117071e4c71d736f43be001fb12875cac7f2d9bac8112","qlever/scripts/sdk-kernel-probe-controller.py":"6ce0114d717c873849bdecab04c11fb4aa7b187975f5dd7798da3d226944ffec","qlever/scripts/sdk-kernel-policy-probe.py":"53b1ed7313564b4f5a3615eaf376bea6c6bcf269fadcb0402debed13227a5417"}
          source=pathlib.Path(os.environ['SOURCE']).resolve(strict=True);dest=pathlib.Path(os.environ['DEST']);dest.mkdir(mode=0o700)
          for name,sha in pins.items():
              path=source/name;fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
              try:
                  first=os.fstat(fd)
                  if not stat.S_ISREG(first.st_mode) or first.st_nlink!=1 or first.st_size>4194304:raise RuntimeError('bounded controller original required')
                  data=bytearray()
                  while True:
                      part=os.read(fd,min(65536,first.st_size+1-len(data)))
                      if not part:break
                      data.extend(part)
                      if len(data)>first.st_size:raise RuntimeError('controller grew')
                  ident=lambda v:(v.st_dev,v.st_ino,v.st_mode,v.st_size,v.st_mtime_ns,v.st_ctime_ns)
                  if ident(first)!=ident(os.fstat(fd)) or ident(first)!=ident(path.lstat()) or len(data)!=first.st_size or hashlib.sha256(data).hexdigest()!=sha:raise RuntimeError('unreviewed controller closure')
                  target=dest/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o444)
              finally:os.close(fd)
          event=json.loads(pathlib.Path(os.environ['EVENT']).read_text());sha=os.environ['SOURCE_SHA']
          if len(sha)!=40 or any(c not in 'abcdef0123456789' for c in sha):raise RuntimeError('immutable source SHA required')
          if os.environ['REQUESTED_SHA'] and os.environ['REQUESTED_SHA']!=sha:raise RuntimeError('source_commit must equal immutable caller SHA')
          if os.environ['TARGET'] not in ['linux-x64','linux-arm64']:raise RuntimeError('fixed native target required')
          spec=importlib.util.spec_from_file_location('controller_profile',dest/'qlever/scripts/qlever_compiler_profile.py');profiles=importlib.util.module_from_spec(spec);spec.loader.exec_module(profiles);profile=profiles.declared_profile(os.environ['SDK_PROFILE'])
          identity=dict(sourceSha=sha,runHeadSha=event.get('pull_request',{}).get('head',{}).get('sha',sha),runId=int(os.environ['RUN_ID']),runAttempt=int(os.environ['ATTEMPT']),target=os.environ['TARGET'],sdkProfile=profile['name'])
          with open(os.environ['OUTPUT'],'a') as out:out.write('deadline='+str(int(time.time())+21000)+'\nidentity='+json.dumps(identity,separators=(',',':'))+'\n')
          PYCODE
      - name: Capture immutable source context
        env:
          DEADLINE: ${{ steps.controller.outputs.deadline }}
        run: |
          set -euo pipefail
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" /usr/bin/python3 -I -S -B "$RUNNER_TEMP/qlever-sdk-controller/qlever/scripts/sdk-image-originals.py" context --out "$RUNNER_TEMP/qlever-sdk-context" --deadline "$DEADLINE"
      - name: Build readonly SDK or run the explicit kernel diagnostic
        env:
          DEADLINE: ${{ steps.controller.outputs.deadline }}
          IDENTITY: ${{ steps.controller.outputs.identity }}
          KERNEL_PROBE_ONLY: ${{ inputs.kernel_probe_only }}
        run: |
          set -euo pipefail
          probe_args=()
          if [ "$KERNEL_PROBE_ONLY" = true ]; then probe_args+=(--kernel-probe-only); fi
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -I -S -B "$RUNNER_TEMP/qlever-sdk-controller/qlever/scripts/sdk-readonly-normal-route.py" --identity "$IDENTITY" --deadline "$DEADLINE" --out "$RUNNER_TEMP/qlever-sdk-outer" --context-originals "$RUNNER_TEMP/qlever-sdk-context/context-originals.json" "${probe_args[@]}"
      - name: Log in to GHCR for the normal publisher
        if: inputs.publish && !inputs.kernel_probe_only && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the actual linked readonly SDK
        id: publish
        if: inputs.publish && !inputs.kernel_probe_only && github.event_name != 'pull_request'
        env:
          DEADLINE: ${{ steps.controller.outputs.deadline }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          credentials="$(realpath -e "${DOCKER_CONFIG:-$HOME/.docker}")"
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" /usr/bin/python3 -I -S -B "$RUNNER_TEMP/qlever-sdk-controller/qlever/scripts/sdk-readonly-collection.py" --mode publish --route-root "$RUNNER_TEMP/qlever-sdk-outer" --target "$TARGET" --credentials "$credentials" --out "$RUNNER_TEMP/qlever-sdk-publisher" --deadline "$DEADLINE"
      - name: Bind actual readonly SDK image and build originals
        id: master
        if: inputs.publish && !inputs.kernel_probe_only && github.event_name != 'pull_request'
        env:
          DEADLINE: ${{ steps.controller.outputs.deadline }}
          IMAGE: ${{ steps.publish.outputs.image }}
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_ACTOR="$GITHUB_ACTOR" GH_TOKEN="$GH_TOKEN" GITHUB_OUTPUT="$GITHUB_OUTPUT" /usr/bin/python3 -I -S -B "$RUNNER_TEMP/qlever-sdk-controller/qlever/scripts/sdk-readonly-collection.py" --mode collect --image "$IMAGE" --target "$TARGET" --route-root "$RUNNER_TEMP/qlever-sdk-outer" --context-root "$RUNNER_TEMP/qlever-sdk-context" --out "$RUNNER_TEMP/sdk-originals" --deadline "$DEADLINE"
      - name: Collect local validation originals without registry authority
        if: ${{ !inputs.kernel_probe_only && (!inputs.publish || github.event_name == 'pull_request') }}
        env:
          DEADLINE: ${{ steps.controller.outputs.deadline }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" /usr/bin/python3 -I -S -B "$RUNNER_TEMP/qlever-sdk-controller/qlever/scripts/sdk-readonly-collection.py" --mode validate --target "$TARGET" --route-root "$RUNNER_TEMP/qlever-sdk-outer" --context-root "$RUNNER_TEMP/qlever-sdk-context" --out "$RUNNER_TEMP/sdk-originals" --deadline "$DEADLINE"
      - name: Seal controller originals for upload
        if: always()
        run: |
          for path in "$RUNNER_TEMP/qlever-sdk-outer" "$RUNNER_TEMP/qlever-sdk-context" "$RUNNER_TEMP/sdk-originals"; do
            if sudo test -d "$path"; then sudo chmod -R a+rX "$path"; fi
          done
      - name: Retain native kernel diagnostic originals
        if: ${{ always() && inputs.kernel_probe_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readonly-sdk-kernel-probe-${{ inputs.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qlever-sdk-outer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain no-push normal route originals
        if: success() && !inputs.kernel_probe_only && (!inputs.publish || github.event_name == 'pull_request')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readonly-sdk-normal-route-${{ inputs.sdk_profile == 'service-trixie' && 'service-trixie-' || '' }}${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-originals/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact SDK original materials
        id: sdk_upload
        if: inputs.publish && !inputs.kernel_probe_only && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlever-sdk-originals-${{ inputs.sdk_profile == 'service-trixie' && 'service-trixie-' || '' }}${{ inputs.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-originals/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed readonly driver originals
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readonly-sdk-driver-failure-${{ inputs.sdk_profile == 'service-trixie' && 'service-trixie-' || '' }}${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qlever-sdk-outer/
            ${{ runner.temp }}/qlever-sdk-context/
          if-no-files-found: ignore
          retention-days: 14
