name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-package-tarball:
    name: verify-package-tarball (${{ matrix.os }} / node${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      XPOD_INSTALL_REGISTRY: ${{ vars.XPOD_INSTALL_REGISTRY }}
    strategy:
      fail-fast: false
      matrix:
        # macOS npm cold installs can spend many minutes resolving xpod's large
        # dependency tree. Keep pre-publish npm smoke on Ubuntu and leave macOS
        # coverage to the Bun matrix plus post-publish non-blocking consumers.
        os: [ubuntu-latest]
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - name: Check platform package versions
        run: bun run check:platform-package-version

      - name: Build package
        run: bun run build

      - name: Pack npm tarball
        run: node scripts/run-npm-pack.cjs .test-data/npm-pack .test-data/npm-cache

      - name: Verify npm tarball contents
        run: node scripts/check-pack-json.cjs .test-data/npm-pack/pack.json

      - name: Install tarball in clean consumer workspace
        run: node scripts/package-smoke-install.cjs .test-data/npm-pack/pack.json "${{ runner.temp }}/xpod-package-smoke" .test-data/npm-cache

      - name: Consumer runtime smoke
        run: node scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke"

  verify-package-tarball-bun:
    name: verify-package-tarball-bun (${{ matrix.os }} / node${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      XPOD_INSTALL_REGISTRY: ${{ vars.XPOD_INSTALL_REGISTRY }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - name: Check platform package versions
        run: bun run check:platform-package-version

      - name: Build package
        run: bun run build

      - name: Pack npm tarball
        run: node scripts/run-npm-pack.cjs .test-data/npm-pack .test-data/npm-cache

      - name: Verify npm tarball contents
        run: node scripts/check-pack-json.cjs .test-data/npm-pack/pack.json

      - name: Install tarball with Bun in clean consumer workspace
        run: node scripts/package-smoke-install.cjs .test-data/npm-pack/pack.json "${{ runner.temp }}/xpod-package-smoke-bun" .test-data/bun-cache bun

      - name: Consumer runtime smoke under Bun
        run: bun scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke-bun"

  publish-qlever-runtime-sdk:
    needs: [verify-package-tarball, verify-package-tarball-bun]
    uses: ./.github/workflows/publish-qlever-runtime-sdk.yml
    permissions:
      contents: read
      packages: write

  publish-qlever-local-runtime:
    needs: publish-qlever-runtime-sdk
    uses: ./.github/workflows/publish-qlever-local-runtime.yml
    permissions:
      contents: read
      packages: write
    with:
      prior_sdk_image: ${{ needs.publish-qlever-runtime-sdk.outputs.image }}

  build-and-push:
    needs: [verify-package-tarball, verify-package-tarball-bun, publish-qlever-local-runtime]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/undefinedsco/xpod
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xpod-server
          cache-to: type=gha,mode=max,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ needs.publish-qlever-local-runtime.outputs.image }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-package-tarball, verify-package-tarball-bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Check platform package versions
        run: bun run check:platform-package-version

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: node scripts/publish-release.cjs --skip-build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          XPOD_PUBLISH_REGISTRY: https://registry.npmjs.org
          XPOD_PUBLISH_PLATFORM_PACKAGES: 'false'

  verify-npm-consumer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-npm
    name: verify-npm-consumer (${{ matrix.os }} / node${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Wait for npm package
        run: node scripts/wait-for-npm-package.cjs "@undefineds.co/xpod@${{ github.ref_name }}"

      - name: Install published package in clean workspace
        run: node scripts/package-smoke-install.cjs "@undefineds.co/xpod@${{ github.ref_name }}" "${{ runner.temp }}/xpod-package-smoke" .test-data/npm-cache

      - name: Published runtime smoke
        run: node scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke"

  verify-npm-consumer-bun:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-npm
    name: verify-npm-consumer-bun (${{ matrix.os }} / node${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Wait for npm package
        run: node scripts/wait-for-npm-package.cjs "@undefineds.co/xpod@${{ github.ref_name }}"

      - name: Install published package with Bun in clean workspace
        run: node scripts/package-smoke-install.cjs "@undefineds.co/xpod@${{ github.ref_name }}" "${{ runner.temp }}/xpod-package-smoke-bun" .test-data/bun-cache bun

      - name: Published runtime smoke under Bun
        run: bun scripts/package-consumer-smoke.cjs "${{ runner.temp }}/xpod-package-smoke-bun"
