name: CI

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Explicit independent product publication control route'
        required: true
        type: choice
        options: [independent-publication]
      source_sha:
        description: 'Reviewed immutable staging source SHA'
        required: true
        type: string
      producer_coordinates:
        description: 'Complete immutable product selector request; no approvals'
        required: true
        type: string
      mode:
        description: 'Prepare evidence, or explicitly publish after all gates'
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'independent-publication-control' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # The Git-history immutability tests read real commits (9d02/2406/19fe).
      # A default shallow checkout cannot resolve them, so this job needs full
      # history. Only this existing step changes; no test is skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Check native SDK, archive and Docker context contracts before builds
        run: |
          python3 -m unittest discover -s qlever/tests -p 'test_qlever*'
          python3 -m unittest discover -s qlever/tests -p 'test_resolve_runtime_sdk_build.py'
          python3 -m unittest discover -s qlever/tests -p 'test_macos*.py'
          python3 qlever/tests/test_bounded_original_reader.py

      # Standing dual-compiler gate for the shipped scoped-PCH recipe.
      # The canonical suite executes the REAL recipe block extracted from the
      # shipped patch, so CMake must actually select a compiler the recipe admits
      # (Clang 19..<20 or GNU 12..<13). ubuntu-latest preinstalls Clang 16/17/18
      # and GNU 13 as `g++`, so neither reviewed driver may be assumed.
      # Ubuntu noble-updates ships clang-19, g++-12 and gcc-12 as ordinary
      # packages, so no external archive, extra image or default-compiler
      # substitution is needed.
      - name: Install the two reviewed scoped-PCH compilers when absent
        run: |
          set -eu
          missing=0
          for pkg in g++-12 gcc-12 clang-19 cmake ninja-build; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing=1
          done
          if [ "$missing" -eq 1 ]; then
            sudo apt-get update
            # Exact reviewed majors from the existing Ubuntu repositories only.
            sudo apt-get install -y --no-install-recommends \
              g++-12 gcc-12 clang-19 cmake ninja-build
          fi
          g++-12 --version | head -1
          clang++-19 --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Require both reviewed compilers and tools
        run: |
          set -eu
          for cxx in g++-12 clang++-19; do
            if ! command -v "$cxx" >/dev/null 2>&1; then
              echo "::error::required reviewed compiler missing: $cxx"
              exit 1
            fi
          done
          for tool in cmake ninja; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::required tool missing: $tool"
              exit 1
            fi
          done
          g++-12 --version | head -1
          clang++-19 --version | head -1

      - name: Scoped-PCH recipe gate (both reviewed compilers, 4 tests 0 skips each)
        run: |
          set -eu
          for cxx in g++-12 clang++-19; do
            echo "::group::scoped-PCH recipe with CXX_OVERRIDE=$cxx"
            # Fresh interpreter per arm: the suite captures its CXX constant at
            # import time, so sharing a process would run both arms against the
            # first compiler. The guard asserts testsRun==4, zero skips and
            # wasSuccessful, because a unittest CLI exit code of 0 can mean every
            # case was skipped.
            CXX_OVERRIDE="$cxx" PYTHONPATH="$PWD" python3 qlever/tests/pch_scope_case_guard.py "$cxx"
            echo "::endgroup::"
          done

      # Fast native lease contract gate for the MAIN CI job. Runs after the
      # static contract checks and before this job's own build steps, so a
      # broken reader/formatter/ABI fails in seconds. It is NOT a
      # cross-workflow precondition: independent SDK workflows may start in
      # parallel. The gate builds the observer's real helper with a real
      # compiler child and runs every contract case; "0 tests ran" fails.
      - name: Install interpreter-matched C headers for the native gate
        run: |
          set -eu
          PY=/usr/bin/python3
          VER=$($PY -c 'import sys;print("%d.%d"%sys.version_info[:2])')
          INC=$($PY -c 'import sysconfig;print(sysconfig.get_paths()["include"])')
          echo "interpreter: $($PY --version)  version=$VER  include=$INC"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "python${VER}-dev" clang
          test -f "$INC/Python.h"

      - name: Native lease contract gate
        env:
          NATIVE_LEASE_CC: clang
        run: /usr/bin/python3 qlever/tests/run_native_lease_gate.py -v

      # Executable-memory remap (SDK70). Dedicated REAL-Linux gate: CI discovers
      # only `test_qlever*.py`, so the canonical `test_sdk70_mremap*` modules
      # would otherwise never run here. Runs after the interpreter-matched
      # headers above and builds the observer's OWN native lease DI with the
      # declared compiler. Linux-only and fail-closed: wrong platform, missing
      # compiler/headers/fixture, zero cases, any skip or nonzero exit fails.
      # The real child authority drop uses PR_CAPBSET_DROP, requiring
      # CAP_SETPCAP. Run the producer as root; the observed child still drops
      # every capability. Preserve the declared native compiler for this gate.
      - name: SDK70 executable-memory remap gate
        env:
          NATIVE_LEASE_CC: clang
        run: sudo -E /usr/bin/python3 qlever/tests/run_sdk70_mremap_gate.py -v

      # REQUIRED privileged gate for the owned-metadata observer.
      #
      # The module drives the REAL observer profile, whose child authority
      # handshake drops the whole capability bounding set before it releases the
      # observer; a plain user has no CAP_SETPCAP so PR_CAPBSET_DROP returns EPERM
      # and the child never signals readiness. Same precedent as the SDK70 remap
      # gate: run it privileged, and let the observed child still drop every
      # capability.
      #
      # A bare `python3 -m unittest` exits 0 even when every case SKIPS, so this
      # step uses an explicit runner: it requires the exact known case set and
      # count, and fails on any skip, failure, missing case or unexpected case.
      # Importing the module already runs its ONE real capability probe, so there
      # is no duplicated preflight here; an incapable host skips and the zero-skip
      # rule below turns that into a failure.
      - name: Build canonical SDK native lease helper for the required gate
        run: |
          sudo -E env PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B qlever/scripts/native/build_native_helper.py \
            qlever/scripts/native/lease_sweep_ext.c qlever/scripts/native --cc gcc-12

      - name: Owned observer native regressions (required, no skip)
        run: |
          # Children drop every capability; retain the runner group so they can
          # still traverse its private home and checked-out source directories.
          sudo -u root -E env PYTHONDONTWRITEBYTECODE=1 /usr/bin/setpriv --regid "$(id -g)" --keep-groups /usr/bin/python3 -B - <<'PYGATE'
          """REQUIRED privileged gate: fail unless the WHOLE known suite actually ran.

          An ordinary `python3 -m unittest ...` exits 0 even when every case skips, so a
          privileged context that lacks CAP_SETPCAP could look green. This runner loads the
          REAL module, requires the exact known case set and count, and exits non-zero on
          any skip, any failure, any missing case or any unexpected extra case.

          There is deliberately NO second capability preflight here. Importing the module
          already runs its real `capabilities()` probe, which sets `_AUTHORITY`; when the
          host cannot empty the capability bounding set the class skips, and the zero-skip
          requirement below then fails the gate. One implementation only -- the module's.
          """
          import sys
          import unittest

          MODULES = (
              'qlever.tests.test_qlever_owned_metadata_observer',
              'qlever.tests.test_qlever_owned_window_emission',
              'qlever.tests.test_qlever_owned_fatal_stop_frame',
              'qlever.tests.test_qlever_external_scope_errors',
              'qlever.tests.test_qlever_leased_external_scope',
              'qlever.tests.test_qlever_read_body_closing_contract',
              'qlever.tests.test_qlever_maps_geometry_entry',
          )
          CLASS = MODULES[0] + '.OwnedMetadataObserverRunloop'
          WINDOW = MODULES[1] + '.OwnedWindowEmission'
          FATAL = MODULES[2] + '.FatalStopFrame'
          EXPECTED = frozenset({
              CLASS + '.test_failed_rename_is_not_absorbed',
              CLASS + '.test_foreign_identity_cannot_advance',
              CLASS + '.test_real_rename_emit_and_lease_advance',
              CLASS + '.test_real_semantic_observe_accepts_advanced_rename_and_unlink',
              CLASS + '.test_real_unlink_emit_and_lease_advance',
              CLASS + '.test_semantic_observe_refuses_forged_closing_identity',
              CLASS + '.test_unknown_operation_refused',
              WINDOW + '.test_window_coalesces_leading_sweep_and_trailing_check_always_runs',
              WINDOW + '.test_trailing_check_still_rejects_a_mutated_identity',
              WINDOW + '.test_nested_reclamp_under_same_parent_does_not_inherit',
              WINDOW + '.test_wrong_thread_does_not_inherit',
              WINDOW + '.test_open_refuses_without_a_real_clamp',
              WINDOW + '.test_wrong_phase_runs_both_sweeps',
              WINDOW + '.test_another_waiter_cannot_inherit_the_same_deadlines',
              WINDOW + '.test_open_refuses_reentrancy',
              WINDOW + '.test_exception_after_arm_leaves_no_claim',
              WINDOW + '.test_abort_clears_claim',
              FATAL + '.test_real_event_path_captures_stop_from_real_lease_verdict',
              FATAL + '.test_original_injected_exception_object_propagates',
              FATAL + '.test_diagnostic_failure_preserves_original_exception',
              FATAL + '.test_real_architectures_and_timestamp_identity_are_preserved',
              FATAL + '.test_fatal_context_survives_full_row_pressure',
              FATAL + '.test_malformed_pending_fields_degrade_and_stay_bounded',
              FATAL + '.test_no_frame_on_a_passing_event',
              FATAL + '.test_no_frame_on_a_non_kernel_error',
              FATAL + '.test_exclusive_needs_pid_and_entry_sequence',
              'qlever.tests.test_qlever_external_scope_errors.ExternalScopeErrorContract.test_caller_timeout_propagates_unchanged_before_any_emit',
              'qlever.tests.test_qlever_external_scope_errors.ExternalScopeErrorContract.test_eio_propagates_unchanged_before_any_emit',
              'qlever.tests.test_qlever_external_scope_errors.ExternalScopeErrorContract.test_enoent_yields_the_unobserved_row',
              'qlever.tests.test_qlever_external_scope_errors.ExternalScopeErrorContract.test_parent_symlink_swap_cannot_admit_an_unleased_inode',
              'qlever.tests.test_qlever_leased_external_scope.LeasedExternalScope.test_already_held_external_unlink_is_witnessed_advanced_and_replayed',
              'qlever.tests.test_qlever_leased_external_scope.LeasedExternalScope.test_linkat_symlink_follow_witnesses_followed_target',
              'qlever.tests.test_qlever_leased_external_scope.LeasedExternalScope.test_unleased_external_operand_has_no_witness',
              'qlever.tests.test_qlever_leased_external_scope.LeasedExternalScope.test_unlink_symlink_does_not_advance_followed_target',
              'qlever.tests.test_qlever_leased_external_scope.LeasedExternalScope.test_semantic_replay_refuses_forged_external_closing_identity',
              'qlever.tests.test_qlever_read_body_closing_contract.P11NonLeaseChecks.test_budget_and_waiter_run_every_iteration_in_original_order',
              'qlever.tests.test_qlever_read_body_closing_contract.P11NonLeaseChecks.test_second_iteration_failure_propagates_object_before_more_io',
              'qlever.tests.test_qlever_read_body_closing_contract.P12WaiterIdentity.test_distinct_waiters_with_same_deadline_do_not_inherit',
              'qlever.tests.test_qlever_read_body_closing_contract.P12WaiterIdentity.test_none_waiter_during_bootstrap_still_works_and_fails_closed_on_swap',
              'qlever.tests.test_qlever_read_body_closing_contract.P12WaiterIdentity.test_observer_deadline_change_invalidates_the_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P13PrimaryAndNesting.test_nested_attempt_does_not_steal_outer_claim',
              'qlever.tests.test_qlever_read_body_closing_contract.P13PrimaryAndNesting.test_entry_failure_preserves_object_and_opens_no_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P13PrimaryAndNesting.test_pre_existing_maps_frame_is_refused_before_entry',
              'qlever.tests.test_qlever_read_body_closing_contract.P13PrimaryAndNesting.test_closing_failure_never_replaces_body_primary',
              'qlever.tests.test_qlever_read_body_closing_contract.P13PrimaryAndNesting.test_phase_change_path_resets_the_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P14RealConvertedMethods.test_real_tool_original_no_NameError_and_bytes_accounted',
              'qlever.tests.test_qlever_read_body_closing_contract.P14RealConvertedMethods.test_real_tool_original_cache_hit_returns_same_row',
              'qlever.tests.test_qlever_read_body_closing_contract.P14RealConvertedMethods.test_real_read_capture_fd_full_read',
              'qlever.tests.test_qlever_read_body_closing_contract.P14RealConvertedMethods.test_real_snapshot_write_original_fallback',
              'qlever.tests.test_qlever_read_body_closing_contract.P14RealConvertedMethods.test_real_snapshot_short_read_still_hard_fails',
              'qlever.tests.test_qlever_read_body_closing_contract.P15CoreGuards.test_core_emit_original_blocked_whenever_any_read_frame_exists',
              'qlever.tests.test_qlever_read_body_closing_contract.P15CoreGuards.test_core_resume_original_blocked_whenever_any_read_frame_exists',
              'qlever.tests.test_qlever_read_body_closing_contract.P15CoreGuards.test_no_raw_row_written_when_core_emit_refuses',
              'qlever.tests.test_qlever_read_body_closing_contract.P16BidirectionalExclusion.test_maps_frame_cannot_open_inside_a_read_body',
              'qlever.tests.test_qlever_read_body_closing_contract.P16BidirectionalExclusion.test_read_body_cannot_open_inside_a_maps_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P16BidirectionalExclusion.test_closing_is_a_real_full_audit_not_a_cheap_skip',
              'qlever.tests.test_qlever_read_body_closing_contract.P1OpenArmRaceFinalisation.test_real_install_then_raise_sentinel_clears_own_claim_and_preserves_object',
              'qlever.tests.test_qlever_read_body_closing_contract.P1OpenArmRaceFinalisation.test_entry_failure_installs_no_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P1OpenArmRaceFinalisation.test_nested_failure_leaves_outer_claim_untouched',
              'qlever.tests.test_qlever_read_body_closing_contract.P1OpenArmRaceFinalisation.test_foreign_open_claim_is_never_cleared_by_our_finaliser',
              'qlever.tests.test_qlever_read_body_closing_contract.P1OpenArmRaceFinalisation.test_clear_own_claim_ignores_a_replacement',
              'qlever.tests.test_qlever_read_body_closing_contract.P2ResetIntegration.test_close_resets_owned_frames',
              'qlever.tests.test_qlever_read_body_closing_contract.P2ResetIntegration.test_reset_owned_frames_is_idempotent',
              'qlever.tests.test_qlever_read_body_closing_contract.P2ResetIntegration.test_phase_entry_resets_so_a_stale_claim_cannot_carry_over',
              'qlever.tests.test_qlever_read_body_closing_contract.P2ResetIntegration.test_abort_resets_before_any_cleanup_can_fail',
              'qlever.tests.test_qlever_read_body_closing_contract.P2CommentContractAccuracy.test_body_may_write_private_originals_but_not_publish',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_multi_owner_two_native_audits_keep_every_nonlease_check',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_midbody_real_lease_loss_prevents_result_escape',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_stat_primary_survives_failed_closing_audit',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_flags_primary_survives_failed_closing_audit',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_actual_1024_descriptor_bound_still_refuses',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_actual_64_alias_key_bound_still_refuses',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_declared_shared_table_dedup_preserves_selected_owner_priority',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_exited_owner_is_never_scanned',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_standalone_fd_scan_retains_two_full_native_audits',
              'qlever.tests.test_qlever_read_body_closing_contract.P17WritableAliasReadBody.test_inner_budget_failure_preserves_object_and_clears_frame',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_owned_emit_one_native_sweep_and_all_three_nonlease_checks',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_outside_window_keeps_three_full_sweeps',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_direct_runtime_record_inside_window_keeps_full_sweep',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_real_coordinated_callback_one_sweep_and_round_can_close',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_real_lease_loss_during_callback_prevents_result_escape',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_callback_primary_object_survives_failed_full_closing',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_callback_cannot_open_read_primitive_or_publish_or_resume',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_foreign_slot_replacement_refused_without_stealing',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_partial_install_failure_clears_only_own_claim_and_preserves_primary',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_every_changed_binding_falls_back_to_full_callback_audit',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_actual_context_changes_and_equal_waiter_never_inherit',
              'qlever.tests.test_qlever_read_body_closing_contract.P18ExactRecordCallback.test_parked_profile_round_none_uses_real_cohort_record_validation',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_owned_maps_new_write_and_reuse_keep_complete_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_owned_maps_full_entry_three_to_two_for_both_storage_paths',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_outside_window_maps_keep_five_and_geometry_two_full_audits',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_owned_actual_geometry_two_to_one_without_changing_local_checks',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_legacy_geometry_call_defaults_to_two_full_audits_inside_window',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_maps_real_lease_loss_refused_before_any_record_is_published',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_geometry_real_lease_loss_refused_at_complete_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_geometry_primary_object_wins_over_failed_native_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_maps_primary_object_wins_over_failed_native_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_maps_partial_install_clears_own_claim_and_closes_with_full_audit',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_foreign_maps_claim_kept_but_cannot_suppress_real_failed_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_partial_arm_primary_wins_and_foreign_claim_cannot_hide_lease_loss',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_geometry_foreign_frame_cannot_hide_real_failed_full_closing',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_entry_refuses_all_existing_frames_before_any_check',
              'qlever.tests.test_qlever_maps_geometry_entry.MapsGeometryEntry.test_context_mismatch_and_missing_window_use_full_entries',
          })


          def flatten(suite):
              ids = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      ids.extend(flatten(item))
                  else:
                      ids.append(item.id())
              return ids


          def main():
              suite = unittest.TestSuite(
                  unittest.TestLoader().loadTestsFromName(module) for module in MODULES
              )
              discovered = flatten(suite)
              missing = sorted(EXPECTED - set(discovered))
              unexpected = sorted(set(discovered) - EXPECTED)
              if missing or unexpected or len(discovered) != len(EXPECTED):
                  print('REQUIRED GATE: suite shape differs (count=%d missing=%r unexpected=%r)'
                        % (len(discovered), missing, unexpected), file=sys.stderr)
                  return 1

              result = unittest.TextTestRunner(verbosity=2).run(suite)
              problems = []
              if not result.wasSuccessful():
                  problems.append('failures/errors')
              if result.skipped:
                  problems.append('skipped=%d' % len(result.skipped))
              if result.testsRun != len(EXPECTED):
                  problems.append('testsRun=%d expected=%d' % (result.testsRun, len(EXPECTED)))
              if problems:
                  print('REQUIRED GATE FAILED: ' + '; '.join(problems), file=sys.stderr)
                  for case, why in result.skipped:
                      print('  skipped: %s -> %s' % (case.id(), why), file=sys.stderr)
                  return 1
              print('REQUIRED GATE OK: %d/%d cases ran, 0 skipped'
                    % (result.testsRun, len(EXPECTED)))
              return 0


          if __name__ == '__main__':
              sys.exit(main())
          PYGATE

      - name: Install ripgrep differential oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Build workspace packages
        run: bun run build:packages

      - name: Check platform package versions
        run: bun run check:platform-package-version

      - name: Type check
        run: bun run build:ts

      # build:ts covers only bin/ and src/. Without this step the tests are unchecked, and they
      # were silently unchecked for a long time (see docs/testing/test-typecheck.md).
      - name: Type check tests
        run: bun run typecheck:test

      - name: Type check standalone Xpod CLI
        run: bun x tsc --noEmit -p packages/xpod-cli/tsconfig.json

      - name: Shared runtime client Bun tests
        run: bun test ./packages/xpod-client/tests

      - name: Standalone Xpod CLI tests
        run: bun run --filter '@undefineds.co/xpod-cli' test

      - name: AFS Bun tests
        run: bun run --filter '@undefineds.co/xpod-afs' test

      - name: Standalone Xpod CLI preview compatibility tests
        run: bun run --filter '@undefineds.co/xpod-cli' test:preview

      - name: Build Components artifacts
        run: bun run build:components

      - name: Build UI artifacts
        run: bun run build:ui

      # Differential CLI tests require the real native ripgrep binary.
      - name: Install native ripgrep for the differential CLI suites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      # Chromium must be installed before the unit suite: tests/scripts/rc-light-web-browser.test.ts
      # launches a real Chromium, and the Account layout regression reuses the same install.
      - name: Install Chromium for browser-backed unit and layout regressions
        run: bunx playwright install --with-deps chromium

      - name: Node release and tooling tests
        run: node --test tests/scripts/*.node-test.cjs tests/scripts/*.node-test.mjs

      - name: Unit tests
        run: bun run test:run

      # The audit's N19: the Bun-only tests (tests/bun/** and every file importing bun:test)
      # are excluded from vitest, so they need their own gate or they silently rot.
      - name: Bun-only tests
        run: bun run test:bun

      - name: Account document and App auth-window layout regression
        run: bun run test:account-layout

      - name: Upload Account layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-layout-${{ github.sha }}
          path: .test-data/account-web-layout/
          include-hidden-files: true

  integration-lite:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build runtime artifacts
        run: bun run build:ts && bun run build:components

      - name: Lite integration tests
        run: bun run test:integration:lite

  bun-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: API CSS and physical module tests on their actual runners
        run: bun run test:modules

      - name: Bun runtime smoke
        if: ${{ !cancelled() }}
        run: bun run test:bun:runtime

  integration-full:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build runtime artifacts
        run: bun run build:ts && bun run build:components

      - name: Full integration tests
        run: bun run test:integration:full

  publication-control:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dedicated staging publication control route
        env:
          CONTROL_EVENT: ${{ github.event_name }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_OPERATION: ${{ inputs.operation }}
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_MODE: ${{ inputs.mode }}
          CONTROL_COORDINATES: ${{ inputs.producer_coordinates }}
        run: node scripts/lib/publication-control-input.cjs

  independent-publication:
    name: independent-publication
    needs: publication-control
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.operation == 'independent-publication' && (inputs.mode == 'prepare' || inputs.mode == 'publish') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/independent-publication.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      producer_coordinates: ${{ inputs.producer_coordinates }}
      mode: ${{ inputs.mode }}
    secrets:
      NPM_TOKEN: ${{ inputs.mode == 'publish' && secrets.NPM_TOKEN || '' }}
