name: Module installed consumer preparation

# Explicit candidate tuples only. No publication or automatic producer chaining.
on:
  pull_request:
    branches: [staging, main]
    paths:
      - '.github/workflows/module-installed-consumer.yml'
      - '.github/workflows/independent-archive-consumer.yml'
      - '.github/workflows/independent-registry-consumer.yml'
      - 'scripts/prepare-module-consumer-plan.ts'
      - 'scripts/api-module-consumer.py'
      - 'scripts/css-module-consumer.py'
      - 'scripts/lib/module-consumer.py'
      - 'scripts/lib/afs-module-consumer.py'
      - 'scripts/lib/afs-consumer-budget.json'
      - 'scripts/lib/afs-consumer-budget.cjs'
      - 'scripts/lib/consumer-workflow-budget.cjs'
      - 'tests/bun/independent-consumer-workflow-budget.test.ts'
      - 'scripts/lib/module-consumer-targets.py'
      - 'scripts/verify-module-consumer-native.ts'
      - 'scripts/module-product-targets.ts'
      - 'packages/xpod-cli/src/module-catalog.ts'
      - 'tests/bun/module-consumer-targets.test.ts'
      - 'tests/bun/api-module-consumer.test.ts'
      - 'tests/bun/css-module-consumer.test.ts'
      - 'scripts/lib/physical-module-native.ts'
      - 'scripts/export-module-consumer-evidence.ts'
      - 'tests/scripts/module-installed-consumer-workflow.node-test.cjs'
      - 'tests/bun/prepare-module-consumer-plan.test.ts'
      - 'tests/bun/export-module-consumer-evidence.test.ts'
      - 'docs/module-consumer-ci.md'
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Explicit target + exact CSS, API or AFS and normal CLI acquisition tuples at one actual source SHA; see docs/module-consumer-ci.md'
        required: true
        type: string
      execute_consumer:
        description: 'Explicitly run the selected public module consumer sequentially for Node and Bun after validation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: node --test tests/scripts/module-installed-consumer-workflow.node-test.cjs
      - run: bun test tests/bun/independent-consumer-workflow-budget.test.ts
  select:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      module: ${{ steps.target.outputs.module }}
      afs_job_minutes: ${{ steps.budget.outputs.afs_job_minutes }}
      afs_command_minutes: ${{ steps.budget.outputs.afs_command_minutes }}
      afs_setup_minutes: ${{ steps.budget.outputs.afs_setup_minutes }}
      afs_upload_minutes: ${{ steps.budget.outputs.afs_upload_minutes }}
      afs_export_minutes: ${{ steps.budget.outputs.afs_export_minutes }}
      afs_finalization_minutes: ${{ steps.budget.outputs.afs_finalization_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - id: target
        env:
          MODULE_CONSUMER_REQUEST: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          bun --eval '
            import { productTarget } from "./scripts/module-product-targets.ts";
            import { appendFileSync } from "node:fs";
            const request = JSON.parse(process.env.MODULE_CONSUMER_REQUEST);
            if (typeof request.target !== "string") throw Error("Explicit target required");
            const target = productTarget(request.module, request.target);
            if (!target.nativeSourceAvailable) throw Error("Target native source is pending");
            appendFileSync(process.env.GITHUB_OUTPUT, `runner=${target.runner}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `module=${request.module}\n`);
          '
      - id: budget
        name: Project the fixed AFS preparation windows
        env:
          CONSUMER_BUDGET_MODULE: ${{ steps.target.outputs.module }}
          CONSUMER_BUDGET_STAGE: prepublish
          CONSUMER_BUDGET_FLOW: module-installed
        run: bun scripts/lib/consumer-workflow-budget.cjs

  prepare:
    needs: select
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_job_minutes) || 30 }}
    steps:
      - name: Start the bounded AFS setup clock
        if: ${{ needs.select.outputs.module == 'afs' }}
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV,"AFS_WORKFLOW_SETUP_STARTED_NS="+process.hrtime.bigint()+"\n")'
      - uses: actions/checkout@v4
        with:
          path: tools
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare and verify Linux source isolation
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev --cap-drop ALL -- /usr/bin/true
      - name: Install tool dependencies without building products
        timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_setup_minutes) || 30 }}
        working-directory: tools
        run: |
          set -euo pipefail
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 12 * 1024**3, "insufficient disk for preparation tools"'
          bun install --frozen-lockfile --ignore-scripts
      - name: Validate explicit selectors before acquisition
        id: request
        working-directory: tools
        env:
          MODULE_CONSUMER_REQUEST: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          bun --eval '
            import { validateModuleConsumerRequest } from "./scripts/prepare-module-consumer-plan.ts";
            import { appendFileSync } from "node:fs";
            const request = JSON.parse(process.env.MODULE_CONSUMER_REQUEST);
            validateModuleConsumerRequest(request);
            appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${request.sourceSha}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `module=${request.module}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `target=${request.target}\n`);
          '
      - uses: actions/checkout@v4
        with:
          path: product-source
          ref: ${{ steps.request.outputs.source_sha }}
          persist-credentials: false
      - name: Require the actual AFS setup to fit its host envelope
        if: ${{ needs.select.outputs.module == 'afs' }}
        working-directory: tools
        env:
          CONSUMER_BUDGET_MODULE: ${{ needs.select.outputs.module }}
          CONSUMER_BUDGET_STAGE: prepublish
          CONSUMER_BUDGET_CHECK_SETUP: 'true'
        run: node scripts/lib/consumer-workflow-budget.cjs
      - name: Acquire originals and prepare an exact consumer plan
        timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_command_minutes) || 30 }}
        id: plan
        working-directory: tools
        env:
          MODULE_CONSUMER_REQUEST: ${{ inputs.request_json }}
          GH_TOKEN: ${{ github.token }}
          EXECUTE_CONSUMER: ${{ inputs.execute_consumer }}
          MODULE_CONSUMER_MODULE: ${{ steps.request.outputs.module }}
        run: |
          set -euo pipefail
          case "$MODULE_CONSUMER_MODULE" in
            css) driver=scripts/css-module-consumer.py ;;
            api) driver=scripts/api-module-consumer.py ;;
            afs) driver=scripts/lib/afs-module-consumer.py ;;
            *) echo 'Unsupported module' >&2; exit 1 ;;
          esac
          test -f "$driver"
          root="$(mktemp -d "$RUNNER_TEMP/xpod-module-consumer.XXXXXXXX")"
          chmod 700 "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          export MODULE_CONSUMER_ROOT="$root"
          export MODULE_CONSUMER_NODE="$(command -v node)"
          export MODULE_CONSUMER_BUN="$(command -v bun)"
          bun --eval '
            import { writeFileSync, statfsSync } from "node:fs";
            import path from "node:path";
            const request = JSON.parse(process.env.MODULE_CONSUMER_REQUEST);
            const root = process.env.MODULE_CONSUMER_ROOT;
            const disk = statfsSync(root);
            const needed = request.budget.estimatedPeakBytes + request.budget.remainingFloorBytes + request.budget.cushionBytes + 6 * 1024 ** 3;
            if (!Number.isSafeInteger(needed) || disk.bavail * disk.bsize < needed) throw new Error("insufficient disk before acquisition");
            const workspace = path.resolve("..");
            const input = { ...request, checkout: path.join(workspace,"product-source"), sourceRoots: [path.join(workspace,"tools"),path.join(workspace,"product-source")], node:process.env.MODULE_CONSUMER_NODE, bun:process.env.MODULE_CONSUMER_BUN, temporaryParent:root, output:path.join(root,"consumer-results") };
            writeFileSync(path.join(root,"request.json"), JSON.stringify(input,null,2)+"\n", {flag:"wx",mode:0o600});
          '
          bun scripts/prepare-module-consumer-plan.ts "$root/request.json" "$root/consumer-plan.json"
          python3 "$driver" "$root/consumer-plan.json" > "$root/validation.json"
          if [ "$EXECUTE_CONSUMER" = true ]; then
            python3 "$driver" "$root/consumer-plan.json" --run > "$root/consumer.stdout.json"
          fi
      - name: Record execution boundary
        timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_finalization_minutes) || 30 }}
        if: ${{ always() }}
        env:
          EXECUTE_CONSUMER: ${{ inputs.execute_consumer }}
        run: |
          if [ "$EXECUTE_CONSUMER" = true ]; then
            echo 'Public consumer execution requested. Inspect actual consumer results and phase closure; a requested run does not establish a passing run or registry/native/legal/release admission.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Preparation and driver validation only. The public consumer was not executed. Artifact custody, source binding and validation do not establish registry/native/legal/release admission.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export bounded closed evidence without product archives or retained data
        timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_export_minutes) || 30 }}
        if: ${{ always() && steps.plan.outputs.root != '' }}
        working-directory: tools
        env:
          MODULE_CONSUMER_ROOT: ${{ steps.plan.outputs.root }}
        run: bun scripts/export-module-consumer-evidence.ts "$MODULE_CONSUMER_ROOT" "$MODULE_CONSUMER_ROOT/safe-evidence"
      - uses: actions/upload-artifact@v4
        timeout-minutes: ${{ needs.select.outputs.module == 'afs' && fromJSON(needs.select.outputs.afs_upload_minutes) || 30 }}
        if: ${{ always() && steps.plan.outputs.root != '' }}
        with:
          name: module-consumer-preparation-${{ steps.request.outputs.module }}-${{ steps.request.outputs.target }}-${{ steps.request.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.root }}/safe-evidence/
          if-no-files-found: error
          retention-days: 7
