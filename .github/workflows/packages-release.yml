name: Publish Packages

# This workflow can only be called after the root stable promotion guard.
# Individual package tags and manual dispatch must not bypass candidate acceptance.
on:
  workflow_call:
    inputs:
      accepted-sha:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted-sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Verify publication contracts
        run: node --test tests/scripts/workspace-package-consumer.node-test.cjs
      - name: Stage, verify clean consumers, and promote shared packages
        run: node scripts/publish-workspace-packages.cjs
        env:
          XPOD_ACCEPTED_SHA: ${{ inputs.accepted-sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
