name: Publish Packages

on:
  push:
    tags:
      - 'solid-sdk-v*'
      - 'shared-ui-v*'
      - 'extension-sdk-v*'
      - 'ai-connections-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -d "packages/${NAME}" ]; then
            echo "Unknown package tag: ${TAG}"
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/${{ steps.pkg.outputs.name }}/package.json').version")"
          if [ "${{ steps.pkg.outputs.version }}" != "$PACKAGE_VERSION" ]; then
            echo "Tag version (${{ steps.pkg.outputs.version }}) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Build package
        working-directory: packages/${{ steps.pkg.outputs.name }}
        run: bun run build

      - name: Test package
        run: npx vitest run --config vitest.packages.config.mts --passWithNoTests packages/${{ steps.pkg.outputs.name }}

      - name: Publish to npm
        working-directory: packages/${{ steps.pkg.outputs.name }}
        run: bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
