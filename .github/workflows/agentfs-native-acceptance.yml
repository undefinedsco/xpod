name: AgentFS native source-bound acceptance

on:
  push:
    branches: [codex/agentfs-native-acceptance]

permissions:
  contents: read

concurrency:
  group: agentfs-native-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.1
      - name: Linux compiler system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config liblzma-dev libssl-dev build-essential ca-certificates git unzip
      - name: Lightweight supervisor regression
        run: python3 tests/scripts/agentfs_native_ci_test.py -v
      - name: Official export, offline rebuild, package and extracted install gate
        run: python3 scripts/agentfs-native-ci/accept.py
      - name: Retain closed gate evidence and new archive only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentfs-native-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/*.receipt.json
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/*.raw.log
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/native-build.log
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/native-test.log
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/native-receipt.json
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/source-kit.json
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/final.json
            ${{ runner.temp }}/agentfs-native-acceptance/evidence/xpod-cli-*.tar.gz
