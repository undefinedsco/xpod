name: Release Desktop

# The macOS desktop is released separately from the service. release.yml calls
# this after production deploys when the accepted candidate also holds desktop
# evidence; a maintainer can dispatch it later (on the stable tag ref) once the
# same candidate's desktop acceptance has passed, e.g. after re-running it.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      candidate_run_id:
        type: string
        required: true
      source_desktop_run_id:
        description: 'Retained desktop media to re-accept instead of rebuilding'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag already promoted for the service, e.g. v0.4.31 (run this workflow on that tag)'
        type: string
        required: true
      candidate_run_id:
        description: 'Release Candidate run that accepted the service for the tag commit'
        type: string
        required: true
      source_desktop_run_id:
        description: 'Optional: an existing run whose already-built desktop media is re-accepted instead of rebuilt'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  desktop_guard:
    name: Validate accepted desktop candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      image_digest: ${{ steps.guard.outputs.image_digest }}
      candidate_version: ${{ steps.guard.outputs.candidate_version }}
      candidate_run_id: ${{ steps.guard.outputs.candidate_run_id }}
      source_sha: ${{ steps.guard.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retry transient GitHub API failures in this job
        # Only when the checked-out source ships the shim (older stable tags do not).
        run: if [ -f scripts/install-gh-retry.sh ]; then bash scripts/install-gh-retry.sh; fi
      - name: Validate tag, accepted candidate and production promotion
        id: guard
        run: |
          set -euo pipefail
          # The workflow runner ref may carry a reviewed CI repair; the product
          # source is always the immutable stable tag commit. Resolve that tag
          # explicitly and hand ONLY it to the guard and downstream build.
          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$TAG_NAME" =~ $TAG_REGEX ]]; then
            echo "::error::release tag must be stable vX.Y.Z"
            exit 1
          fi
          if ! SOURCE_SHA="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"; then
            echo "::error::stable tag ${TAG_NAME} does not resolve to a commit"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the immutable tag commit"
            exit 1
          fi
          node scripts/desktop-release-guard.cjs \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG_NAME" --sha "$SOURCE_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" --work-dir "$RUNNER_TEMP/desktop-guard" \
            >> "$GITHUB_OUTPUT"

  build_desktop_macos:
    name: Build macOS desktop release
    needs: desktop_guard
    runs-on: macos-15
    environment: rc
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.desktop_guard.outputs.version }}
      CANDIDATE_RUN_ID: ${{ needs.desktop_guard.outputs.candidate_run_id }}
      XPOD_ACCEPTED_SHA: ${{ needs.desktop_guard.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT: ${{ github.workspace }}/.test-data/qlever-runtime/qlever-local-runtime-darwin-arm64.tar.gz
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      REUSE_MEDIA: ${{ inputs.source_desktop_run_id != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.desktop_guard.outputs.source_sha }}
          fetch-depth: 0
      - name: Retry transient GitHub API failures in this job
        # Only when the checked-out source ships the shim (older stable tags do not).
        run: if [ -f scripts/install-gh-retry.sh ]; then bash scripts/install-gh-retry.sh; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Acceptance-only redos reuse immutable media instead of rebuilding. The
      # producer may have failed LATER acceptance steps; packaging, payload
      # verification and the media upload must still have succeeded. Product
      # source is always the stable tag commit, never the runner ref.
      # The shared `bun install --frozen-lockfile` + `bun run build:packages`
      # steps further below are UNCONDITIONAL and serve both paths, so acceptance
      # resolves workspace `exports` -> dist on a cold runner. No second install
      # and no second build:packages is performed for reuse.

      # The retention helper is reviewed CI repair code, not part of the accepted
      # product tag. Check the runner ref out separately at the workflow's own SHA
      # so the product checkout stays the tag commit.
      #
      # It MUST land under the existing ignored .test-data/ tree: the exact-source
      # guard rejects any untracked path outside its fixed allowlist, and a
      # top-level .ci-repair directory would make the product checkout look dirty
      # and block the permission stage. The path is not added to .gitignore and
      # the verifier is not relaxed.
      - name: Check out reviewed retention tooling from the runner ref
        if: env.REUSE_MEDIA == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .test-data/desktop-retention-tooling

      # Failure diagnostics live in reviewed CI code, never in the accepted tag:
      # the product checkout stays the immutable tag commit, and this small tree
      # lands under the already ignored .test-data/ so the exact-source guard is
      # unaffected. It is always present because it must exist BEFORE the
      # self-update step runs (the failure is only known afterwards).
      - name: Check out reviewed CI diagnostics from the runner ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .test-data/ci-diagnostics
          persist-credentials: false

      - name: Retain already-built desktop media for re-acceptance
        if: env.REUSE_MEDIA == 'true'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_desktop_run_id }}
          EXPECTED_TAG: ${{ needs.desktop_guard.outputs.tag }}
          EXPECTED_SHA: ${{ needs.desktop_guard.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.desktop_guard.outputs.version }}
          DESTINATION: ${{ github.workspace }}/desktop/release
          RECEIPT: ${{ runner.temp }}/desktop-media-retention.json
          WORK_DIR: ${{ runner.temp }}/desktop-media-retention-work
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/.test-data/desktop-retention-tooling/scripts/diagnostics/retain-desktop-release-media.py"
          test -f "$helper"
          python3 "$helper"
          cp "$RECEIPT" "$RUNNER_TEMP/desktop-media-retention.receipt.json"

      # Publish the EXACT retained bytes under the standard media artifact name in
      # THIS run, so the unchanged release job consumes this run's own artifact.
      # The release job keeps downloading by name from github.run_id and needs no
      # cross-run lookup, no extra actions:read and no attempt ambiguity.
      - uses: actions/upload-artifact@v4
        if: env.REUSE_MEDIA == 'true'
        with:
          name: xpod-desktop-macos-${{ needs.desktop_guard.outputs.version }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.REUSE_MEDIA == 'true'
        with:
          name: desktop-media-retention-${{ needs.desktop_guard.outputs.source_sha }}
          path: ${{ runner.temp }}/desktop-media-retention.receipt.json
          if-no-files-found: error
          retention-days: 30

      # Retain the ORIGINAL accepted QLever artifact through the SAME shared
      # acquisition contract the RC and diagnostic paths use. The accepted
      # candidate RUN and the accepted SHA are the identity breadth: the helper
      # selects exactly ONE nonexpired artifact named
      # qlever-local-runtime-darwin-arm64-<accepted sha> inside that run, then
      # validates metadata source/id/digest and the ZIP SHA before retaining the
      # untouched original. No latest-run lookup and no native recompile.
      - name: Retain the accepted original QLever artifact without rebuilding
        if: env.REUSE_MEDIA != 'true'
        env:
          QLEVER_ARTIFACT_SOURCE_RUN_ID: ${{ needs.desktop_guard.outputs.candidate_run_id }}
          QLEVER_SOURCE_SHA: ${{ needs.desktop_guard.outputs.source_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/retain-qlever-materials.py
          test -s "$XPOD_QLEVER_LOCAL_RUNTIME_ARTIFACT"

      - run: bun install --frozen-lockfile


      # Same prerequisite as the RC desktop job: desktop contracts and the
      # staged native producer import workspace package SOURCE that resolves
      # @undefineds.co/xpod-client through `exports` -> dist/*, absent on a cold
      # runner. The acceptance path imports the same exported dist, so this build
      # is UNCONDITIONAL and shared by both paths (exactly one install + one build).
      - name: Build workspace packages required by the desktop contracts
        run: bun run build:packages

      - name: Produce the API capability from clean source
        if: env.REUSE_MEDIA != 'true'
        run: |
          set -euo pipefail
          XPOD_API_CAPABILITY_ROOT="$PWD/.test-data/api-capability-$(git rev-parse HEAD)"
          echo "XPOD_API_CAPABILITY_ROOT=$XPOD_API_CAPABILITY_ROOT" >> "$GITHUB_ENV"
          bun -e 'import { prepareApiCapability } from "./desktop/scripts/api-capability-producer.ts"; prepareApiCapability({ repoRoot: process.cwd() });'
          test -d "$XPOD_API_CAPABILITY_ROOT"

      # Restore root declarations after filtered API production, before stamping
      # or compiling the root package. The finalized API receipt/archive is retained.
      - name: Restore the normal full-frozen root dependency tree
        if: env.REUSE_MEDIA != 'true'
        run: bun scripts/restore-root-dependencies.ts "$PWD"
      # Bun skips Electron's postinstall during the canonical root install, and the
      # restore above replaces node_modules, so the vendor binary is initialized
      # exactly once AFTER the final tree exists.
      - name: Bootstrap the Electron vendor binary
        if: env.REUSE_MEDIA != 'true'
        run: node node_modules/electron/install.js


      # Failure evidence only: the producer already writes its own receipt and
      # evidence/ before exiting, so retain those narrow members (never a
      # workspace/source/env dump). Diagnostic artifact, not qualification.
      - name: Upload failed API preparation diagnostics separately
        if: failure() && env.XPOD_API_CAPABILITY_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: api-capability-diagnostics-release-${{ needs.desktop_guard.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.XPOD_API_CAPABILITY_ROOT }}/producer.receipt.json
            ${{ env.XPOD_API_CAPABILITY_ROOT }}/evidence/
            ${{ env.XPOD_API_CAPABILITY_ROOT }}/originals/prepare-inputs.receipt.safe.json
          if-no-files-found: warn
          retention-days: 30


      # API production above requires the exact clean tag checkout. Only after
      # it closes, apply the same allowed manifest transform used by RC builds.
      # The root manifest is authoritative; desktop/package.json is derived.
      - name: Apply and validate stable desktop version
        if: env.REUSE_MEDIA != 'true'
        run: |
          node -e '
            const root = require("./package.json");
            if (root.version !== process.env.RELEASE_VERSION) {
              throw new Error(`root version ${root.version} does not match ${process.env.RELEASE_VERSION}`);
            }
            require("./scripts/release-candidate.cjs").applyRootVersion(process.cwd(), root.version);
            const desktop = require("./desktop/package.json");
            if (desktop.version !== process.env.RELEASE_VERSION) {
              throw new Error(`desktop version ${desktop.version} does not match ${process.env.RELEASE_VERSION}`);
            }
          '

      # M1 (cold runner): this desktop job has no root build, but the desktop
      # native producer hard-requires dist/index.js + dist/components/
      # components.jsonld. Compile them explicitly BEFORE the DMG/ZIP build.
      - name: Compile root package outputs required by the desktop native producer
        if: env.REUSE_MEDIA != 'true'
        run: |
          set -euo pipefail
          bun run build:ts
          bun run build:components
          test -s dist/runtime/index.js
          test -s dist/components/components.jsonld

      - name: Build DMG and ZIP
        if: env.REUSE_MEDIA != 'true'
        working-directory: desktop
        run: |
          set -euo pipefail
          bun x --no-install tsc --noEmit -p tsconfig.scripts.json
          bun run dist
          test -d release/mac-arm64/Xpod.app
          find release -maxdepth 1 -type f -name '*-mac.zip' -print -quit | grep -q .
          # The in-app updater reads this feed, so a release without it cannot be offered as an
          # update (update.electronjs.org looks for latest-mac.yml among the release assets).
          test -s release/latest-mac.yml

      - name: Verify packaged version and native runtime payload
        if: env.REUSE_MEDIA != 'true'
        run: |
          set -euo pipefail
          app="desktop/release/mac-arm64/Xpod.app"
          runtime="$app/Contents/Resources/runtime/qlever/bin/xpod_qlever_local_runtime"
          actual="$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)"
          [[ "$actual" == "$RELEASE_VERSION" ]]
          test -x "$runtime"
          test -s "$app/Contents/Resources/runtime/qlever/manifest.json"

      # Retain the verified build before acceptance so a later failure preserves
      # its original bytes. Publication still requires this whole job to succeed.
      - uses: actions/upload-artifact@v4
        if: env.REUSE_MEDIA != 'true'
        with:
          name: xpod-desktop-macos-${{ needs.desktop_guard.outputs.version }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Accept actual stable packaged desktop permissions and operations
        run: |
          set -euo pipefail
          new_zip="$(find "$PWD/desktop/release" -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          test -n "$new_zip"
          bun scripts/accept-packaged-desktop-permissions.ts \
            --archive "$new_zip" \
            --version "$RELEASE_VERSION" \
            --source-sha "$XPOD_ACCEPTED_SHA" \
            --issuer "https://id.undefineds.co/" \
            --private-directory "${RUNNER_TEMP}/desktop-permission-private" \
            --evidence "${RUNNER_TEMP}/desktop-permission-evidence.json"

      - name: Accept stable self-update and verify the combined desktop contract
        run: |
          set -euo pipefail
          accepted_evidence="${RUNNER_TEMP}/accepted-desktop-update"
          gh run download "$CANDIDATE_RUN_ID" \
            -n "desktop-self-update-acceptance-${XPOD_ACCEPTED_SHA}" -D "$accepted_evidence"
          old_tag="$(node -e 'const e=require(process.argv[1]); if (!/^v\d+\.\d+\.\d+$/.test(e.oldReleaseTag)) process.exit(1); process.stdout.write(e.oldReleaseTag)' "$accepted_evidence/desktop-self-update-evidence.json")"
          dest="${RUNNER_TEMP}/stable-old-desktop"
          mkdir -p "$dest"
          gh release download "$old_tag" --repo "${{ github.repository }}" \
            --pattern '*-arm64-mac.zip' --dir "$dest"
          old_zip="$(find "$dest" -maxdepth 1 -type f -name '*-arm64-mac.zip' -print -quit)"
          test -n "$old_zip"
          unzip -q "$old_zip" -d "$dest/unpacked"
          old_app="$(find "$dest/unpacked" -type d -name 'Xpod.app' -print -quit)"
          new_zip="$(find "$PWD/desktop/release" -maxdepth 1 -type f -name '*-mac.zip' -print -quit)"
          test -n "$old_app"
          test -n "$new_zip"
          # The real helper is unchanged and still owns its private userData
          # cleanup; the wrapper only snapshots four small allowlisted facts
          # (events, version marker, install marker, installer log) while it runs,
          # so a failure names its stage instead of a bare compound timeout.
          node "$GITHUB_WORKSPACE/.test-data/ci-diagnostics/scripts/diagnostics/capture-self-update-diagnostics.mjs" \
            --snapshot-dir "${RUNNER_TEMP}/desktop-selfupdate-diagnostics" \
            -- desktop/scripts/packaged-update-acceptance.mjs \
            --old "$old_app" --old-zip "$old_zip" --old-release-tag "$old_tag" \
            --new-zip "$new_zip" --version "$RELEASE_VERSION" \
            --source-sha "$XPOD_ACCEPTED_SHA" --timeout 180000 \
            --evidence-out "${RUNNER_TEMP}/desktop-self-update-evidence.json"
          node scripts/desktop-acceptance.cjs \
            --self-update-evidence "${RUNNER_TEMP}/desktop-self-update-evidence.json" \
            --permission-evidence "${RUNNER_TEMP}/desktop-permission-evidence.json" \
            --source-sha "$XPOD_ACCEPTED_SHA" --version "$RELEASE_VERSION" \
            --expected-archive "$new_zip" --checks-out "${RUNNER_TEMP}/desktop-check.json"

      - name: Upload allowlisted stable desktop acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-stable-acceptance-${{ needs.desktop_guard.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/desktop-self-update-evidence.json
            ${{ runner.temp }}/desktop-permission-evidence.json
            ${{ runner.temp }}/desktop-check.json
            ${{ runner.temp }}/desktop-media-retention.receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload stable desktop permission failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-permission-failure-${{ needs.desktop_guard.outputs.source_sha }}
          path: ${{ runner.temp }}/desktop-permission-private/failure-safe.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal private desktop permission diagnostics
        if: failure()
        env:
          XPOD_DIAGNOSTICS_PUBLIC_KEY: ${{ vars.XPOD_DIAGNOSTICS_PUBLIC_KEY }}
        run: |
          node scripts/sealed-diagnostics.cjs seal \
            --in "${RUNNER_TEMP}/desktop-permission-private" \
            --in "${RUNNER_TEMP}/desktop-selfupdate-diagnostics" \
            --out "${RUNNER_TEMP}/desktop-permission-sealed/diagnostics.sealed"
      - name: Remove the private self-update snapshot
        # ALWAYS: the snapshot is this run's own private temp data, and it must be
        # removed even when the job succeeded or when sealing was skipped (for
        # example a cancelled or timed-out run). Cleanup never gates the artifact.
        if: always()
        run: |
          set -euo pipefail
          chmod -R u+w "${RUNNER_TEMP}/desktop-selfupdate-diagnostics" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/desktop-selfupdate-diagnostics"
      - name: Upload sealed desktop permission diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-permission-sealed-${{ needs.desktop_guard.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-permission-sealed/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 14

  create_github_release:
    name: Create GitHub Release
    needs:
      - desktop_guard
      - build_desktop_macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.desktop_guard.outputs.tag }}
      RELEASE_VERSION: ${{ needs.desktop_guard.outputs.version }}
      ACCEPTED_IMAGE_DIGEST: ${{ needs.desktop_guard.outputs.image_digest }}
      CANDIDATE_VERSION: ${{ needs.desktop_guard.outputs.candidate_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xpod-desktop-macos-${{ needs.desktop_guard.outputs.version }}
          path: ${{ runner.temp }}/desktop-release

      - name: Create release after production deploy
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Promoted accepted release candidate `%s`.\n\n' "$CANDIDATE_VERSION"
            printf 'Container digest: `%s`\n' "$ACCEPTED_IMAGE_DIGEST"
          } > "$notes_file"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Xpod ${RELEASE_VERSION}" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "Xpod ${RELEASE_VERSION}" \
              --notes-file "$notes_file"
          fi

          mapfile -t desktop_assets < <(find "$RUNNER_TEMP/desktop-release" -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print)
          if [[ "${#desktop_assets[@]}" -eq 0 ]]; then
            echo "::error::desktop release assets are missing"
            exit 1
          fi
          for asset in "${desktop_assets[@]}"; do
            if [[ "$(basename "$asset")" == 'latest-mac.yml' ]]; then
              have_feed=1
            fi
          done
          if [[ "${have_feed:-0}" -ne 1 ]]; then
            echo "::error::desktop release is missing latest-mac.yml, so the in-app updater cannot see it"
            exit 1
          fi
          gh release upload "$TAG_NAME" "${desktop_assets[@]}" --clobber
