name: Publish QLever runtime SDK image

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact public xpod source commit to build
        required: false
        type: string
      runtime_sdk_tag:
        description: Reuse an existing immutable SDK tag instead of building
        required: false
        type: string
      prior_runtime_sdk_digest:
        description: Prior SDK digest for an incremental rebuild
        required: false
        type: string
  workflow_call:
    inputs:
      source_commit:
        description: Exact public xpod source commit to build
        required: false
        type: string
      runtime_sdk_tag:
        description: Reuse an existing immutable SDK tag instead of building
        required: false
        type: string
      prior_runtime_sdk_digest:
        description: Prior SDK digest for an incremental rebuild
        required: false
        type: string
    outputs:
      image:
        description: Runtime SDK image reference pinned by digest
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Published OCI manifest digest
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: Immutable sha-* tag used for the SDK
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: qlever-runtime-sdk-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false

env:
  SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/xpod-qlever-sdk

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_commit="${REQUESTED_SOURCE_COMMIT:-${GITHUB_SHA}}"
          [[ "${source_commit}" =~ ^[a-f0-9]{40}$ ]] \
            || { echo 'source_commit must be a 40-character lowercase commit SHA' >&2; exit 64; }
          echo "commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Check out the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Verify runtime SDK source and fixture contracts
        run: |
          python3 qlever/scripts/verify-lock.py
          python3 -m unittest qlever.tests.test_qlever_runtime_sdk_contract
          python3 -m unittest qlever.tests.test_verify_lock
          python3 -m unittest qlever.tests.test_resolve_runtime_sdk_build
          bun test \
            qlever/tests/QleverIdCodec.test.ts \
            qlever/tests/QleverPhysicalBackendFacade.test.ts \
            qlever/tests/QleverPhysicalTermSyntax.test.ts \
            qlever/tests/QleverRealRuntimeBuildScript.test.ts
          bun test \
            qlever/tests/QleverAdapterOverlayContract.test.ts \
            qlever/tests/QleverInternalSortIdentityContract.test.ts \
            qlever/tests/QleverUpstream*Patch.test.ts \
            qlever/tests/QleverNativeSemanticShapes.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SDK build mode
        id: resolve
        shell: bash
        env:
          REQUESTED_SDK_TAG: ${{ inputs.runtime_sdk_tag }}
          PRIOR_SDK_DIGEST: ${{ inputs.prior_runtime_sdk_digest }}
          SDK_IMAGE: ${{ env.SDK_IMAGE }}
          XPOD_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash qlever/scripts/resolve-runtime-sdk-build.sh

      - name: Persist the runtime SDK compiler cache
        if: steps.resolve.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          target: build
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=qlever-runtime-sdk
          cache-to: type=gha,mode=max,scope=qlever-runtime-sdk
          build-args: |
            XPOD_QLEVER_BUILD_JOBS=2
            XPOD_QLEVER_PRIOR_SDK_IMAGE=${{ steps.resolve.outputs.prior_image }}

      - name: Build the exact runtime SDK image
        if: steps.resolve.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SDK_IMAGE }}:${{ steps.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=qlever-runtime-sdk
          cache-to: type=gha,mode=max,scope=qlever-runtime-sdk
          build-args: |
            XPOD_QLEVER_BUILD_JOBS=2
            XPOD_QLEVER_PRIOR_SDK_IMAGE=${{ steps.resolve.outputs.prior_image }}

      - name: Smoke the exact SDK image before publishing
        if: steps.resolve.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh \
            "${SDK_IMAGE}:${{ steps.resolve.outputs.tag }}" -ceu '
              test -f /opt/qlever-sdk/source/src/libqlever/Qlever.h
              test -f /opt/qlever-sdk/build/.xpod-build-identity
              test -f /opt/qlever-sdk/build/.xpod-build-contract.json
              test -f /opt/qlever-sdk/build/CMakeFiles/qlever-server.dir/link.txt
              test -d /components/qlever/cmake
              test -d /components/qlever/qlever_adapter
              test -d /components/qlever/rdf_protocol
              test -d /components/qlever/backend_contract
              test -d /components/qlever/candidate_contract
              test -f /components/qlever/scripts/check-qlever-real-runtime.cjs
              test ! -e /components/qlever/qlever_pg_extension
              test ! -e /components/pg-rdf-extension
            '

      - name: Publish and resolve the immutable digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          tag="${SDK_IMAGE}:${{ steps.resolve.outputs.tag }}"
          if [[ "${{ steps.resolve.outputs.build }}" == "true" ]]; then
            docker push "${tag}"
          fi
          digest="$(docker buildx imagetools inspect "${tag}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image=${SDK_IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record the SDK image
        shell: bash
        run: |
          {
            echo '## QLever runtime SDK image'
            echo
            echo '${{ steps.publish.outputs.image }}'
          } >> "${GITHUB_STEP_SUMMARY}"
