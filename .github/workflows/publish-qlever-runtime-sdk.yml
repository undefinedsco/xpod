name: Publish QLever runtime SDK image

on:
  pull_request:
    # The readonly entry qualifies its own scripts and workflow changes.
    # Run this wrapper's PR qualification when its own wiring changes.
    paths:
      - '.github/workflows/publish-qlever-runtime-sdk.yml'
  workflow_dispatch:
    inputs:
      readonly_executor:
        description: Use the separately reviewed module readonly executor route
        type: boolean
        default: false
      sdk_profile:
        description: Declared SDK and runtime ABI profile
        type: string
        default: service-trixie
      target:
        description: Native Linux target; the default preserves the existing service image
        type: string
        default: linux-x64
      source_commit:
        description: Exact public xpod source commit to build
        required: false
        type: string
      runtime_sdk_tag:
        description: Reuse an existing immutable SDK tag instead of building
        required: false
        type: string
      prior_runtime_sdk_digest:
        description: Prior SDK digest for an incremental rebuild
        required: false
        type: string
  workflow_call:
    inputs:
      readonly_executor:
        description: Use the separately reviewed module readonly executor route
        type: boolean
        default: false
      sdk_profile:
        description: Declared SDK and runtime ABI profile
        type: string
        default: service-trixie
      target:
        description: Native Linux target; the default preserves the existing service image
        type: string
        default: linux-x64
      source_commit:
        description: Exact public xpod source commit to build
        required: false
        type: string
      runtime_sdk_tag:
        description: Reuse an existing immutable SDK tag instead of building
        required: false
        type: string
      prior_runtime_sdk_digest:
        description: Prior SDK digest for an incremental rebuild
        required: false
        type: string
    outputs:
      image:
        description: Runtime SDK image reference pinned by digest
        value: ${{ jobs.readonly_publish.outputs.image || jobs.publish.outputs.image }}
      digest:
        description: Published OCI manifest digest
        value: ${{ jobs.readonly_publish.outputs.digest || jobs.publish.outputs.digest }}
      tag:
        description: Immutable sha-* tag used for the SDK
        value: ${{ jobs.readonly_publish.outputs.tag || jobs.publish.outputs.tag }}
      native_artifact_name:
        description: Exact module native material archive name (module profile only)
        value: ${{ jobs.module_runtime_materials.outputs.artifact_name }}
      native_artifact_id:
        description: Exact module native material artifact ID
        value: ${{ jobs.module_runtime_materials.outputs.artifact_id }}
      native_artifact_digest:
        description: Original module native material ZIP digest
        value: ${{ jobs.module_runtime_materials.outputs.artifact_digest }}
      native_source_sha:
        description: Actual native material producing source revision
        value: ${{ jobs.module_runtime_materials.outputs.source_sha }}
      sdk_artifact_id:
        value: ${{ jobs.readonly_publish.outputs.sdk_artifact_id || jobs.publish.outputs.sdk_artifact_id }}
      sdk_artifact_digest:
        value: ${{ jobs.readonly_publish.outputs.sdk_artifact_digest || jobs.publish.outputs.sdk_artifact_digest }}
      sdk_master_sha256:
        value: ${{ jobs.readonly_publish.outputs.sdk_master_sha256 || jobs.publish.outputs.sdk_master_sha256 }}
      sdk_master_bytes:
        value: ${{ jobs.readonly_publish.outputs.sdk_master_bytes || jobs.publish.outputs.sdk_master_bytes }}
      sdk_source_sha:
        description: Actual SDK build source revision (independent of the current app consumer SHA)
        value: ${{ jobs.publish.outputs.sdk_source_sha }}
      sdk_run_head_sha:
        description: Actual SDK build workflow run head revision
        value: ${{ jobs.publish.outputs.sdk_run_head_sha }}
      sdk_run_id:
        description: Actual SDK build run id
        value: ${{ jobs.publish.outputs.sdk_run_id }}
      sdk_run_attempt:
        description: Actual SDK build run attempt
        value: ${{ jobs.publish.outputs.sdk_run_attempt }}
      sdk_build_model:
        description: Explicit SDK build execution model
        value: ${{ jobs.publish.outputs.sdk_build_model }}
      sdk_input_hash:
        description: Canonical 64-hex SDK build input identity
        value: ${{ jobs.publish.outputs.sdk_input_hash }}

permissions:
  contents: read
  packages: write

concurrency:
  group: qlever-runtime-sdk-${{ inputs.sdk_profile || 'service-trixie' }}-${{ inputs.target || 'linux-x64' }}-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false

env:
  # The SDK build is C++ and compile-bound. The standard `ubuntu-24.04` runner
  # reports four CPUs - BuildKit logs them at the start of every build - and the
  # Dockerfile's own default is four as well, so overriding it down to two spent
  # half the machine. Named once here because three build steps pass it and a
  # copy in each is how they would drift.
  XPOD_QLEVER_BUILD_JOBS: '4'

jobs:
  route_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Validate explicit readonly route contract
        shell: bash
        env:
          READONLY_ROUTE: ${{ github.event_name == 'pull_request' || inputs.readonly_executor }}
          SDK_PROFILE: ${{ inputs.sdk_profile || 'service-trixie' }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SOURCE: ${{ inputs.source_commit || github.sha }}
          REQUESTED_TAG: ${{ inputs.runtime_sdk_tag }}
          REQUESTED_PRIOR_DIGEST: ${{ inputs.prior_runtime_sdk_digest }}
        run: |
          set -euo pipefail
          if [[ "$READONLY_ROUTE" == true ]]; then
            [[ "$EVENT_NAME" == pull_request || "$SDK_PROFILE" == module-bookworm-gcc12 || "$SDK_PROFILE" == service-trixie ]] \
              || { echo 'Readonly executor requires an explicit reviewed SDK profile' >&2; exit 64; }
            [[ "$REQUESTED_SOURCE" == "$GITHUB_SHA" && -z "$REQUESTED_TAG" && -z "$REQUESTED_PRIOR_DIGEST" ]] \
              || { echo 'Readonly executor requires same-run source and a fresh build; reuse is forbidden' >&2; exit 64; }
          fi
  resolve_target:
    needs: route_contract
    uses: ./.github/workflows/resolve-qlever-native-target.yml
    with:
      target: ${{ inputs.target || 'linux-x64' }}
      platform: linux
      sdk_profile: ${{ github.event_name == 'pull_request' && 'module-bookworm-gcc12' || inputs.sdk_profile }}
  publish:
    if: ${{ github.event_name != 'pull_request' && !inputs.readonly_executor }}
    needs: resolve_target
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/xpod-qlever-sdk${{ needs.resolve_target.outputs.repository_profile_suffix }}${{ needs.resolve_target.outputs.repository_suffix }}
    runs-on: ${{ needs.resolve_target.outputs.runner }}
    timeout-minutes: 360
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.resolve.outputs.tag }}
      sdk_artifact_id: ${{ steps.normal_emit.outputs.sdk_artifact_id || steps.sdk_upload.outputs.artifact-id }}
      sdk_artifact_digest: ${{ steps.normal_emit.outputs.sdk_artifact_digest || steps.sdk_upload.outputs.artifact-digest }}
      sdk_master_sha256: ${{ steps.normal_emit.outputs.sdk_master_sha256 || steps.sdk_originals.outputs.master_sha256 }}
      sdk_master_bytes: ${{ steps.normal_emit.outputs.sdk_master_bytes || steps.sdk_originals.outputs.master_bytes }}
      sdk_source_sha: ${{ steps.normal_emit.outputs.sdk_source_sha || steps.source.outputs.commit }}
      sdk_run_head_sha: ${{ steps.normal_emit.outputs.sdk_run_head_sha || steps.source.outputs.run_head_sha }}
      sdk_run_id: ${{ steps.normal_emit.outputs.sdk_run_id || github.run_id }}
      sdk_run_attempt: ${{ steps.normal_emit.outputs.sdk_run_attempt || github.run_attempt }}
      sdk_build_model: ${{ steps.normal_emit.outputs.sdk_build_model || 'controller-readonly-v1' }}
      sdk_input_hash: ${{ steps.normal_emit.outputs.sdk_input_hash || steps.sdk_inputs.outputs.input_hash }}
    steps:
      - name: Resolve immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          SDK_PROFILE: ${{ needs.resolve_target.outputs.sdk_profile }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
        run: |
          set -euo pipefail
          source_commit="${REQUESTED_SOURCE_COMMIT:-${GITHUB_SHA}}"
          [[ "${source_commit}" =~ ^[a-f0-9]{40}$ ]] \
            || { echo 'source_commit must be a 40-character lowercase commit SHA' >&2; exit 64; }
          if [[ "$SDK_PROFILE" == module-bookworm-gcc12 && "$source_commit" != "$GITHUB_SHA" ]]; then
            echo 'Module SDK and runtime materials require the same workflow source SHA' >&2
            exit 64
          fi
          echo "commit=${source_commit}" >> "${GITHUB_OUTPUT}"
          echo "deadline=$(( $(date +%s) + 21000 ))" >> "${GITHUB_OUTPUT}"
          identity=$(SDK_SOURCE_COMMIT="$source_commit" python3 -c 'import json,os,pathlib;e=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text());print(json.dumps(dict(sourceSha=os.environ["SDK_SOURCE_COMMIT"],runHeadSha=e.get("pull_request",{}).get("head",{}).get("sha",os.environ["GITHUB_SHA"]),runId=int(os.environ["GITHUB_RUN_ID"]),runAttempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),target=os.environ["SDK_TARGET"],sdkProfile=os.environ["SDK_PROFILE"]),separators=(",",":")))')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "run_head_sha=$(printf '%s' "$identity" | python3 -c 'import json,sys;print(json.load(sys.stdin)["runHeadSha"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Verify the actual native producer host
        env:
          EXPECTED_ARCH: ${{ needs.resolve_target.outputs.arch }}
        run: bun -e 'if(process.platform!=="linux" || process.arch!==process.env.EXPECTED_ARCH) throw Error("Native producer host/target mismatch")'

      # An SDK image is a pure function of these two trees: the QLever sources and
      # patches, and the SDK Dockerfiles. Naming that identity lets a later run with
      # the same inputs reuse the image instead of paying the 36-39 minute cold C++
      # build - and only the same inputs, so reuse cannot change what ships.
      - name: Resolve the QLever build inputs identity
        id: sdk_inputs
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SDK_PROFILE: ${{ needs.resolve_target.outputs.sdk_profile }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
          SDK_PROFILE_IDENTITY: ${{ needs.resolve_target.outputs.sdk_profile_identity }}
          NORMAL_DOCKERFILE: docker/qlever-runtime-sdk/Dockerfile.normal
          PRIOR_SDK_DIGEST: ${{ inputs.prior_runtime_sdk_digest }}
        run: |
          set -euo pipefail
          if [[ "${SDK_PROFILE}" == service-trixie ]]; then
            python3 qlever/scripts/sdk-normal-build-proof.py identity               --source . --source-commit "${SOURCE_COMMIT}"               --profile "${SDK_PROFILE}" --target "${SDK_TARGET}"               --profile-identity "${SDK_PROFILE_IDENTITY}"               --dockerfile "${NORMAL_DOCKERFILE}"               --out "${RUNNER_TEMP}/qlever-normal-input.json"
          else
            inputs_hash="$({ printf '%s\n' '${SDK_PROFILE}:${SDK_TARGET}:${SDK_PROFILE_IDENTITY}'; git rev-parse "${SOURCE_COMMIT}:qlever"; git rev-parse "${SOURCE_COMMIT}:docker/qlever-runtime-sdk"; } | sha256sum | cut -c1-12)"
            echo "tag=qlever-inputs-${inputs_hash}" >> "${GITHUB_OUTPUT}"
          fi
          echo "QLever build inputs: $(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/qlever-normal-input.json"))["inputHash"])' 2>/dev/null || true)" >> "${GITHUB_STEP_SUMMARY}"


      - name: Find the retained normal SDK build proof candidate
        id: normal_proof
        if: ${{ needs.resolve_target.outputs.sdk_profile == 'service-trixie' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SDK_PROFILE: ${{ needs.resolve_target.outputs.sdk_profile }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
          INPUT_HASH: ${{ steps.sdk_inputs.outputs.input_hash }}
        run: |
          set -euo pipefail
          python3 qlever/scripts/sdk-normal-build-proof.py candidate \
            --repository "${REPOSITORY}" --profile "${SDK_PROFILE}" --target "${SDK_TARGET}" \
            --input-hash "${INPUT_HASH}" --out "${RUNNER_TEMP}/sdk-normal-proof-candidate"

      - name: Select and authenticate the retained normal SDK proof
        id: normal_select
        if: ${{ steps.normal_proof.outputs.found == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PATH: ${{ steps.normal_proof.outputs.candidate_path }}
        run: |
          set -euo pipefail
          bun scripts/select-normal-sdk-proof.ts \
            --candidate "${CANDIDATE_PATH}" \
            --out "${RUNNER_TEMP}/sdk-normal-selection.json" \
            --acquisition "${RUNNER_TEMP}/sdk-normal-selection-acquisition"

      - name: Verify runtime SDK source and fixture contracts
        run: |
          python3 qlever/scripts/verify-lock.py
          python3 -m unittest qlever.tests.test_qlever_runtime_sdk_contract
          python3 -m unittest qlever.tests.test_verify_lock
          python3 -m unittest qlever.tests.test_resolve_runtime_sdk_build
          bun test \
            qlever/tests/QleverIdCodec.test.ts \
            qlever/tests/QleverPhysicalBackendFacade.test.ts \
            qlever/tests/QleverPhysicalIndex.test.ts \
            qlever/tests/QleverPhysicalTermSyntax.test.ts \
            qlever/tests/QleverRealRuntimeBuildScript.test.ts
          bun test \
            qlever/tests/QleverAdapterOverlayContract.test.ts \
            qlever/tests/QleverInternalSortIdentityContract.test.ts \
            qlever/tests/QleverUpstream*Patch.test.ts \
            qlever/tests/QleverNativeSemanticShapes.test.ts

      - name: Set up Docker Buildx
        id: sdk_buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve SDK build mode
        id: resolve
        shell: bash
        env:
          REQUESTED_SDK_TAG: ${{ inputs.runtime_sdk_tag }}
          PRIOR_SDK_DIGEST: ${{ inputs.prior_runtime_sdk_digest }}
          QELEVER_INPUTS_TAG: ${{ steps.sdk_inputs.outputs.tag }}
          QELEVER_NORMAL_SELECTION: ${{ steps.normal_select.outputs.found == 'true' && steps.normal_select.outputs.selection_path || '' }}
          REUSE_IDENTICAL_INPUTS: ${{ needs.resolve_target.outputs.sdk_profile == 'service-trixie' && 'true' || 'false' }}
          SDK_IMAGE: ${{ env.SDK_IMAGE }}
          SDK_PROFILE: ${{ needs.resolve_target.outputs.sdk_profile }}
          RUNTIME_DOCKERFILE: ${{ needs.resolve_target.outputs.sdk_profile == 'service-trixie' && 'docker/qlever-runtime-sdk/Dockerfile.normal' || needs.resolve_target.outputs.sdk_dockerfile }}
          XPOD_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [[ '${{ needs.resolve_target.outputs.sdk_profile }}' != service-trixie && -n "$PRIOR_SDK_DIGEST" ]]; then
            echo 'Module SDK incremental bootstrap is not supported; use its original profile contract' >&2; exit 64
          fi
          bash qlever/scripts/resolve-runtime-sdk-build.sh

      - name: Require original SDK custody before module cache reuse
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12' && steps.resolve.outputs.build != 'true'
        run: |
          echo '::error::Cached module SDK requires its original build artifact tuple; image reads cannot replace the original compile/test record.'
          exit 64

      - name: Capture exact module Docker context originals
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        run: python3 qlever/scripts/sdk-image-originals.py context --out "$RUNNER_TEMP/sdk-originals" --deadline '${{ steps.source.outputs.deadline }}'

      - name: Persist the runtime SDK compiler cache
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          target: build
          platforms: ${{ needs.resolve_target.outputs.docker_platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=qlever-runtime-sdk-${{ needs.resolve_target.outputs.sdk_profile }}-${{ needs.resolve_target.outputs.target }}
          cache-to: type=gha,mode=max,scope=qlever-runtime-sdk-${{ needs.resolve_target.outputs.sdk_profile }}-${{ needs.resolve_target.outputs.target }}
          build-args: |
            XPOD_QLEVER_BUILD_JOBS=${{ env.XPOD_QLEVER_BUILD_JOBS }}
            XPOD_QLEVER_PRIOR_SDK_IMAGE=${{ steps.resolve.outputs.prior_image }}
            XPOD_QLEVER_SDK_DEADLINE_UNIX=${{ steps.source.outputs.deadline }}
            XPOD_QLEVER_SDK_IDENTITY=${{ steps.source.outputs.identity }}
            XPOD_QLEVER_NORMAL_INPUT_HASH=${{ steps.sdk_inputs.outputs.input_hash }}

      - name: Build the exact runtime SDK image
        id: build
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: ${{ needs.resolve_target.outputs.docker_platform }}
          no-cache-filters: ${{ needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12' && 'build,linked-verification' || '' }}
          load: true
          push: false
          tags: |
            ${{ env.SDK_IMAGE }}:${{ steps.resolve.outputs.tag }}
            ${{ env.SDK_IMAGE }}:${{ steps.sdk_inputs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=qlever-runtime-sdk-${{ needs.resolve_target.outputs.sdk_profile }}-${{ needs.resolve_target.outputs.target }}
          cache-to: type=gha,mode=max,scope=qlever-runtime-sdk-${{ needs.resolve_target.outputs.sdk_profile }}-${{ needs.resolve_target.outputs.target }}
          build-args: |
            XPOD_QLEVER_BUILD_JOBS=${{ env.XPOD_QLEVER_BUILD_JOBS }}
            XPOD_QLEVER_PRIOR_SDK_IMAGE=${{ steps.resolve.outputs.prior_image }}
            XPOD_QLEVER_SDK_DEADLINE_UNIX=${{ steps.source.outputs.deadline }}
            XPOD_QLEVER_SDK_IDENTITY=${{ steps.source.outputs.identity }}
            XPOD_QLEVER_NORMAL_INPUT_HASH=${{ steps.sdk_inputs.outputs.input_hash }}

      - name: Build actual cold module SDK with owned raw streams
        id: module_build
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        env:
          SDK_PLATFORM: ${{ needs.resolve_target.outputs.docker_platform }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
          SDK_PRIMARY_TAG: ${{ steps.resolve.outputs.tag }}
          SDK_ALIAS_TAG: ${{ steps.sdk_inputs.outputs.tag }}
          SDK_BUILD_JOBS: ${{ env.XPOD_QLEVER_BUILD_JOBS }}
          SDK_IDENTITY: ${{ steps.source.outputs.identity }}
          BUILDX_METADATA_PROVENANCE: max
          BUILDX_METADATA_WARNINGS: 'true'
        run: python3 qlever/scripts/sdk-image-originals.py build --builder '${{ steps.sdk_buildx.outputs.name }}' --out "$RUNNER_TEMP/sdk-originals" --deadline '${{ steps.source.outputs.deadline }}'

      - name: Verify the retained normal SDK OCI digest
        if: needs.resolve_target.outputs.sdk_profile == 'service-trixie' && steps.resolve.outputs.build != 'true' && steps.resolve.outputs.image_ref != ''
        shell: bash
        env:
          REUSED_IMAGE: ${{ steps.resolve.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REUSED_IMAGE}" >/dev/null

      - name: Smoke the exact SDK image before publishing
        if: needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        # A reused image is verified exactly like a freshly built one: reuse claims
        # the inputs are identical, and this is what checks the claim is usable.
        shell: bash
        env:
          BUILD_IMAGE: ${{ steps.resolve.outputs.build }}
          REUSED_IMAGE: ${{ steps.resolve.outputs.image_ref }}
          SDK_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_IMAGE}" == 'true' ]]; then
            image="${SDK_IMAGE}:${SDK_TAG}"
          elif [[ -n "${REUSED_IMAGE}" ]]; then
            image="${REUSED_IMAGE}"
          else
            image="${SDK_IMAGE}:${SDK_TAG}"
          fi
          docker run --rm --entrypoint /bin/sh \
            "${image}" -ceu '
              test -f /opt/qlever-sdk/source/src/libqlever/Qlever.h
              test -f /opt/qlever-sdk/build/.xpod-build-identity
              test -f /opt/qlever-sdk/build/.xpod-build-contract.json
              test -f /opt/qlever-sdk/build/CMakeFiles/qlever-server.dir/link.txt
              test -d /components/qlever/cmake
              test -d /components/qlever/qlever_adapter
              test -d /components/qlever/rdf_protocol
              test -d /components/qlever/backend_contract
              test -d /components/qlever/candidate_contract
              test -f /components/qlever/scripts/check-qlever-real-runtime.cjs
              test ! -e /components/qlever/qlever_pg_extension
              test ! -e /components/pg-rdf-extension
            '

      # Reuse this builder's hot cache; the daemon's load/push round trip can
      # lose registry blob references even when the loaded image runs correctly.
      - name: Push the tested SDK through BuildKit
        id: push
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: ${{ needs.resolve_target.outputs.docker_platform }}
          push: true
          tags: |
            ${{ env.SDK_IMAGE }}:${{ steps.resolve.outputs.tag }}
            ${{ env.SDK_IMAGE }}:${{ steps.sdk_inputs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          build-args: |
            XPOD_QLEVER_BUILD_JOBS=${{ env.XPOD_QLEVER_BUILD_JOBS }}
            XPOD_QLEVER_PRIOR_SDK_IMAGE=${{ steps.resolve.outputs.prior_image }}
            XPOD_QLEVER_SDK_DEADLINE_UNIX=${{ steps.source.outputs.deadline }}
            XPOD_QLEVER_SDK_IDENTITY=${{ steps.source.outputs.identity }}
            XPOD_QLEVER_NORMAL_INPUT_HASH=${{ steps.sdk_inputs.outputs.input_hash }}

      - name: Push exact tested module SDK from the same builder cache
        id: module_push
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        env:
          SDK_PLATFORM: ${{ needs.resolve_target.outputs.docker_platform }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
          SDK_PRIMARY_TAG: ${{ steps.resolve.outputs.tag }}
          SDK_ALIAS_TAG: ${{ steps.sdk_inputs.outputs.tag }}
          SDK_BUILD_JOBS: ${{ env.XPOD_QLEVER_BUILD_JOBS }}
          SDK_IDENTITY: ${{ steps.source.outputs.identity }}
          BUILDX_METADATA_PROVENANCE: max
          BUILDX_METADATA_WARNINGS: 'true'
        run: python3 qlever/scripts/sdk-image-originals.py push --builder '${{ steps.sdk_buildx.outputs.name }}' --out "$RUNNER_TEMP/sdk-originals" --deadline '${{ steps.source.outputs.deadline }}'

      - name: Require the published image to match the tested image
        id: image_identity
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        shell: bash
        env:
          SMOKED_IMAGE_ID: ${{ steps.module_build.outputs.imageid || steps.build.outputs.imageid }}
          PUBLISHED_IMAGE: ${{ env.SDK_IMAGE }}@${{ steps.module_push.outputs.digest || steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          node scripts/verify-published-image.cjs "${SMOKED_IMAGE_ID}" "${PUBLISHED_IMAGE}"

      - name: Publish and resolve the immutable digest
        id: publish
        shell: bash
        env:
          BUILD_IMAGE: ${{ steps.resolve.outputs.build }}
          REUSED_IMAGE: ${{ steps.resolve.outputs.image_ref }}
          PUSHED_DIGEST: ${{ steps.module_push.outputs.digest || steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_IMAGE}" == 'true' ]]; then
            digest="${PUSHED_DIGEST}"
          elif [[ -n "${REUSED_IMAGE}" ]]; then
            digest="${REUSED_IMAGE##*@}"
          else
            tag="${SDK_IMAGE}:${{ steps.resolve.outputs.tag }}"
            digest="$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image=${SDK_IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      # The identity alias is what a later run with unchanged inputs reuses, so every
      # image this workflow blesses publishes one. It is append-only: if the name
      # already resolves, the existing image keeps it (it was built from the same
      # inputs, which is all the name claims), and a differing digest is reported
      # rather than silently overwritten.
      - name: Publish the QLever build inputs alias
        id: alias
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          alias_tag="${SDK_IMAGE}:${{ steps.sdk_inputs.outputs.tag }}"
          alias_digest="$(docker buildx imagetools inspect "${alias_tag}" \
            --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if [[ -z "${alias_digest}" ]]; then
            docker buildx imagetools create --tag "${alias_tag}" "${PUBLISHED_IMAGE}"
            echo "created=${alias_tag}" >> "${GITHUB_OUTPUT}"
          elif [[ "${PUBLISHED_IMAGE}" == *"@${alias_digest}" ]]; then
            echo "kept=${alias_tag} (already this image)" >> "${GITHUB_OUTPUT}"
          else
            echo "kept=${alias_tag} (already ${alias_digest}; this run produced ${{ steps.publish.outputs.digest }})" >> "${GITHUB_OUTPUT}"
          fi
          docker buildx imagetools inspect "${alias_tag}" >/dev/null

      - name: Capture normal SDK build proof and originals
        id: normal_originals
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ steps.source.outputs.commit }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SDK_IMAGE_REF: ${{ steps.publish.outputs.image }}
          SDK_INPUT_IDENTITY: ${{ steps.sdk_inputs.outputs.identity_path }}
          SDK_INPUT_HASH: ${{ steps.sdk_inputs.outputs.input_hash }}
          SDK_PROFILE: ${{ needs.resolve_target.outputs.sdk_profile }}
          SDK_TARGET: ${{ needs.resolve_target.outputs.target }}
          RUN_HEAD_SHA: ${{ steps.source.outputs.run_head_sha }}
          RESOLVED_DOCKERFILE: ${{ steps.resolve.outputs.dockerfile }}
          PRIOR_IMAGE: ${{ steps.resolve.outputs.prior_image }}
          DEADLINE: ${{ steps.source.outputs.deadline }}
        run: |
          set -euo pipefail
          python3 qlever/scripts/sdk-normal-build-proof.py collect \
            --source "$GITHUB_WORKSPACE" --source-commit "${SOURCE_COMMIT}" \
            --profile "${SDK_PROFILE}" --target "${SDK_TARGET}" \
            --identity "${SDK_INPUT_IDENTITY}" --input-hash "${SDK_INPUT_HASH}" \
            --image "${SDK_IMAGE_REF}" --run-head-sha "${RUN_HEAD_SHA}" \
            --dockerfile "${RESOLVED_DOCKERFILE}" \
            --prior-sdk-digest "${PRIOR_IMAGE##*@}" --deadline "${DEADLINE}" \
            --out "$RUNNER_TEMP/sdk-normal-originals"

      - name: Upload the exact normal SDK build originals
        timeout-minutes: 10
        id: normal_upload
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlever-sdk-originals-service-trixie-${{ needs.resolve_target.outputs.target }}-${{ steps.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-normal-originals/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Write the normal SDK proof index
        id: normal_index
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        shell: bash
        env:
          MASTER_BYTES: ${{ steps.normal_originals.outputs.master_bytes }}
          MASTER_SHA256: ${{ steps.normal_originals.outputs.master_sha256 }}
          ARTIFACT_ID: ${{ steps.normal_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.normal_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 qlever/scripts/sdk-normal-build-proof.py index \
            --proof "$RUNNER_TEMP/sdk-normal-originals/normal-build-proof.json" \
            --out "$RUNNER_TEMP/sdk-normal-proof-index" \
            --artifact-id "${ARTIFACT_ID}" --artifact-digest "${ARTIFACT_DIGEST}" \
            --master-bytes "${MASTER_BYTES}" --master-sha256 "${MASTER_SHA256}"

      - name: Upload the exact normal SDK build proof
        timeout-minutes: 10
        id: normal_proof_upload
        if: steps.resolve.outputs.build == 'true' && needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlever-sdk-normal-proof-${{ needs.resolve_target.outputs.sdk_profile }}-${{ needs.resolve_target.outputs.target }}-${{ steps.sdk_inputs.outputs.input_hash }}
          path: ${{ runner.temp }}/sdk-normal-proof-index/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Emit normal SDK provenance outputs
        id: normal_emit
        if: needs.resolve_target.outputs.sdk_profile == 'service-trixie'
        shell: bash
        env:
          BUILD_IMAGE: ${{ steps.resolve.outputs.build }}
          PROOF_FOUND: ${{ steps.normal_select.outputs.found }}
          BUILT_ARTIFACT_ID: ${{ steps.normal_upload.outputs.artifact-id }}
          BUILT_ARTIFACT_DIGEST: ${{ steps.normal_upload.outputs.artifact-digest }}
          BUILT_MASTER_BYTES: ${{ steps.normal_originals.outputs.master_bytes }}
          BUILT_MASTER_SHA256: ${{ steps.normal_originals.outputs.master_sha256 }}
          BUILT_SOURCE_SHA: ${{ steps.source.outputs.commit }}
          BUILT_RUN_HEAD_SHA: ${{ steps.source.outputs.run_head_sha }}
          BUILT_RUN_ID: ${{ github.run_id }}
          BUILT_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILT_INPUT_HASH: ${{ steps.sdk_inputs.outputs.input_hash }}
          REUSED_ARTIFACT_ID: ${{ steps.normal_select.outputs.artifact_id }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.normal_select.outputs.artifact_digest }}
          REUSED_MASTER_BYTES: ${{ steps.normal_select.outputs.master_bytes }}
          REUSED_MASTER_SHA256: ${{ steps.normal_select.outputs.master_sha256 }}
          REUSED_SOURCE_SHA: ${{ steps.normal_select.outputs.source_sha }}
          REUSED_RUN_HEAD_SHA: ${{ steps.normal_select.outputs.run_head_sha }}
          REUSED_RUN_ID: ${{ steps.normal_select.outputs.run_id }}
          REUSED_RUN_ATTEMPT: ${{ steps.normal_select.outputs.run_attempt }}
          REUSED_INPUT_HASH: ${{ steps.normal_select.outputs.input_hash }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_IMAGE}" == 'true' ]]; then
            artifact_id="${BUILT_ARTIFACT_ID}"; artifact_digest="${BUILT_ARTIFACT_DIGEST#sha256:}"
            master_bytes="${BUILT_MASTER_BYTES}"; master_sha256="${BUILT_MASTER_SHA256}"
            source_sha="${BUILT_SOURCE_SHA}"; run_head_sha="${BUILT_RUN_HEAD_SHA}"
            run_id="${BUILT_RUN_ID}"; run_attempt="${BUILT_RUN_ATTEMPT}"; input_hash="${BUILT_INPUT_HASH}"
          elif [[ "${PROOF_FOUND}" == 'true' ]]; then
            artifact_id="${REUSED_ARTIFACT_ID}"; artifact_digest="${REUSED_ARTIFACT_DIGEST#sha256:}"
            master_bytes="${REUSED_MASTER_BYTES}"; master_sha256="${REUSED_MASTER_SHA256}"
            source_sha="${REUSED_SOURCE_SHA}"; run_head_sha="${REUSED_RUN_HEAD_SHA}"
            run_id="${REUSED_RUN_ID}"; run_attempt="${REUSED_RUN_ATTEMPT}"; input_hash="${REUSED_INPUT_HASH}"
          else
            echo '::error::The ordinary SDK route requires a freshly built normal proof or a retained proof artifact; a bare image tag is not admission evidence.' >&2
            exit 64
          fi
          for value in "${artifact_id}" "${master_bytes}"; do [[ "$value" =~ ^[1-9][0-9]*$ ]] || exit 64; done
          for value in "${artifact_digest}" "${master_sha256}" "${input_hash}"; do [[ "$value" =~ ^[a-f0-9]{64}$ ]] || exit 64; done
          for value in "${source_sha}" "${run_head_sha}"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]] || exit 64; done
          {
            echo "sdk_artifact_id=${artifact_id}"
            echo "sdk_artifact_digest=${artifact_digest}"
            echo "sdk_master_bytes=${master_bytes}"
            echo "sdk_master_sha256=${master_sha256}"
            echo "sdk_source_sha=${source_sha}"
            echo "sdk_run_head_sha=${run_head_sha}"
            echo "sdk_run_id=${run_id}"
            echo "sdk_run_attempt=${run_attempt}"
            echo "sdk_build_model=normal-build-v1"
            echo "sdk_input_hash=${input_hash}"
          } >> "${GITHUB_OUTPUT}"

      - name: Bind actual SDK image and build originals
        id: sdk_originals
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 qlever/scripts/sdk-image-originals.py collect --image '${{ steps.publish.outputs.image }}' --target '${{ needs.resolve_target.outputs.target }}' --out "$RUNNER_TEMP/sdk-originals" --deadline '${{ steps.source.outputs.deadline }}'

      - name: Upload exact SDK original materials
        timeout-minutes: 10
        id: sdk_upload
        if: needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlever-sdk-originals-${{ needs.resolve_target.outputs.target }}-${{ steps.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-originals/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Retain failed SDK command originals
        timeout-minutes: 10
        if: failure() && needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlever-sdk-diagnostics-${{ needs.resolve_target.outputs.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-originals/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Record the SDK image
        shell: bash
        run: |
          {
            echo '## QLever runtime SDK image'
            echo
            echo '${{ steps.publish.outputs.image }}'
            echo
            echo "Reused identical inputs: \`${{ steps.resolve.outputs.reused_inputs }}\`"
            echo "Build inputs alias: \`${{ steps.sdk_inputs.outputs.tag }}\`"
            echo "Alias: \`${{ steps.alias.outputs.created || steps.alias.outputs.kept }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The reusable route owns the sole reviewed controller closure bootstrap.
  # It executes before candidate host code; only its publisher role receives
  # registry credentials. Pull requests collect originals without pushing.
  readonly_publish:
    if: ${{ github.event_name == 'pull_request' || inputs.readonly_executor }}
    needs: resolve_target
    uses: ./.github/workflows/qlever-readonly-executor.yml
    with:
      target: ${{ needs.resolve_target.outputs.target }}
      sdk_profile: ${{ needs.resolve_target.outputs.sdk_profile }}
      source_commit: ${{ inputs.source_commit || github.sha }}
      publish: ${{ github.event_name != 'pull_request' }}

  module_runtime_materials:
    # The registered SDK workflow is the entry point even before the new
    # reusable archive workflow exists on the repository default branch.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.resolve_target.outputs.sdk_profile == 'module-bookworm-gcc12' && (needs.publish.result == 'success' || needs.readonly_publish.result == 'success') }}
    needs: [resolve_target, publish, readonly_publish]
    uses: ./.github/workflows/build-qlever-linux-runtime.yml
    with:
      target: ${{ needs.resolve_target.outputs.target }}
      module_sdk_image: ${{ needs.readonly_publish.outputs.image || needs.publish.outputs.image }}
      sdk_artifact_id: ${{ needs.readonly_publish.outputs.sdk_artifact_id || needs.publish.outputs.sdk_artifact_id }}
      sdk_artifact_digest: ${{ needs.readonly_publish.outputs.sdk_artifact_digest || needs.publish.outputs.sdk_artifact_digest }}
      sdk_master_sha256: ${{ needs.readonly_publish.outputs.sdk_master_sha256 || needs.publish.outputs.sdk_master_sha256 }}
      sdk_master_bytes: ${{ needs.readonly_publish.outputs.sdk_master_bytes || needs.publish.outputs.sdk_master_bytes }}
