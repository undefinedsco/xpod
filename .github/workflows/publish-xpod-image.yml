name: Publish Xpod image

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact public xpod source commit to build
        required: true
        type: string
      qlever-local-runtime-image:
        description: Immutable xpod-qlever-local-runtime image used by the server image
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-xpod-image-${{ inputs.source_commit }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/xpod

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Resolve immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          QLEVER_LOCAL_RUNTIME_IMAGE: ${{ inputs.qlever-local-runtime-image }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]] \
            || { echo 'source_commit must be a 40-character lowercase commit SHA' >&2; exit 64; }
          [[ "${QLEVER_LOCAL_RUNTIME_IMAGE}" =~ ^[A-Za-z0-9._:/-]+@sha256:[a-f0-9]{64}$ ]] \
            || { echo 'qlever-local-runtime-image must be immutable repository@sha256' >&2; exit 64; }
          echo "commit=${REQUESTED_SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "tag=sha-${REQUESTED_SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Xpod server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: server
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=xpod-server
          cache-to: type=gha,mode=max,scope=xpod-server
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ inputs.qlever-local-runtime-image }}

      - name: Resolve immutable digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:${{ steps.source.outputs.tag }}"
          digest="$(docker buildx imagetools inspect "${tag}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record the Xpod image
        shell: bash
        run: |
          {
            echo '## Xpod image'
            echo
            echo '${{ steps.publish.outputs.image }}'
          } >> "${GITHUB_STEP_SUMMARY}"
