name: Repair obsolete production database references

# One-off recovery on this branch; the default-branch configuration sync stays intact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: co
    timeout-minutes: 20
    concurrency:
      group: deploy-co
      cancel-in-progress: false
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
      XPOD_SECRET_NAME: ${{ vars.XPOD_RUNTIME_SECRET_NAME }}
      XPOD_DEPLOYMENT: xpod-co
      PUBLIC_BASE_URL: ${{ vars.XPOD_PUBLIC_BASE_URL }}
    steps:
      - name: Set up existing production access
        run: |
          set -euo pipefail
          test -n "$SEALOS_NAMESPACE"
          test -n "$XPOD_SECRET_NAME"
          test -n "$PUBLIC_BASE_URL"
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Remove only the two obsolete database references
        run: |
          set -euo pipefail
          deployment_file="$RUNNER_TEMP/deployment.json"
          patch_file="$RUNNER_TEMP/database-reference-patch.json"
          kubectl -n "$SEALOS_NAMESPACE" get secret "$XPOD_SECRET_NAME" -o json |
            jq -e '.data | (.CSS_IDENTITY_DB_URL | length > 0) and (.CSS_SPARQL_ENDPOINT | length > 0)' > /dev/null
          kubectl -n "$SEALOS_NAMESPACE" get deployment "$XPOD_DEPLOYMENT" -o json > "$deployment_file"
          jq -e --arg container "$XPOD_DEPLOYMENT" --arg secret "$XPOD_SECRET_NAME" '
            [.spec.template.spec.containers[] | select(.name == $container)] |
            length == 1 and (.[0].envFrom | any(.secretRef.name == $secret))' "$deployment_file" > /dev/null
          jq --arg container "$XPOD_DEPLOYMENT" --arg secret "$XPOD_SECRET_NAME" '
            [{op: "test", path: "/metadata/resourceVersion", value: .metadata.resourceVersion}] +
            [.spec.template.spec.containers | to_entries[] as $containerEntry |
              select($containerEntry.value.name == $container) |
              ($containerEntry.value.env // [] | to_entries | reverse[]) |
              select((.value.name == "CSS_IDENTITY_DB_URL" or .value.name == "CSS_SPARQL_ENDPOINT") and
                .value.valueFrom.secretKeyRef.name == $secret and .value.valueFrom.secretKeyRef.key == "connection-url") |
              ("/spec/template/spec/containers/\($containerEntry.key)/env/\(.key)") as $path |
              {op: "test", path: $path, value: .value}, {op: "remove", path: $path}]' "$deployment_file" > "$patch_file"
          removals="$(jq '[.[] | select(.op == "remove")] | length' "$patch_file")"
          if [[ "$removals" == 0 ]]; then
            echo "Obsolete database references are already absent"
          elif [[ "$removals" == 2 ]]; then
            cat "$patch_file"
            kubectl -n "$SEALOS_NAMESPACE" patch deployment "$XPOD_DEPLOYMENT" --type=json --patch-file="$patch_file"
          else
            echo "::error::unexpected reference count; refusing a partial repair"
            exit 1
          fi
          kubectl -n "$SEALOS_NAMESPACE" rollout status "deployment/$XPOD_DEPLOYMENT" --timeout=900s

      - name: Verify public service remains available
        run: |
          set -euo pipefail
          for path in service/status .well-known/openid-configuration; do
            curl --fail --silent --show-error --max-time 15 "$PUBLIC_BASE_URL/$path" > /dev/null
          done

      - name: Capture waiting reasons if the repair fails
        if: failure()
        run: |
          kubectl -n "$SEALOS_NAMESPACE" get pods -l "app=$XPOD_DEPLOYMENT" -o json |
            jq '[.items[] | {name: .metadata.name, phase: .status.phase,
              containers: [.status.containerStatuses[]? | {name, ready, restartCount, imageID, state, lastState}]}]'
