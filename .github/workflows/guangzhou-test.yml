name: Deploy Guangzhou test

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-guangzhou-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/undefinedsco/xpod
  QLEVER_LOCAL_RUNTIME_IMAGE: ghcr.io/undefinedsco/xpod-qlever-local-runtime@sha256:47e14c13b40bdf112648bc6b2f4f869fb973612b6b764f2758bb583f11f6f991
  GZ_CLUSTER_SERVER: https://gzg.sealos.run:6443
  GZ_NAMESPACE: ns-iknkxtc8
  GZ_DEPLOYMENT: xpod-rc
  GZ_CONTAINER: xpod
  GZ_STORAGE_SECRET: xpod-rc-secret
  GZ_HEALTH_URL: https://undefineds-gz-rc-id.sealosgzg.site/service/status

jobs:
  validate-build-publish:
    if: >-
      github.ref == 'refs/heads/test' &&
      (github.event_name == 'workflow_dispatch' || vars.GZ_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Type check
        run: bun run build:ts

      - name: Build Components artifacts
        run: bun run build:components

      - name: Unit tests
        env:
          XPOD_QLEVER_LOCAL_RUNTIME_COMMAND: ${{ github.workspace }}/tests/fixtures/fake-qlever-native-runtime.js
        run: bun run test:run

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:test
            ${{ env.IMAGE_REPOSITORY }}:test-${{ github.sha }}
          cache-from: type=gha,scope=xpod-guangzhou-test
          cache-to: type=gha,mode=max,scope=xpod-guangzhou-test
          build-args: |
            XPOD_QLEVER_LOCAL_RUNTIME_IMAGE=${{ env.QLEVER_LOCAL_RUNTIME_IMAGE }}

  deploy:
    needs: validate-build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.GZ_KUBE_CONFIG_DATA }}
      TARGET_IMAGE: ghcr.io/undefinedsco/xpod@${{ needs.validate-build-publish.outputs.digest }}
    steps:
      - name: Validate deployment boundary
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::GZ_KUBE_CONFIG_DATA is required"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          actual_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ "$actual_server" != "$GZ_CLUSTER_SERVER" ]; then
            echo "::error::refusing unexpected cluster: $actual_server"
            exit 1
          fi
          if ! kubectl auth can-i patch "deployment/$GZ_DEPLOYMENT" -n "$GZ_NAMESPACE" | grep -qx yes; then
            echo "::error::deployer cannot patch $GZ_NAMESPACE/$GZ_DEPLOYMENT"
            exit 1
          fi
          if kubectl auth can-i patch deployment/xpod-cloud -n "$GZ_NAMESPACE" | grep -qx yes; then
            echo "::error::deployer must not be able to patch xpod-cloud"
            exit 1
          fi

          storage_secret_refs="$(kubectl -n "$GZ_NAMESPACE" get deployment "$GZ_DEPLOYMENT" \
            -o 'jsonpath={range .spec.template.spec.containers[?(@.name=="xpod")].envFrom[*]}{.secretRef.name}{"\n"}{end}')"
          if ! printf '%s\n' "$storage_secret_refs" | grep -Fxq "$GZ_STORAGE_SECRET"; then
            echo "::error::$GZ_DEPLOYMENT must load R2 settings from $GZ_STORAGE_SECRET"
            exit 1
          fi

          data_mounts="$(kubectl -n "$GZ_NAMESPACE" get deployment "$GZ_DEPLOYMENT" \
            -o 'jsonpath={range .spec.template.spec.containers[?(@.name=="xpod")].volumeMounts[*]}{.name}:{.mountPath}{"\n"}{end}')"
          if ! printf '%s\n' "$data_mounts" | grep -Fxq 'xpod-data:/app/data'; then
            echo "::error::$GZ_DEPLOYMENT must mount xpod-data at /app/data"
            exit 1
          fi

      - name: Deploy immutable image
        id: deploy
        run: |
          set -euo pipefail
          previous_image="$(kubectl -n "$GZ_NAMESPACE" get deployment "$GZ_DEPLOYMENT" -o "jsonpath={.spec.template.spec.containers[?(@.name=='$GZ_CONTAINER')].image}")"
          if [ -z "$previous_image" ]; then
            echo "::error::current $GZ_DEPLOYMENT image is missing"
            exit 1
          fi
          echo "previous_image=$previous_image" >> "$GITHUB_OUTPUT"
          kubectl -n "$GZ_NAMESPACE" patch "deployment/$GZ_DEPLOYMENT" --type=strategic -p "$(node - <<'NODE'
          process.stdout.write(JSON.stringify({
            spec: {
              template: {
                spec: {
                  containers: [
                    {
                      name: 'xpod',
                      args: [
                        'node',
                        'dist/main.js',
                        '-c',
                        'config/cloud.json',
                        '-p',
                        '3000',
                      ],
                      env: [
                        {
                          name: 'CSS_ROOT_FILE_PATH',
                          value: '/app/data',
                        },
                      ],
                    },
                  ],
                },
              },
            },
          }));
          NODE
          )"
          kubectl -n "$GZ_NAMESPACE" set image "deployment/$GZ_DEPLOYMENT" "$GZ_CONTAINER=$TARGET_IMAGE"
          kubectl -n "$GZ_NAMESPACE" rollout status "deployment/$GZ_DEPLOYMENT" --timeout=900s

          deployed_image="$(kubectl -n "$GZ_NAMESPACE" get deployment "$GZ_DEPLOYMENT" -o "jsonpath={.spec.template.spec.containers[?(@.name=='$GZ_CONTAINER')].image}")"
          if [ "$deployed_image" != "$TARGET_IMAGE" ]; then
            echo "::error::deployed image mismatch: $deployed_image"
            exit 1
          fi

      - name: Verify public health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 15 "$GZ_HEALTH_URL")" && \
              printf '%s' "$response" | grep -q '"status":"running"'; then
              echo "Guangzhou xpod-rc is healthy"
              exit 0
            fi
            echo "Health check attempt $attempt/30 is not ready"
            sleep 10
          done
          echo "::error::Guangzhou xpod-rc health check failed"
          exit 1

      - name: Roll back failed deployment
        if: failure() && steps.deploy.outputs.previous_image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
        run: |
          set -euo pipefail
          kubectl -n "$GZ_NAMESPACE" set image "deployment/$GZ_DEPLOYMENT" "$GZ_CONTAINER=$PREVIOUS_IMAGE"
          kubectl -n "$GZ_NAMESPACE" rollout status "deployment/$GZ_DEPLOYMENT" --timeout=900s

      - name: Collect deployment diagnostics
        if: always()
        run: |
          kubectl -n "$GZ_NAMESPACE" get deployment "$GZ_DEPLOYMENT" -o wide || true
          kubectl -n "$GZ_NAMESPACE" get pods -l app="$GZ_DEPLOYMENT" -o wide || true
          kubectl -n "$GZ_NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
