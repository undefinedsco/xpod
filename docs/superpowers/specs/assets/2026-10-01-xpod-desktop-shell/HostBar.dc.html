<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>内容栏右上角</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button:focus-visible{outline:2px solid #563E84;outline-offset:2px}
</style>
</helmet>
<div style="width: 220px; height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-family: 'PingFang SC','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif; color: #2B2621">
<span role="status" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #655D53; margin-right: 6px"><span aria-hidden="true" style="{{dotStyle}}"></span>{{sync}}</span>
<button type="button" aria-label="{{noticeLabel}}" style="position: relative; width: 36px; height: 36px; border: 0; border-radius: 8px; background: {{noticeBg}}; color: #2B2621; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"></path></svg>
<sc-if value="{{hasNotice}}" hint-placeholder-val="{{no}}"><span aria-hidden="true" style="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #8A6A12; border: 2px solid #F7F4ED"></span></sc-if>
</button>
<button type="button" aria-label="{{inboxLabel}}" style="position: relative; width: 36px; height: 36px; border: 0; border-radius: 8px; background: {{inboxBg}}; color: #2B2621; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5M5 5h14l2 8v6H3v-6z"></path></svg>
<sc-if value="{{hasInbox}}" hint-placeholder-val="{{no}}"><span aria-hidden="true" style="position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #563E84; color: #F7F4ED; font-size: 11px; font-weight: 600; line-height: 16px; text-align: center">{{inbox}}</span></sc-if>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sync":{"editor":"text","default":"实时"},"tone":{"editor":"enum","options":["ok","busy","warn","off"],"default":"ok"},"notices":{"editor":"int","default":0},"inbox":{"editor":"int","default":2},"open":{"editor":"enum","options":["none","notice","inbox"],"default":"none"},"$preview":{"width":220,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'ok';
    const color = { ok: '#2F6B55', busy: '#563E84', warn: '#8A6A12', off: '#87837D' }[tone] || '#2F6B55';
    const notices = Number(this.props.notices ?? 0);
    const inbox = Number(this.props.inbox ?? 2);
    const open = this.props.open ?? 'none';
    return {
      yes: true, no: false,
      sync: this.props.sync ?? '实时',
      dotStyle: 'width: 7px; height: 7px; border-radius: 50%; ' + (tone === 'off' ? 'border: 1.5px solid ' + color + '; box-sizing: border-box' : 'background: ' + color),
      hasNotice: notices > 0, hasInbox: inbox > 0, inbox,
      noticeLabel: notices > 0 ? '通知，' + notices + ' 条需要处理' : '通知',
      inboxLabel: inbox > 0 ? '收件箱，' + inbox + ' 条未读' : '收件箱',
      noticeBg: open === 'notice' ? '#E9E4E4' : 'transparent',
      inboxBg: open === 'inbox' ? '#E9E4E4' : 'transparent'
    };
  }
}
</script>
</body>
</html>
