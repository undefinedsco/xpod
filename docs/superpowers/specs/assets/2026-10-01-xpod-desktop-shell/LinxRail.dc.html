<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LinX rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #563E84;outline-offset:2px}
</style>
</helmet>
<div style="width: 64px; height: {{h}}px; box-sizing: border-box; background: #EBE5D8; border-right: 1px solid #DFDBD5; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; font-family: 'PingFang SC','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
<button type="button" title="小林" aria-label="小林，打开个人卡片" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #563E84; color: #F7F4ED; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; padding: 0">林</button>
<nav aria-label="LinX" style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px">
<sc-for list="{{own}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" title="{{it.label}}" aria-label="{{it.label}}" aria-current="{{it.current}}" style="{{it.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg></a>
</sc-for>
</nav>
<div style="width: 24px; height: 1px; background: #DFDBD5; margin: 6px 0"></div>
<nav aria-label="共用应用" style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{shared}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" title="{{it.label}}" aria-label="{{it.label}}" aria-current="{{it.current}}" style="{{it.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg></a>
</sc-for>
</nav>
<div style="flex-grow: 1"></div>
<a href="#" title="设置" aria-label="设置" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#655D53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["task","ai","pod"],"default":"ai"},"h":{"editor":null,"default":800},"$preview":{"width":64,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'ai';
    const item = (id, label, href, d) => {
      const on = id === active;
      return {
        label, href, d,
        current: on ? 'page' : 'false',
        stroke: on ? '#563E84' : '#655D53',
        style: 'width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #F7F4ED' : 'background: transparent')
      };
    };
    return {
      h: Number(this.props.h ?? 800),
      own: [
        item('work', '[LinX] 工作', '#', 'M4 7h16v12H4zM9 7V5h6v2'),
        item('knowledge', '[LinX] 知识', '#', 'M5 4h10l4 4v12H5zM15 4v4h4M8 12h8M8 16h6'),
        item('myai', '[LinX] 我的 AI', '#', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z')
      ],
      shared: [
        item('task', '任务', 'LinxTask.dc.html', 'M9 11l2 2 4-4M5 4h14v16H5zM9 2v4M15 2v4'),
        item('ai', 'AI 连接', 'LinxAi.dc.html', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z'),
        item('pod', 'Pod', 'LinxPod.dc.html', 'M3 5c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3zM3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3')
      ]
    };
  }
}
</script>
</body>
</html>
